<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cartea de rețete</title>
<style>
:root{--fundal:#f6f0e4;--hartie:#fffdf8;--text:#1f1a14;--mut:#7d7365;--linie:#e4dccb;--accent:#b3462b;--activ:#f9e6d8;
  --verde:#2f6b4f;--verde-fundal:#e3efe6;--ambra:#a8720f;--ambra-fundal:#f8ecd2;--gri:#8a8174;--gri-fundal:#ece7de;--umbra:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06)}
@media (prefers-color-scheme: dark){:root{--fundal:#171411;--hartie:#221e19;--text:#efe8dc;--mut:#a89e8f;--linie:#38312a;--accent:#e58a6a;--activ:#3f2a22;
  --verde:#7cc79d;--verde-fundal:#1f3b2d;--ambra:#e2b04e;--ambra-fundal:#3d2f12;--gri:#a39a8c;--gri-fundal:#2e2924;--umbra:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundal);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
h1,h2,.serif{font-family:ui-serif,Georgia,"Noto Serif","Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* antet listă */
header{position:sticky;top:0;z-index:2;background:var(--fundal);padding:.7rem .9rem .6rem;border-bottom:1px solid var(--linie)}
header>div,main,article{max-width:720px;margin:0 auto}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;margin-bottom:.55rem}
h1{margin:0;font-size:1.7rem;line-height:1.1}
h1 small{display:block;font:500 .78rem/1.3 system-ui,sans-serif;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-top:.15rem}
input[type=search],input[type=text],input[type=date],textarea{width:100%;font-size:1rem;padding:.55rem .8rem;border:1px solid var(--linie);border-radius:12px;background:var(--hartie);color:inherit}
textarea{min-height:4.2rem;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem;align-items:center}
.chips.linie{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.linie::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linie);background:var(--hartie);border-radius:999px;padding:.28rem .75rem;font-size:.88rem;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.activ{background:var(--text);border-color:var(--text);color:var(--fundal)}
.chip.fix{background:var(--verde-fundal);border-color:transparent;color:var(--verde);font-weight:600;cursor:default}
.chip.actiune{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.mare{font-size:1.05rem;padding:.55rem 1.1rem}
.eticheta{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-right:.2rem;white-space:nowrap}
/* carduri */
main{padding:.9rem .9rem 6rem}
.card{display:grid;grid-template-columns:3.4rem 1fr;gap:.8rem;position:relative;background:var(--hartie);border-radius:16px;padding:.85rem .9rem .85rem .85rem;margin-bottom:.75rem;text-decoration:none;color:inherit;box-shadow:var(--umbra);border-left:5px solid var(--cat,var(--accent));transition:transform .12s}
.card:active{transform:scale(.985)}
.initiala{position:relative;overflow:hidden;width:3.4rem;height:3.4rem;border-radius:12px;background:var(--cat,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;line-height:1}
.initiala img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.initiala.cu-poza img{display:block}
.card h2{margin:0 0 .3rem;font-size:1.28rem;line-height:1.2;padding-right:4.6rem}
.pastile{display:flex;flex-wrap:wrap;gap:.3rem .45rem;margin:.1rem 0 .3rem}
.pastile span{font-size:.84rem;background:var(--fundal);border-radius:8px;padding:.1rem .5rem;white-space:nowrap}
.pastile b{font-weight:700}
.gust{font-size:.86rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.1rem .6rem;align-items:center}
.puncte{letter-spacing:.06em;font-size:.8rem}
.puncte b{color:var(--accent)}
.dintimp-mic{font-size:.84rem;color:var(--ambra);margin-top:.25rem}
.stare{position:absolute;top:.75rem;right:.8rem;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:.18rem .55rem}
.stare.verde{background:var(--verde-fundal);color:var(--verde)}
.stare.ambra{background:var(--ambra-fundal);color:var(--ambra)}
.stare.gri{background:var(--gri-fundal);color:var(--gri)}
.gol{color:var(--mut);text-align:center;padding:3rem 1rem;font-size:1rem}
/* panouri */
.panou{position:fixed;inset:0;background:var(--fundal);overflow-y:auto;z-index:3;-webkit-overflow-scrolling:touch}
.panou:not([hidden]){animation:intra .22s ease-out}
@keyframes intra{from{transform:translateX(28px)}}
.bara{position:sticky;top:0;z-index:1;background:var(--fundal);border-bottom:1px solid var(--linie);padding:.35rem .4rem;display:flex;align-items:center;gap:.2rem;min-height:2.9rem}
.bara .btn{background:none;border:0;color:var(--accent);padding:.4rem .5rem;font-size:1rem;font-weight:600}
.bara .titlu{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.95rem}
.sari{position:sticky;top:2.9rem;z-index:1;display:flex;background:var(--fundal);border-bottom:1px solid var(--linie);padding:.1rem .4rem;overflow-x:auto;scrollbar-width:none}
.sari button{background:none;border:0;padding:.45rem .65rem;color:var(--mut);font-size:.88rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
article{padding:.9rem .9rem 6rem}
article.mare{font-size:1.15em}
article.foarte-mare{font-size:1.3em}
.antet{display:grid;grid-template-columns:3.6rem 1fr;gap:.8rem;align-items:start;margin:.3rem 0 .8rem}
.antet .initiala{width:3.6rem;height:3.6rem;font-size:1.9rem}
article h2{margin:0;font-size:1.7rem;line-height:1.15}
.stari-mici{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.stari-mici .stare{position:static}
.stari-mici .tag{font-size:.78rem;color:var(--mut);border:1px solid var(--linie);border-radius:999px;padding:.18rem .55rem}
.poza-mare{margin:.2rem 0 .9rem;border-radius:16px;overflow:hidden;box-shadow:var(--umbra);aspect-ratio:4/3;background:var(--hartie)}
.poza-mare img{width:100%;height:100%;object-fit:cover;display:block}
.poza-actiuni{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:-.3rem 0 .8rem}
.poza-actiuni small,.mesaj{color:var(--mut);font-size:.82rem}
.stare-scriere{margin:.2rem 0 .8rem;padding:.55rem .8rem;border-radius:10px;font-size:.92rem;background:var(--ambra-fundal);color:var(--ambra);font-weight:600}
.stare-scriere.ok{background:var(--verde-fundal);color:var(--verde)}
.stare-scriere.eroare{background:var(--activ);color:var(--accent)}
.cifre{display:flex;justify-content:space-around;flex-wrap:wrap;gap:.4rem;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie);padding:.65rem 0;margin:.8rem 0}
.cifre div{text-align:center;font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.cifre b{display:block;font-size:1.3rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em;text-transform:none}
.dintimp{background:var(--ambra-fundal);color:var(--ambra);border-radius:12px;padding:.55rem .85rem;margin:.6rem 0;font-weight:600}
.dintimp small{display:block;font-weight:400;color:var(--text);opacity:.85}
.gatit{font-size:.9rem;color:var(--mut);margin:.4rem 0 0}
h3{font-family:ui-serif,Georgia,"Noto Serif",serif;font-size:1.25rem;margin:1.7rem 0 .6rem;color:var(--text);scroll-margin-top:5.9rem;display:flex;align-items:baseline;gap:.5rem}
h3::after{content:"";flex:1;border-bottom:1px solid var(--linie);transform:translateY(-.3em)}
h3 small{font:400 .78rem/1 system-ui,sans-serif;color:var(--mut)}
h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin:1.1rem 0 .6rem;color:var(--accent)}
.indiciu{font-size:.84rem;color:var(--mut);margin:-.3rem 0 .7rem}
.portii{display:flex;align-items:center;gap:.5rem;margin:.3rem 0 .7rem;flex-wrap:wrap}
.portii button.rotund{font-size:1.25rem;width:2.4rem;height:2.4rem;border:1px solid var(--linie);border-radius:50%;background:var(--hartie)}
.portii input[type=number]{width:3.6rem;text-align:center;padding:.4rem;border:1px solid var(--linie);border-radius:10px;background:var(--hartie);color:inherit}
.portii .chip{margin-left:auto}
.ingrediente{list-style:none;margin:0;padding:0;background:var(--hartie);border-radius:14px;overflow:hidden;box-shadow:var(--umbra)}
.ingrediente li{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-bottom:1px solid var(--linie)}
.ingrediente li:last-child{border-bottom:0}
.ingrediente li.grup{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cat,var(--accent));background:var(--fundal);padding:.45rem .9rem;font-weight:700}
.ingrediente input[type=checkbox]{width:1.3rem;height:1.3rem;margin:0;flex:none;accent-color:var(--verde)}
.ingrediente input[type=checkbox]:checked{animation:pop .2s}
@keyframes pop{50%{transform:scale(1.35)}}
.ingrediente .nume{flex:1}
.ingrediente .din{display:block;font-size:.8rem;color:var(--mut)}
.ingrediente .cant{text-align:right;line-height:1.2}
.ingrediente .cant b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.05em}
.ingrediente .cant small{display:block;color:var(--mut);font-size:.8rem;max-width:9rem}
.bifat .nume{text-decoration:line-through;color:var(--mut)}
.ingrediente.cumparate li{opacity:.6}
ol{list-style:none;padding:0;margin:0}
ol li{position:relative;background:var(--hartie);border-radius:14px;padding:.8rem .9rem .8rem 3.5rem;margin-bottom:.6rem;cursor:pointer;box-shadow:var(--umbra);line-height:1.5}
ol li::before{content:attr(value);position:absolute;left:.8rem;top:.75rem;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;font-family:ui-serif,Georgia,serif}
ol li.facut{color:var(--mut);background:transparent;box-shadow:none;border:1px dashed var(--linie)}
ol li.facut::before{content:"✓";background:var(--verde)}
button.timp{font-size:.92em;background:var(--activ);border:0;border-radius:8px;padding:.05rem .5rem;white-space:nowrap;color:var(--accent);font-weight:600}
button.timp.activ{background:var(--accent);color:#fff}
details.note{margin-top:1rem;background:var(--hartie);border-radius:14px;padding:.5rem .9rem;box-shadow:var(--umbra)}
details.note summary{cursor:pointer;font-weight:600;padding:.35rem 0}
details.note p{margin:.45rem 0}
p.p{padding-left:1.1rem;text-indent:-1.1rem}
p.p::before{content:"• ";color:var(--accent)}
.nutritie{display:grid;grid-template-columns:repeat(3,1fr);row-gap:.6rem;gap:.3rem;text-align:center;font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:var(--hartie);border-radius:14px;padding:.7rem .2rem;margin-bottom:.5rem;box-shadow:var(--umbra)}
.nutritie b{display:block;font-size:1.05rem;color:var(--text);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.meta{font-size:.88rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.15rem .8rem;margin:.3rem 0}
.intrare{background:var(--hartie);border-radius:14px;padding:.65rem .9rem;margin-bottom:.5rem;box-shadow:var(--umbra);border-left:4px solid var(--verde)}
.intrare.greseala{border-left-color:var(--ambra)}
.intrare p{margin:.25rem 0}
.intrare .cand{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
/* formular jurnal */
.formular{background:var(--hartie);border-radius:14px;padding:.8rem .9rem;box-shadow:var(--umbra);margin-top:.6rem}
.formular label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:.7rem 0 .3rem}
.formular label:first-child{margin-top:0}
.formular .chips{margin-top:0}
.formular .chip.nota{min-width:2.4rem;text-align:center;padding-left:.5rem;padding-right:.5rem}
.formular .actiuni{display:flex;gap:.5rem;align-items:center;margin-top:.9rem;flex-wrap:wrap}
/* cronometre */
#cronometre{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:.45rem;padding:.55rem .9rem;background:var(--hartie);border-top:1px solid var(--linie);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.cron{position:relative;overflow:hidden;border:0;background:var(--activ);border-radius:12px;padding:.4rem .8rem .5rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:left;line-height:1.2;font-size:1.05rem;color:var(--accent)}
.cron small{display:block;font-size:.7rem;font-weight:500;color:var(--text);opacity:.8}
.cron i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:var(--p,0%);transition:width .5s linear}
.cron.gata{background:var(--accent);color:#fff;animation:clipire 1s infinite}
.cron.gata small{color:#fff}
@keyframes clipire{50%{opacity:.55}}
#timer-panou{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--hartie);border-radius:18px 18px 0 0;padding:.9rem;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
#timer-panou .chips{margin-top:0;margin-bottom:.7rem}
#timer-panou h3,#alege h3{margin:0 0 .6rem;font-size:1.1rem}
/* alegere ingrediente pentru cumpărături */
#alege{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
#alege>div{background:var(--fundal);width:100%;max-height:85vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:.9rem}
/* mod gătit */
#gatit article{padding-bottom:7rem}
.plan{background:var(--hartie);border-radius:14px;padding:.8rem .9rem;box-shadow:var(--umbra);margin:.6rem 0}
.plan p{margin:.3rem 0}
.progres{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:.6rem 0 .2rem}
.pas-mare{background:var(--hartie);border-radius:18px;padding:1.1rem 1rem;box-shadow:var(--umbra);font-size:1.25rem;line-height:1.5;margin:.4rem 0 .8rem}
.pas-mare .nr{font-family:ui-serif,Georgia,serif;font-size:2.4rem;font-weight:700;color:var(--accent);line-height:1;margin-bottom:.4rem}
.pas-mare button.timp{font-size:1.05rem;padding:.25rem .7rem;margin:.15rem 0}
.pas-mare.facut{opacity:.6}
.nevoie{display:flex;flex-wrap:wrap;gap:.35rem .5rem;align-items:baseline;margin:0 0 .9rem;font-size:.95rem}
.nevoie>b{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;width:100%}
.nevoie span{background:var(--hartie);border-radius:10px;padding:.3rem .6rem;box-shadow:var(--umbra)}
.nevoie small{color:var(--mut)}
.grup-mic{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:.6rem 0 .2rem;font-weight:700}
.urmeaza{font-size:.92rem;color:var(--mut)}
.urmeaza p{margin:.3rem 0;padding-left:1.4rem;text-indent:-1.4rem}
.urmeaza b{color:var(--accent);display:inline-block;width:1.4rem;text-indent:0}
.gatit-actiuni{position:sticky;bottom:0;display:flex;gap:.5rem;padding:.7rem 0 .3rem;background:linear-gradient(transparent,var(--fundal) 30%)}
.gatit-actiuni .chip{flex:1;text-align:center}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div>
  <div class="cap"><h1>Cartea de rețete<small id="nr-retete"></small></h1><span><button class="chip" id="btn-cumparaturi" type="button" hidden>🛒 <span id="nr-cumparaturi"></span></button> <button class="chip" id="btn-timer-lista" type="button" title="cronometru">⏱</button></span></div>
  <input id="cautare" type="search" placeholder="Caută după titlu sau ingredient" autocomplete="off">
  <div class="chips" id="stari">
    <span class="chip fix">✓ în carte</span>
    <button class="chip" type="button" data-stare="imbunatatire">de îmbunătățit</button>
    <button class="chip" type="button" data-stare="test">în test</button>
    <button class="chip" type="button" id="btn-filtre">filtre ▾</button>
  </div>
  <div id="filtre" hidden>
    <div class="chips linie" id="sortari"><span class="eticheta">sortare</span>
      <button class="chip activ" type="button" data-sort="gust">gust</button>
      <button class="chip" type="button" data-sort="efort">efort</button>
      <button class="chip" type="button" data-sort="timp">timp</button></div>
    <div class="chips linie" id="categorii"><span class="eticheta">categorie</span></div>
    <div class="chips linie"><span class="eticheta">GitHub</span><button class="chip" id="btn-token" type="button">token</button><span class="mesaj" id="token-stare"></span></div>
    <div class="chips linie" id="taguri"><span class="eticheta">tag</span></div>
  </div>
</div></header>
<main id="lista"></main>
<section id="detaliu" class="panou" hidden>
  <div class="bara"><button class="btn" id="inapoi" type="button">‹ Înapoi</button><span class="titlu" id="detaliu-titlu"></span><button class="btn" id="btn-timer" type="button" title="cronometru">⏱</button><button class="btn" id="btn-text" type="button" title="text mai mare">Aa</button></div>
  <nav class="sari"><button type="button" data-tinta="s-ingrediente">Ingrediente</button><button type="button" data-tinta="s-pasi">Pași</button><button type="button" data-tinta="s-nutritie">Nutriție</button><button type="button" data-tinta="s-jurnal">Jurnal</button></nav>
  <article id="detaliu-continut"></article>
</section>
<section id="gatit" class="panou" hidden>
  <div class="bara"><button class="btn" id="gatit-iesi" type="button">‹ Ieși</button><span class="titlu" id="gatit-titlu"></span><button class="btn" id="btn-timer-gatit" type="button" title="cronometru">⏱</button></div>
  <article id="gatit-continut"></article>
</section>
<section id="cumparaturi" class="panou" hidden>
  <div class="bara"><button class="btn" id="inapoi-cumparaturi" type="button">‹ Înapoi</button><span class="titlu">Cumpărături</span><button class="btn" id="goleste" type="button">golește tot</button></div>
  <article id="cumparaturi-continut"></article>
</section>
<div id="alege" hidden><div>
  <h3 id="alege-titlu">Ce pui în lista de cumpărături?</h3>
  <p class="mesaj" style="margin:0 0 .6rem">Debifează ce ai deja în casă.</p>
  <ul class="ingrediente" id="alege-lista"></ul>
  <div class="chips" style="margin-top:.8rem"><button class="chip actiune" id="alege-ok" type="button">adaugă în listă</button><button class="chip" id="alege-toate" type="button">toate / niciuna</button><button class="chip" id="alege-inchide" type="button">renunță</button></div>
</div></div>
<input type="file" id="poza-fisier" accept="image/*" hidden>
<div id="cronometre" hidden title="atinge un cronometru ca să-l oprești"></div>
<div id="timer-panou" hidden>
  <h3>Cronometru</h3>
  <div class="chips" id="timer-presetari"></div>
  <div class="portii"><input id="timer-minute" type="number" min="1" inputmode="numeric" placeholder="minute" style="width:6rem;padding:.4rem;border:1px solid var(--linie);border-radius:10px;background:var(--hartie)">
    <button class="chip actiune" id="timer-start" type="button">pornește</button><button class="chip" id="timer-inchide" type="button">închide</button></div>
</div>
<script>
"use strict";
// build.py înlocuiește marcajul de mai jos cu JSON-ul rețetelor (fără cele la gunoi).
const RETETE = /*@RETETE@*/[];
const REPO = "DeradFromHell/retete", RAMURA = "master";
const CATEGORII = {"mic-dejun": "mic dejun", "pranz-cina": "prânz / cină", "garnitura": "garnitură", "desert": "desert", "sos": "sos"};
const CULORI = {"mic-dejun": "#d29a2c", "pranz-cina": "#b3462b", "garnitura": "#6e8f3c", "desert": "#a95a8a", "sos": "#4a79a6"};
const STARI = {carte: ["În carte", "verde"], imbunatatire: ["De îmbunătățit", "ambra"], test: ["În test", "gri"]};
const PAS = {kcal: 10, sare: 0.1};  // rotunjiri la afișare, ca în build.py: kcal la 10, sare la 0,1 g, restul la 1 g
const $ = id => document.getElementById(id);
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const rot = (x, pas = 1) => Math.floor(x / pas + 0.5) * pas;  // aceleași operații ca rotunjeste() din build.py
const lei = c => c == null ? "—" : "≈" + String(c).replace(".", ",") + " lei";
const gsare = v => String(v.toFixed(1)).replace(".", ",");
const durata = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + m % 60 + " min" : ""}` : `${m} min`;
const ultima = r => r.jurnal[r.jurnal.length - 1] || null;
const azi = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const acum = d => { const z = Math.floor((Date.now() - new Date(d)) / 864e5); return z <= 0 ? "azi" : z === 1 ? "ieri" : z < 60 ? `acum ${z} zile` : `acum ${Math.round(z / 30)} luni`; };
const puncte = g => `<span class="puncte"><b>${"●".repeat(g)}</b>${"○".repeat(10 - g)}</span>`;
const stare = r => `<span class="stare ${STARI[r.status]?.[1] ?? "gri"}">${STARI[r.status]?.[0] ?? esc(r.status)}</span>`;
const pozaUrl = slug => `../retete/poze/${slug}.jpg`;  // poza unei rețete e fișierul retete/poze/<slug>.jpg; dacă nu există, rămâne inițiala
const initiala = r => `<div class="initiala serif" aria-hidden="true">${esc(String(r.titlu).trim().charAt(0).toUpperCase())}
  <img src="${pozaUrl(r.slug)}" alt="" loading="lazy" onload="this.parentNode.classList.add('cu-poza')" onerror="this.remove()"></div>`;
// Măsura de bucătărie din nota („3 linguri”, „1/2 linguriță”, „2 căței”) se scalează cu porțiile când începe cu un număr.
const fractie = s => { const m = s.match(/^(\d+)(?:\s+(\d+)\/(\d+))?|^(\d+)\/(\d+)/); if (!m) return null; return m[4] ? +m[4] / +m[5] : +m[1] + (m[2] ? +m[2] / +m[3] : 0); };
const nrScurt = v => { const r = Math.round(v * 4) / 4; return r === Math.floor(r) ? String(r) : String(Math.round(r * 100) / 100).replace(".", ","); };
function masura(nota, f) {
  if (!nota) return "";
  if (f === 1) return nota;
  const m = nota.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+[.,]\d+|\d+)(?:\s*(ml|g))?\s*(.*)$/);
  if (!m) return nota;
  const v = /[.,]/.test(m[1]) ? parseFloat(m[1].replace(",", ".")) : fractie(m[1]), rest = m[3].replace(/^[,;]\s*/, "");
  return `≈${nrScurt(v * f)}${m[2] ? " " + m[2] : ""} ${rest}`.trim();
}
const cantitate = (i, f) => `<b>${Math.max(1, Math.round(i.g * f))} g</b>${i.nota ? `<small>${esc(masura(i.nota, f))}</small>` : ""}`;
// Ingredientele pomenite într-un pas: cuvintele-cheie din nume (rădăcina de 5 litere) căutate în textul pasului.
const STOP = new Set(["crud", "cruda", "crude", "fara", "piele", "proaspat", "proaspata", "valoare", "generica", "usda", "comert", "alba", "integral", "integrala", "tos", "masa", "macinat", "dulce", "spray", "gaina", "intreg", "coaja", "bob", "lung", "simplu", "rasa", "redusa", "grasime", "pasteurizat", "cuburi"]);
const SCURTE = new Set(["ou", "oua", "apa", "sare", "unt", "orez", "sos", "ulei", "miere", "boia", "piper", "lapte", "otet", "faina"]);
function cheile(nume) {
  return norm(nume).replace(/[(),;]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w) && (w.length >= 5 || SCURTE.has(w))).map(w => w.slice(0, 5));
}
const pomenit = (i, text) => cheile(i.nume).some(k => new RegExp("(^|[^a-z])" + k).test(text));
// Dacă etapa sau pasul pomenește un grup de ingrediente („marinadei”, „Glazura”), se arată doar acel grup.
function necesarePentru(r, p) {
  const text = norm(p.html.replace(/<[^>]+>/g, "")), context = text + " " + norm(p.etapa);
  const grupuri = [...new Set(r.ingrediente.map(i => i.grup).filter(Boolean))];
  const potrivite = grupuri.filter(g => cheile(g).some(k => new RegExp("(^|[^a-z])" + k).test(context)));
  const grup = potrivite.length === 1 ? potrivite[0] : null;
  return {grup, lista: r.ingrediente.filter(i => (!grup || i.grup === grup || !i.grup) && pomenit(i, text))};
}
const sursa = s => /^https?:\/\//.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.split("/")[2] || s)}</a>` : "";
// Starea proprie a paginii (coș, cumpărate, produse adăugate de tine, mărimea textului, token) stă doar în browserul telefonului.
const memorie = {
  citeste(c, implicit) { try { return JSON.parse(localStorage.getItem(c)) ?? implicit; } catch (e) { return implicit; } },
  scrie(c, v) { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} },
};
let cos = memorie.citeste("cos", {}), cumparate = new Set(memorie.citeste("cumparate", [])), extra = memorie.citeste("extra", []), marime = memorie.citeste("marime", 0);
for (const s in cos) if (typeof cos[s] === "number") cos[s] = {portii: cos[s], ids: null};  // format vechi: toate ingredientele
// Orice „8 minute” / „3–4 minute” / „30–60 de secunde” dintr-un pas devine buton de cronometru (prima cifră).
const RE_TIMP = /(\d+)(?:[–-]\d+)?\s*(?:de\s+)?(minute|minut|secunde|secundă)\b/g;
const cuCronometre = html => html.replace(RE_TIMP, (m, n, u) =>
  `<button type="button" class="timp" data-s="${+n * (u.startsWith("sec") ? 1 : 60)}">⏱ ${m}</button>`);

// Nutriția per porție și per 100 g, recalculată din valorile per 100 g, exact în ordinea și cu rotunjirile din build.py.
function nutritie(r) {
  const t = {kcal: 0, proteine: 0, carbo: 0, grasimi: 0, fibre: 0, sare: 0}, suta = {};
  let cost = 0, complet = true, crud = 0;
  for (const i of r.ingrediente) {
    crud += i.g;
    for (const n in t) t[n] += i.g * i[n] / 100;
    if (i.pret_per_kg == null) complet = false; else cost += i.g / 1000 * i.pret_per_kg;
  }
  const baza = r.greutate_gatita_g || crud;
  for (const n in t) { suta[n] = rot(t[n] / baza * 100, PAS[n] || 1); t[n] = rot(t[n] / r.portii, PAS[n] || 1); }
  t.cost = complet ? rot(cost / r.portii, 0.5) : null;
  return {...t, suta, pe_gatit: !!r.greutate_gatita_g};
}
const grila = n => `<div class="nutritie"><div><b>≈${n.kcal}</b>kcal</div><div><b>≈${n.proteine} g</b>proteine</div>
  <div><b>≈${n.carbo} g</b>carbo</div><div><b>≈${n.grasimi} g</b>grăsimi</div><div><b>≈${n.fibre} g</b>fibre</div><div><b>≈${gsare(n.sare)} g</b>sare</div></div>`;

// ---------- GitHub: cartea scrie în repo (poze, jurnal) cu un token personal cerut o singură dată ----------
const antetGitHub = token => ({Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json"});
// Verifică un token: trebuie să poată citi repo-ul și să aibă drept de scriere (Contents: Read and write, fine-grained, doar repo-ul „retete”).
async function verificaToken(t) {
  let r;
  try { r = await fetch(`https://api.github.com/repos/${REPO}`, {headers: antetGitHub(t)}); }
  catch (e) { return "nu s-a putut contacta GitHub (fără internet?)"; }
  if (r.status === 401) return "token invalid sau expirat";
  if (r.status === 404 || r.status === 403) return "token-ul nu are acces la repo-ul „retete”: la „Repository access” alege repo-ul, la „Permissions” Contents: Read and write";
  if (!r.ok) return "GitHub a răspuns " + r.status;
  const d = await r.json();
  if (!d.permissions || !d.permissions.push) return "token-ul poate doar citi; îi lipsește Contents: Read and write";
  return "";
}
async function cereToken(mesaj) {
  const t = (prompt((mesaj ? mesaj + "\n\n" : "") + "Lipește token-ul GitHub (fine-grained, repo „retete”, Contents: Read and write; pașii sunt în README, secțiunea „Poze”):") || "").trim();
  if (!t) return "";
  const problema = await verificaToken(t);
  if (problema) { alert("Token neacceptat: " + problema); return cereToken(problema); }
  memorie.scrie("github_token", t);
  return t;
}
async function tokenGitHub() { return memorie.citeste("github_token", "") || cereToken(""); }
async function github(cale, metoda = "GET", corp) {
  const token = await tokenGitHub();
  if (!token) throw new Error("fără token, nimic trimis");
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${REPO}/contents/${cale}${metoda === "GET" ? "?ref=" + RAMURA : ""}`,
      {method: metoda, headers: antetGitHub(token), body: corp ? JSON.stringify({branch: RAMURA, ...corp}) : undefined});
  } catch (e) { throw new Error("nu s-a putut contacta GitHub (fără internet?)"); }
  if (r.status === 401 || r.status === 403) { memorie.scrie("github_token", ""); throw new Error("token refuzat (" + r.status + "); atinge din nou și pune altul"); }
  if (r.status === 404 && metoda === "GET") return null;
  const date = await r.json();
  if (!r.ok) throw new Error(date.message || r.status);
  return date;
}
// Mesaj vizibil sub buton: în lucru (chihlimbar), reușit (verde) sau eroare (roșu).

const b64text = s => btoa(Array.from(new TextEncoder().encode(s), b => String.fromCharCode(b)).join(""));
const text64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));

const filtru = {stari: new Set(["carte"]), sort: "gust", cat: "", tag: ""};

  const q = norm($("cautare").value.trim());
  const cheie = {gust: r => -(ultima(r)?.gust ?? -1), efort: r => ultima(r)?.efort ?? 99, timp: r => r.timp_total_min}[filtru.sort];
  return RETETE.filter(r => filtru.stari.has(r.status)
      && (!filtru.cat || r.categorie === filtru.cat) && (!filtru.tag || r.tags.includes(filtru.tag))
      && (!q || norm(r.titlu).includes(q) || r.ingrediente.some(i => norm(i.nume).includes(q))))
    .sort((a, b) => cheie(a) - cheie(b) || String(a.titlu).localeCompare(String(b.titlu), "ro"));

// ---------- jurnal din telefon: intrarea se scrie în YAML-ul rețetei, prin GitHub; cartea se regenerează pe GitHub ----------
const formular = {gust: null, efort: null, executie: "ok"};
function adaugaInYaml(text, intrare) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);
  if (!m) throw new Error("fișierul nu are frontmatter");
  const nl = text.includes("\r\n") ? "\r\n" : "\n", linii = m[1].split(/\r?\n/);
  const i = linii.findIndex(l => /^jurnal:\s*(\[\]\s*)?$/.test(l));
  if (i < 0) throw new Error("cheia jurnal lipsește din frontmatter");
  linii[i] = "jurnal:";
  let j = i + 1;
  while (j < linii.length && (linii[j] === "" || /^\s/.test(linii[j]))) j++;
  while (j > i + 1 && linii[j - 1] === "") j--;  // intrarea nouă vine imediat după ultima
  const bloc = [`  - data: ${intrare.data}`, `    versiune: ${intrare.versiune}`, `    gust: ${intrare.gust}`, `    efort: ${intrare.efort}`, `    executie: ${intrare.executie}`];
  if (intrare.observatii) bloc.push(`    observatii: ${JSON.stringify(intrare.observatii)}`);
  if (intrare.urmatoarea_data) bloc.push(`    urmatoarea_data: ${JSON.stringify(intrare.urmatoarea_data)}`);
  linii.splice(j, 0, ...bloc);
  return "---" + nl + linii.join(nl) + nl + "---" + nl + text.slice(m[0].length);
}
async function trimiteJurnal() {
  const r = curenta;
  if (!formular.gust || !formular.efort) { arataStare("f-stare", "alege întâi gustul și efortul", "eroare"); return; }
  const intrare = {data: $("f-data").value || azi(), versiune: r.versiune, gust: formular.gust, efort: formular.efort, executie: formular.executie,
                   observatii: $("f-observatii").value.trim(), urmatoarea_data: $("f-urmatoarea").value.trim()};
  arataStare("f-stare", "se scrie în repo…");
  try {
    const cale = `retete/${r.slug}.md`, fisier = await github(cale);
    if (!fisier) throw new Error("fișierul rețetei nu e în repo");
    const nou = adaugaInYaml(text64(fisier.content), intrare);
    await github(cale, "PUT", {message: `${r.slug} v${r.versiune}: gust ${intrare.gust} efort ${intrare.efort}`, content: b64text(nou), sha: fisier.sha});
    r.jurnal.push(intrare);
    Object.assign(formular, {gust: null, efort: null, executie: "ok"});
    deseneazaDetaliu();
    arataStare("f-stare", "✓ scris; starea rețetei se actualizează în 2–3 minute, după ce GitHub regenerează cartea", "ok");
    $("s-jurnal").scrollIntoView({behavior: "smooth"});
  } catch (e) { arataStare("f-stare", "nu s-a putut scrie: " + e.message, "eroare"); }
}

// ---------- cronometre: oricâte în paralel, într-o bară fixă jos, pe orice ecran; sună și vibrează la final ----------
let cronometre = [], tic = null, audio = null, nrCron = 0;
// Un buton de timp dintr-un pas se leagă de cronometrul lui prin etichetă („pas 6 · 8 minute”), în rețetă și în modul gătit deopotrivă.
const eticheta = t => `pas ${t.closest("li")?.value ?? pasii(curenta)[pasCurent]?.n ?? ""} · ${t.textContent.replace("⏱ ", "")}`;
const cronActiv = t => cronometre.find(x => x.slug === curenta?.slug && x.eticheta === eticheta(t) && !x.gata);
const marcheazaCronometrele = () => document.querySelectorAll("button.timp").forEach(t => t.classList.toggle("activ", !!cronActiv(t)));
function porneste(secunde, etich) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  cronometre.push({id: ++nrCron, eticheta: etich, durata: secunde, sfarsit: Date.now() + secunde * 1000, gata: false, slug: curenta?.slug});
  if (!tic) tic = setInterval(bate, 500);
  bate();
  marcheazaCronometrele();
}
function bate() {
  for (const c of cronometre) {
    const rest = Math.max(0, Math.round((c.sfarsit - Date.now()) / 1000));
    c.text = rest ? `${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, "0")}` : "gata!";
    c.p = Math.min(100, Math.round(100 - rest / c.durata * 100));
    if (!rest && !c.gata) { c.gata = true; suna(); }
  }
  $("cronometre").innerHTML = cronometre.map(c => `<button type="button" class="cron${c.gata ? " gata" : ""}" data-id="${c.id}" style="--p:${c.p}%">⏱ ${c.text}<small>${esc(c.eticheta)}</small><i></i></button>`).join("");
  $("cronometre").hidden = !cronometre.length;
  if (!cronometre.length) { clearInterval(tic); tic = null; }
}
function opreste(id) {
  cronometre = cronometre.filter(x => x.id !== id);
  bate();
  marcheazaCronometrele();
}
function aratuTimer(vizibil) { $("timer-panou").hidden = !vizibil; if (vizibil) { $("timer-minute").value = ""; $("timer-minute").focus(); } }
function suna() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
  if (!audio) return;
  try {
    audio.resume && audio.resume();
    [0, 0.45, 0.9].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.connect(g); g.connect(audio.destination); o.frequency.value = 880;
      g.gain.setValueAtTime(0.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.35);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.35);
    });
  } catch (e) {}
}

// ---------- mod gătit: planul dinainte, apoi un pas pe ecran, cu cronometrele lui și ce urmează ----------

  t.innerHTML = r.pasi_html.split("<h3>Note</h3>")[0];
  const lista = []; let etapa = "";
  for (const el of t.content.children) {
    if (el.tagName === "H3") etapa = el.textContent;
    else if (el.tagName === "OL") for (const li of el.children) lista.push({n: +li.getAttribute("value"), html: li.innerHTML, etapa, timpi: [...li.textContent.matchAll(RE_TIMP)].map(m => m[0])});
  }
  return lista;
}
function deseneazaGatit() {
  const r = curenta, lista = pasii(r), cont = $("gatit-continut");
  $("gatit-titlu").textContent = r.titlu;
  if (pasCurent < 0) {
    const etape = [];
    for (const p of lista) { const e = etape.find(x => x.nume === p.etapa) || (etape.push({nume: p.etapa, pasi: 0, timpi: []}), etape[etape.length - 1]); e.pasi++; e.timpi.push(...p.timpi); }
    cont.innerHTML = `<div class="progres">Planul</div>
      ${r.din_timp ? `<p class="dintimp">⏳ Din timp<small>${esc(r.din_timp)}</small></p>` : ""}
      <div class="plan"><p><b>${lista.length} pași</b> · ${durata(r.timp_activ_min)} activ · ${durata(r.timp_total_min)} în total · ${r.portii} porții</p>
        ${etape.map(e => `<p><b>${esc(e.nume || "Pași")}</b>: ${e.pasi} ${e.pasi === 1 ? "pas" : "pași"}${e.timpi.length ? " · ⏱ " + e.timpi.map(esc).join(", ") : ""}</p>`).join("")}</div>
      <p class="mesaj">Cronometrele se pornesc dintr-o atingere pe timpul din pas și rămân jos, pe orice ecran. Poți începe și de la un pas anume, din listă.</p>
      <details class="note" open><summary>Ingrediente de scos (${r.ingrediente.length}, pentru ${portii} porții)</summary>
        ${(() => { let g = ""; return r.ingrediente.map(i => (i.grup && i.grup !== g ? `<p class="grup-mic">${esc(g = i.grup)}</p>` : "") + `<p class="p">${esc(i.nume)}: <b>${Math.max(1, Math.round(i.g * portii / r.portii))} g</b>${i.nota ? ` <span class="mesaj">(${esc(masura(i.nota, portii / r.portii))})</span>` : ""}</p>`).join(""); })()}</details>
      <div class="urmeaza">${lista.map((p, k) => `<p data-k="${k}" style="cursor:pointer"><b>${p.n}</b>${esc(p.html.replace(/<[^>]+>/g, "")).slice(0, 90)}…</p>`).join("")}</div>
      <div class="gatit-actiuni"><button class="chip actiune mare" type="button" data-mergi="0">▶ Începe</button></div>`;

  }
  const p = lista[pasCurent], urm = lista.slice(pasCurent + 1, pasCurent + 3), f = portii / r.portii;
  const {grup, lista: necesare} = necesarePentru(r, p);
  cont.innerHTML = `<div class="progres">${esc(p.etapa || "Pași")} · pasul ${pasCurent + 1} din ${lista.length}</div>

    ${urm.length ? `<div class="urmeaza"><b style="width:auto;color:var(--mut)">Apoi:</b>${urm.map(q => `<p><b>${q.n}</b>${esc(q.html.replace(/<[^>]+>/g, ""))}</p>`).join("")}</div>` : `<p class="mesaj">Ultimul pas. După ce mănânci, scrie în jurnal cum a fost.</p>`}

  marcheazaCronometrele();

// Mod gătit: ecranul rămâne aprins cât e deschisă o rețetă (unde browserul permite).
let veghe = null;
async function tineEcranul() { try { veghe = await navigator.wakeLock.request("screen"); } catch (e) {} }
function lasaEcranul() { try { veghe && veghe.release(); } catch (e) {} veghe = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("detaliu").hidden) tineEcranul(); });
function aplicaMarimea() { $("detaliu-continut").className = ["", "mare", "foarte-mare"][marime] || ""; }

// ---------- poze: micșorată în browser, apoi trimisă direct în repo ----------
async function micsoreaza(fisier, max = 1200) {
  let img;
  try { img = await createImageBitmap(fisier, {imageOrientation: "from-image"}); }
  catch (e) { img = await new Promise((ok, nu) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nu; i.src = URL.createObjectURL(fisier); }); }
  const f = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}
async function urcaPoza(fisier) {
  const r = curenta;
  try {
    arataStare("poza-stare", "se micșorează…");
    const dataUrl = await micsoreaza(fisier);
    const img = $("poza-mare").querySelector("img") || $("poza-mare").appendChild(Object.assign(document.createElement("img"), {alt: r.titlu}));
    img.onload = null; img.onerror = null; img.src = dataUrl; $("poza-mare").hidden = false;
    arataStare("poza-stare", "se trimite în repo…");
    const cale = `retete/poze/${r.slug}.jpg`, existent = await github(cale);
    await github(cale, "PUT", {message: `poza ${r.slug}`, content: dataUrl.split(",")[1], ...(existent ? {sha: existent.sha} : {})});
    arataStare("poza-stare", "✓ poza e în repo; pe alte telefoane apare în 1–2 minute", "ok");
  } catch (e) { arataStare("poza-stare", "nu s-a putut trimite: " + e.message, "eroare"); }
}

// ---------- cumpărături: alegi ce intră din rețetă; cumpăratele coboară; poți adăuga orice ----------
function numarCos() { const n = Object.keys(cos).length + extra.length; $("nr-cumparaturi").textContent = n ? `cumpărături (${n})` : ""; $("btn-cumparaturi").hidden = !n; }
let alegere = new Set();
function deschideAlegere() {
  const r = curenta, salvat = cos[r.slug];
  alegere = new Set(salvat ? (salvat.ids ?? r.ingrediente.map(i => i.id)) : r.ingrediente.map(i => i.id));
  let grup = "";
  $("alege-lista").innerHTML = r.ingrediente.map(i => (i.grup && i.grup !== grup ? `<li class="grup">${esc(grup = i.grup)}</li>` : "")
    + `<li><input type="checkbox" data-id="${esc(i.id)}" ${alegere.has(i.id) ? "checked" : ""}><span class="nume">${esc(i.nume)}</span><span class="cant"><b>${Math.max(1, Math.round(i.g * portii / r.portii))} g</b></span></li>`).join("");
  $("alege-titlu").textContent = `Ce pui în listă din „${r.titlu}” (${portii} porții)?`;
  $("alege-ok").textContent = salvat ? "actualizează lista" : "adaugă în listă";
  $("alege").hidden = false;
}
function salveazaAlegere() {
  const ids = [...new Set([...alegere])].filter(id => curenta.ingrediente.some(i => i.id === id));
  if (ids.length) cos[curenta.slug] = {portii, ids}; else delete cos[curenta.slug];
  memorie.scrie("cos", cos); numarCos(); $("alege").hidden = true; deseneazaDetaliu();
}
function deseneazaCumparaturi() {
  const retete = Object.keys(cos).map(s => RETETE.find(r => r.slug === s)).filter(Boolean), total = {};
  for (const r of retete) {
    const c = cos[r.slug], f = c.portii / r.portii;
    for (const i of r.ingrediente) {
      if (c.ids && !c.ids.includes(i.id)) continue;
      const t = total[i.id] || (total[i.id] = {nume: i.nume, g: 0, din: new Set()}); t.g += i.g * f; t.din.add(r.titlu);
    }
  }
  const randuri = [...Object.entries(total).map(([id, t]) => ({id, nume: t.nume, cant: `${Math.max(1, Math.round(t.g))} g`, din: [...t.din].join(", ")})),
                   ...extra.map(x => ({id: x.id, nume: x.nume, cant: "", din: "adăugat de tine"}))].sort((a, b) => a.nume.localeCompare(b.nume, "ro"));
  const rand = x => `<li class="${cumparate.has(x.id) ? "bifat" : ""}"><input type="checkbox" data-id="${esc(x.id)}" ${cumparate.has(x.id) ? "checked" : ""}>
    <span class="nume">${esc(x.nume)}<span class="din">${esc(x.din)}</span></span>${x.cant ? `<span class="cant"><b>${x.cant}</b></span>` : ""}${x.id.startsWith("x_") ? `<button class="chip" type="button" data-sterge="${esc(x.id)}">✕</button>` : ""}</li>`;
  const deCumparat = randuri.filter(x => !cumparate.has(x.id)), gata = randuri.filter(x => cumparate.has(x.id));
  $("cumparaturi-continut").innerHTML = `
    <h3>De cumpărat <small>${deCumparat.length}</small></h3>
    ${deCumparat.length ? `<ul class="ingrediente">${deCumparat.map(rand).join("")}</ul>` : `<p class="mesaj">Nimic de cumpărat.</p>`}
    <div class="portii" style="margin-top:.7rem"><input type="text" id="extra-nume" placeholder="adaugă altceva (detergent, pâine…)" style="flex:1"><button class="chip actiune" id="extra-adauga" type="button">+</button></div>
    ${gata.length ? `<h3>Cumpărate <small>${gata.length}</small></h3><ul class="ingrediente cumparate">${gata.map(rand).join("")}</ul>
      <div class="chips"><button class="chip" id="curata-cumparate" type="button">scoate cumpăratele din listă</button></div>` : ""}
    ${retete.length ? `<h3>Din rețetele</h3><ul class="ingrediente">${retete.map(r => `<li><span class="nume">${esc(r.titlu)}<span class="din">${cos[r.slug].portii} porții · ${cos[r.slug].ids ? cos[r.slug].ids.length : r.ingrediente.length} ingrediente</span></span><button class="chip" type="button" data-scoate="${esc(r.slug)}">scoate</button></li>`).join("")}</ul>` : ""}`;
}
function adaugaExtra() {
  const nume = $("extra-nume").value.trim();
  if (!nume) return;
  extra.push({id: "x_" + Date.now().toString(36), nume});

// ---------- navigare (nu depinde de URL: unele vizualizatoare nu permit schimbarea lui; istoricul e bonus) ----------
function deschide(slug, inIstoric) {
  const r = RETETE.find(x => x.slug === slug);
  if (!r) return inchide();
  if (r !== curenta) { curenta = r; portii = r.portii; bifate = new Set(); facute = new Set(); Object.assign(formular, {gust: null, efort: null, executie: "ok"}); }
  $("detaliu-titlu").textContent = r.titlu;
  aplicaMarimea();
  deseneazaDetaliu();
  $("cumparaturi").hidden = true; $("gatit").hidden = true;
  $("detaliu").hidden = false; $("detaliu").scrollTop = 0;
  document.body.style.overflow = "hidden";
  tineEcranul();
  if (inIstoric) try { history.pushState({slug}, "", "#" + slug); } catch (e) {}
}
function deschideCumparaturi(inIstoric) {
  deseneazaCumparaturi();
  $("detaliu").hidden = true; $("gatit").hidden = true;
  $("cumparaturi").hidden = false;
  document.body.style.overflow = "hidden";
  if (inIstoric) try { history.pushState({cos: 1}, "", "#cumparaturi"); } catch (e) {}
}
function inchide() {
  $("detaliu").hidden = true; $("cumparaturi").hidden = true; $("gatit").hidden = true; $("alege").hidden = true;
  document.body.style.overflow = "";
  lasaEcranul();
  arataLista();
}
// „Înapoi” închide direct (history.back() reîncarcă pagina în unele vizualizatoare); intrarea din istoric rămâne pentru butonul fizic.

    chip.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("activ", c === chip));

$("timer-minute").addEventListener("keydown", e => { if (e.key === "Enter") $("timer-start").click(); });
$("timer-presetari").addEventListener("click", e => { const b = e.target.closest("button[data-min]"); if (b) { porneste(+b.dataset.min * 60, `${b.dataset.min} min`); aratuTimer(false); } });
$("btn-text").addEventListener("click", () => { marime = (marime + 1) % 3; memorie.scrie("marime", marime); aplicaMarimea(); });
document.querySelector(".sari").addEventListener("click", e => {
  const b = e.target.closest("button[data-tinta]");
  if (b) $(b.dataset.tinta)?.scrollIntoView({behavior: "smooth", block: "start"});
});
$("lista").addEventListener("click", e => {
  const a = e.target.closest("a.card");
  if (a) { e.preventDefault(); deschide(a.dataset.slug, true); }
});
$("stari").addEventListener("click", e => {
  const b = e.target.closest("button[data-stare]");
  if (b) { b.classList.toggle("activ"); if (b.classList.contains("activ")) filtru.stari.add(b.dataset.stare); else filtru.stari.delete(b.dataset.stare); arataLista(); }
});
$("btn-token").addEventListener("click", async () => {
  const t = await cereToken(memorie.citeste("github_token", "") ? "Ai deja un token salvat; lipește altul ca să-l înlocuiești, sau renunță." : "");
  $("token-stare").textContent = t ? "✓ token verificat și salvat" : (memorie.citeste("github_token", "") ? "token-ul vechi rămâne" : "fără token");
});
$("btn-filtre").addEventListener("click", () => { const f = $("filtre"); f.hidden = !f.hidden; $("btn-filtre").textContent = f.hidden ? "filtre ▾" : "filtre ▴"; });
$("filtre").addEventListener("click", e => {
  const b = e.target.closest("button.chip");
  if (!b) return;
  const cheie = Object.keys(b.dataset)[0];  // sort | cat | tag
  filtru[cheie] = b.dataset[cheie];
  b.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("activ", c === b));
  arataLista();
});
$("cautare").addEventListener("input", arataLista);
window.addEventListener("popstate", () => {  // înapoi/înainte în browser, sau hash schimbat manual
  const s = history.state || {}, slug = s.slug || location.hash.slice(1);
  if (s.cos || slug === "cumparaturi") deschideCumparaturi(false);
  else if (RETETE.some(x => x.slug === slug)) { deschide(slug, false); if (s.gatit) deschideGatit(); } else inchide();
});

// ---------- pornire ----------
chipuri("categorii", Object.keys(CATEGORII).filter(c => RETETE.some(r => r.categorie === c)).map(c => [c, CATEGORII[c]]), "", "cat");
chipuri("taguri", [...new Set(RETETE.flatMap(r => r.tags))].sort((a, b) => a.localeCompare(b, "ro")).map(t => [t, "#" + t]), "", "tag");
$("token-stare").textContent = memorie.citeste("github_token", "") ? "token salvat pe acest telefon" : "fără token: pozele și jurnalul nu se pot trimite";
numarCos();
$("timer-presetari").innerHTML = [1, 2, 3, 5, 8, 10, 15, 20, 30, 45].map(m => `<button class="chip" type="button" data-min="${m}">${m} min</button>`).join("");
if (location.hash === "#cumparaturi") deschideCumparaturi(false);
else if (RETETE.some(x => x.slug === location.hash.slice(1))) deschide(location.hash.slice(1), false); else inchide();
</script>
</body>
</html>
