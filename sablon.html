<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cartea de rețete</title>
<style>
:root{--fundal:#f5f1e8;--hartie:#fffdf8;--text:#24211c;--mut:#7a7264;--accent:#a8432a;--linie:#e3dccd;--activ:#fbe9dc}
@media (prefers-color-scheme: dark){:root{--fundal:#1b1917;--hartie:#272320;--text:#ebe6dd;--mut:#a69e91;--accent:#e58a6a;--linie:#3b3631;--activ:#43302a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundal);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:2;background:var(--hartie);border-bottom:1px solid var(--linie);padding:.5rem .8rem .6rem}
header>div,main,article{max-width:720px;margin:0 auto}
.cap{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.45rem}
h1{margin:0;font-size:1.2rem}
input[type=search]{width:100%;font:inherit;font-size:1rem;padding:.5rem .7rem;border:1px solid var(--linie);border-radius:10px;background:var(--fundal);color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem;align-items:center}
.chips.linie{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.linie::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linie);background:var(--hartie);border-radius:999px;padding:.25rem .7rem;font-size:.9rem;white-space:nowrap}
.chip.activ{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.fix{background:var(--activ);border-color:var(--activ);cursor:default}
.eticheta{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-right:.2rem;white-space:nowrap}
main{padding:.8rem}
.card{display:block;position:relative;background:var(--hartie);border:1px solid var(--linie);border-radius:14px;padding:.8rem .9rem;margin-bottom:.7rem;text-decoration:none;color:inherit}
.card h2{margin:0 0 .35rem;font-size:1.15rem;padding-right:5.5rem;line-height:1.3}
.card .stare{position:absolute;top:.75rem;right:.8rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:.1rem .5rem}
.meta{font-size:.9rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.15rem .8rem;margin:0}
.meta b{color:var(--text);font-weight:600}
.gol{color:var(--mut);text-align:center;padding:2rem 1rem}
.panou{position:fixed;inset:0;background:var(--fundal);overflow-y:auto;z-index:3;-webkit-overflow-scrolling:touch}
.bara{position:sticky;top:0;z-index:1;background:var(--hartie);border-bottom:1px solid var(--linie);padding:.35rem .4rem;display:flex;align-items:center;gap:.2rem;min-height:2.9rem}
.bara .btn{background:none;border:0;color:var(--accent);padding:.4rem .5rem;font-size:1rem}
.bara .titlu{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#cronometre{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem .8rem;background:var(--hartie);border-top:1px solid var(--linie)}
.cron{border:1px solid var(--linie);background:var(--activ);border-radius:10px;padding:.3rem .7rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:left;line-height:1.2}
.cron small{display:block;font-size:.72rem;font-weight:400;opacity:.85}
.cron.gata{background:var(--accent);border-color:var(--accent);color:#fff;animation:clipire 1s infinite}
@keyframes clipire{50%{opacity:.5}}
#timer-panou{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--hartie);border-top:1px solid var(--linie);padding:.8rem;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
#timer-panou .chips{margin-top:0;margin-bottom:.6rem}
.sari{position:sticky;top:2.9rem;z-index:1;display:flex;background:var(--hartie);border-bottom:1px solid var(--linie);padding:.1rem .4rem;overflow-x:auto;scrollbar-width:none}
.sari button{background:none;border:0;padding:.4rem .6rem;color:var(--mut);font-size:.9rem;white-space:nowrap}
article{padding:.8rem .8rem 6rem}
main{padding-bottom:6rem}
article.mare{font-size:1.15em}
article.foarte-mare{font-size:1.3em}
article h2{margin:.2rem 0 .6rem;font-size:1.5rem;line-height:1.25}
.cifre{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.6rem 0}
.cifre div{background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.5rem .2rem;text-align:center;font-size:.72rem;color:var(--mut)}
.cifre b{display:block;font-size:1.15rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.2}
.dintimp{background:var(--activ);border-radius:12px;padding:.5rem .8rem;margin:.5rem 0}
h3{font-size:.8rem;margin:1.5rem 0 .5rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;scroll-margin-top:5.8rem}
h4{font-size:.95rem;margin:1rem 0 .5rem;color:var(--accent)}
.indiciu{font-size:.85rem;color:var(--mut);margin:-.2rem 0 .6rem}
.portii{display:flex;align-items:center;gap:.5rem;margin:.3rem 0 .6rem;flex-wrap:wrap}
.portii button.rotund{font-size:1.2rem;width:2.4rem;height:2.4rem;border:1px solid var(--linie);border-radius:50%;background:var(--hartie)}
.portii input{width:3.6rem;text-align:center;font:inherit;padding:.4rem;border:1px solid var(--linie);border-radius:8px;background:var(--hartie);color:inherit}
.portii .chip{margin-left:auto}
.ingrediente{list-style:none;margin:0;padding:0;background:var(--hartie);border:1px solid var(--linie);border-radius:12px;overflow:hidden}
.ingrediente li{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border-bottom:1px solid var(--linie)}
.ingrediente li:last-child{border-bottom:0}
.ingrediente li.grup{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--fundal);padding:.4rem .8rem}
.ingrediente input{width:1.25rem;height:1.25rem;margin:0;flex:none}
.ingrediente .nume{flex:1}
.ingrediente .din{display:block;font-size:.8rem;color:var(--mut)}
.ingrediente .cant{text-align:right;line-height:1.2}
.ingrediente .cant b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ingrediente .cant small{display:block;color:var(--mut);font-size:.8rem;max-width:9rem}
.bifat .nume{text-decoration:line-through;color:var(--mut)}
ol{list-style:none;padding:0;margin:0}
ol li{display:flex;gap:.7rem;background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.7rem .8rem;margin-bottom:.6rem;cursor:pointer}
ol li::before{content:attr(value);font-size:1.4rem;font-weight:700;color:var(--accent);min-width:1.4rem;line-height:1.2}
ol li.facut{color:var(--mut);background:var(--fundal)}
ol li.facut::before{content:"✓";color:var(--mut)}
button.timp{font-size:.95em;background:var(--activ);border:1px solid var(--linie);border-radius:6px;padding:0 .4rem;white-space:nowrap}
button.timp.activ{border-color:var(--accent);color:var(--accent);font-weight:600}
details.note{margin-top:1rem;background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.4rem .8rem}
details.note summary{cursor:pointer;font-weight:600;padding:.3rem 0}
details.note p{margin:.4rem 0}
p.p{padding-left:1.1rem;text-indent:-1.1rem}
p.p::before{content:"• ";color:var(--accent)}
.nutritie{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;text-align:center;font-size:.8rem;color:var(--mut);background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.6rem .2rem;margin-bottom:.5rem}
.nutritie b{display:block;font-size:1rem;color:var(--text)}
.intrare{background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.6rem .8rem;margin-bottom:.5rem}
.intrare p{margin:.25rem 0}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div>
  <div class="cap"><h1>Cartea de rețete</h1><span><button class="chip" id="btn-cumparaturi" type="button" hidden>🛒 cumpărături <span id="nr-cumparaturi"></span></button> <button class="chip" id="btn-timer-lista" type="button" title="cronometru">⏱</button></span></div>
  <input id="cautare" type="search" placeholder="Caută după titlu sau ingredient" autocomplete="off">
  <div class="chips" id="stari">
    <span class="chip fix">în carte</span>
    <button class="chip" type="button" data-stare="imbunatatire">de îmbunătățit</button>
    <button class="chip" type="button" data-stare="test">în test</button>
    <button class="chip" type="button" id="btn-filtre">filtre ▾</button>
  </div>
  <div id="filtre" hidden>
    <div class="chips linie" id="sortari"><span class="eticheta">sortare</span>
      <button class="chip activ" type="button" data-sort="gust">gust</button>
      <button class="chip" type="button" data-sort="efort">efort</button>
      <button class="chip" type="button" data-sort="timp">timp</button></div>
    <div class="chips linie" id="categorii"><span class="eticheta">categorie</span></div>
    <div class="chips linie" id="taguri"><span class="eticheta">tag</span></div>
  </div>
</div></header>
<main id="lista"></main>
<section id="detaliu" class="panou" hidden>
  <div class="bara"><button class="btn" id="inapoi" type="button">‹ Înapoi</button><span class="titlu" id="detaliu-titlu"></span><button class="btn" id="btn-timer" type="button" title="cronometru">⏱</button><button class="btn" id="btn-text" type="button" title="text mai mare">Aa</button></div>
  <nav class="sari"><button type="button" data-tinta="s-ingrediente">Ingrediente</button><button type="button" data-tinta="s-pasi">Pași</button><button type="button" data-tinta="s-nutritie">Nutriție</button><button type="button" data-tinta="s-jurnal">Jurnal</button></nav>
  <article id="detaliu-continut"></article>
</section>
<section id="cumparaturi" class="panou" hidden>
  <div class="bara"><button class="btn" id="inapoi-cumparaturi" type="button">‹ Înapoi</button><span class="titlu">Cumpărături</span><button class="btn" id="goleste" type="button">golește</button></div>
  <article id="cumparaturi-continut"></article>
</section>
<div id="cronometre" hidden title="atinge un cronometru ca să-l oprești"></div>
<div id="timer-panou" hidden>
  <div class="chips" id="timer-presetari"></div>
  <div class="portii"><input id="timer-minute" type="number" min="1" inputmode="numeric" placeholder="minute">
    <button class="chip activ" id="timer-start" type="button">pornește</button><button class="chip" id="timer-inchide" type="button">închide</button></div>
</div>
<script>
"use strict";
// build.py înlocuiește marcajul de mai jos cu JSON-ul rețetelor (fără cele la gunoi).
const RETETE = /*@RETETE@*/[];
const CATEGORII = {"mic-dejun": "mic dejun", "pranz-cina": "prânz / cină", "garnitura": "garnitură", "desert": "desert", "sos": "sos"};
const STATUSURI = {carte: "În carte", imbunatatire: "De îmbunătățit", test: "În test"};
const $ = id => document.getElementById(id);
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const rot = (x, pas = 1) => Math.floor(x / pas + 0.5) * pas;  // aceleași operații ca rotunjeste() din build.py
const lei = c => c == null ? "—" : "≈" + String(c).replace(".", ",") + " lei";
const durata = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + m % 60 + " min" : ""}` : `${m} min`;
const ultima = r => r.jurnal[r.jurnal.length - 1] || null;
const acum = d => { const z = Math.floor((Date.now() - new Date(d)) / 864e5); return z <= 0 ? "azi" : z === 1 ? "ieri" : z < 60 ? `acum ${z} zile` : `acum ${Math.round(z / 30)} luni`; };
const sursa = s => /^https?:\/\//.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.split("/")[2] || s)}</a>` : "";
// Starea proprie a paginii (coș de cumpărături, ce e bifat în el, mărimea textului) stă doar în browserul telefonului.
const memorie = {
  citeste(c, implicit) { try { return JSON.parse(localStorage.getItem(c)) ?? implicit; } catch (e) { return implicit; } },
  scrie(c, v) { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} },
};
let cos = memorie.citeste("cos", {}), cumparate = new Set(memorie.citeste("cumparate", [])), marime = memorie.citeste("marime", 0);
// Orice „8 minute” / „3–4 minute” / „30–60 de secunde” dintr-un pas devine buton de cronometru (prima cifră).
const RE_TIMP = /(\d+)(?:[–-]\d+)?\s*(?:de\s+)?(minute|minut|secunde|secundă)\b/g;
const cuCronometre = html => html.replace(RE_TIMP, (m, n, u) =>
  `<button type="button" class="timp" data-s="${+n * (u.startsWith("sec") ? 1 : 60)}">⏱ ${m}</button>`);

// Nutriția per porție și per 100 g, recalculată din valorile per 100 g, exact în ordinea și cu rotunjirile din build.py.
// Se calculează din gramajele originale: per porție nu depinde de numărul de porții (scalarea e proporțională).
function nutritie(r) {
  const t = {kcal: 0, proteine: 0, carbo: 0, grasimi: 0, fibre: 0}, suta = {};
  let cost = 0, complet = true, crud = 0;
  for (const i of r.ingrediente) {
    crud += i.g;
    for (const n in t) t[n] += i.g * i[n] / 100;
    if (i.pret_per_kg == null) complet = false; else cost += i.g / 1000 * i.pret_per_kg;
  }
  const baza = r.greutate_gatita_g || crud;  // per 100 g: pe greutatea gătită dacă e completată, altfel pe ingredientele crude
  for (const n in t) {
    suta[n] = rot(t[n] / baza * 100, n === "kcal" ? 10 : 1);
    t[n] = rot(t[n] / r.portii, n === "kcal" ? 10 : 1);
  }
  t.cost = complet ? rot(cost / r.portii, 0.5) : null;
  return {...t, suta, pe_gatit: !!r.greutate_gatita_g};
}
const grila = n => `<div class="nutritie"><div><b>≈${n.kcal}</b>kcal</div><div><b>≈${n.proteine} g</b>proteine</div>
  <div><b>≈${n.carbo} g</b>carbo</div><div><b>≈${n.grasimi} g</b>grăsimi</div><div><b>≈${n.fibre} g</b>fibre</div></div>`;

// ---------- lista ----------
const filtru = {stari: new Set(["carte"]), sort: "gust", cat: "", tag: ""};
function filtrate() {
  const q = norm($("cautare").value.trim());
  const cheie = {gust: r => -(ultima(r)?.gust ?? -1), efort: r => ultima(r)?.efort ?? 99, timp: r => r.timp_total_min}[filtru.sort];
  return RETETE.filter(r => filtru.stari.has(r.status)
      && (!filtru.cat || r.categorie === filtru.cat) && (!filtru.tag || r.tags.includes(filtru.tag))
      && (!q || norm(r.titlu).includes(q) || r.ingrediente.some(i => norm(i.nume).includes(q))))
    .sort((a, b) => cheie(a) - cheie(b) || String(a.titlu).localeCompare(String(b.titlu), "ro"));
}
function arataLista() {
  const lista = filtrate();
  $("lista").innerHTML = lista.length ? lista.map(r => { const u = ultima(r); return `<a class="card" href="#${esc(r.slug)}" data-slug="${esc(r.slug)}">
    ${r.status !== "carte" ? `<span class="stare">${STATUSURI[r.status] ?? esc(r.status)}</span>` : ""}
    <h2>${esc(r.titlu)}</h2>
    <p class="meta"><span><b>${durata(r.timp_total_min)}</b></span><span><b>≈${r.nutritie.kcal}</b> kcal/porție</span><span>${lei(r.nutritie.cost)}/porție</span>
    ${u ? `<span>gust <b>${u.gust}</b> · efort <b>${u.efort}</b></span><span>gătită ${acum(u.data)}</span>` : "<span>negătită încă</span>"}
    ${r.din_timp ? `<span>din timp: ${esc(r.din_timp)}</span>` : ""}</p></a>`; }).join("")
    : `<p class="gol">${RETETE.length ? "Nicio rețetă pentru filtrele alese." : "Cartea e goală deocamdată."}</p>`;
}
function chipuri(id, valori, ales, cheie) {
  const cont = $(id);
  cont.querySelectorAll(".chip").forEach(c => c.remove());
  for (const [v, text] of [["", "toate"], ...valori])
    cont.insertAdjacentHTML("beforeend", `<button class="chip${v === ales ? " activ" : ""}" type="button" data-${cheie}="${esc(v)}">${esc(text)}</button>`);
}

// ---------- detaliu ----------
let curenta = null, portii = 0, bifate = new Set(), facute = new Set();
function deseneazaDetaliu() {
  const r = curenta, f = portii / r.portii, n = nutritie(r), u = ultima(r);
  let grup = "";
  const ingr = r.ingrediente.map((i, k) => (i.grup && i.grup !== grup ? `<li class="grup">${esc(grup = i.grup)}</li>` : "")
    + `<li class="${bifate.has(k) ? "bifat" : ""}"><input type="checkbox" data-k="${k}" ${bifate.has(k) ? "checked" : ""}>
      <span class="nume">${esc(i.nume)}</span><span class="cant"><b>${Math.max(1, Math.round(i.g * f))} g</b>${i.nota && f === 1 ? `<small>${esc(i.nota)}</small>` : ""}</span></li>`).join("");
  const [pasi, note] = r.pasi_html.split("<h3>Note</h3>");
  const jurnal = r.jurnal.length ? [...r.jurnal].reverse().map(j => `<div class="intrare"><p><b>${esc(j.data)}</b> · v${j.versiune} · gust <b>${j.gust}</b> · efort <b>${j.efort}</b>${j.executie === "greseala_mea" ? " · greșeala mea" : ""}</p>
    ${j.observatii ? `<p>${esc(j.observatii)}</p>` : ""}${j.urmatoarea_data ? `<p><b>Data viitoare:</b> ${esc(j.urmatoarea_data)}</p>` : ""}</div>`).join("") : `<p class="gol">Încă negătită.</p>`;
  $("detaliu-continut").innerHTML = `
    <h2>${esc(r.titlu)}</h2>
    <div class="cifre"><div><b>${durata(r.timp_total_min)}</b>total</div><div><b>${durata(r.timp_activ_min)}</b>activ</div><div><b>${r.portii}</b>porții</div><div><b>≈${n.kcal}</b>kcal/porție</div></div>
    ${r.din_timp ? `<p class="dintimp">⏳ Din timp: ${esc(r.din_timp)}</p>` : ""}
    <p class="meta">${u ? `<span>gust <b>${u.gust}</b> · efort <b>${u.efort}</b> · gătită ${acum(u.data)}</span>` : "<span>negătită încă</span>"}
      ${r.status !== "carte" ? `<span>${STATUSURI[r.status] ?? esc(r.status)}</span>` : ""}${r.tags.length ? `<span>${r.tags.map(t => "#" + esc(t)).join(" ")}</span>` : ""}</p>
    <h3 id="s-ingrediente">Ingrediente</h3>
    <div class="portii"><button class="rotund" type="button" data-d="-1" aria-label="mai puține porții">−</button>
      <input id="portii" type="number" min="1" inputmode="numeric" value="${portii}">
      <button class="rotund" type="button" data-d="1" aria-label="mai multe porții">+</button><span>porții</span>
      <button class="chip${cos[r.slug] ? " activ" : ""}" id="in-cos" type="button">${cos[r.slug] ? "✓ în cumpărături" : "+ cumpărături"}</button></div>
    <ul class="ingrediente">${ingr}</ul>
    <h3 id="s-pasi">Pași</h3><p class="indiciu">Atinge un pas ca să-l bifezi. Atinge un timp ca să pornești cronometrul.</p>
    ${pasi.replace(/<h3>/g, "<h4>").replace(/<\/h3>/g, "</h4>").replace(/<ol>[\s\S]*?<\/ol>/g, cuCronometre)}
    ${note ? `<details class="note"><summary>Note (${(note.match(/<p/g) || []).length})</summary>${note}</details>` : ""}
    <h3 id="s-nutritie">Nutriție per porție</h3>${grila(n)}
    <h3>Nutriție per 100 g ${n.pe_gatit ? "(gătit)" : "(crud, din ingrediente)"}</h3>${grila(n.suta)}
    <p class="meta"><span>cost ${lei(n.cost)}/porție</span>${sursa(r.sursa) ? `<span>sursă: ${sursa(r.sursa)}</span>` : ""}</p>
    <h3 id="s-jurnal">Jurnal</h3>${jurnal}`;
  $("detaliu-continut").querySelectorAll("ol li").forEach((li, k) => li.classList.toggle("facut", facute.has(k)));
  cronometre.forEach(c => butonul(c)?.classList.add("activ"));
}

// Cronometre: oricâte în paralel, într-o bară fixă jos, vizibilă pe orice ecran; sună și vibrează la final.
let cronometre = [], tic = null, audio = null, nrCron = 0;
const butonul = c => c.slug === curenta?.slug && c.idx >= 0 ? $("detaliu-continut").querySelectorAll("button.timp")[c.idx] : null;
function porneste(secunde, eticheta, btn) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  cronometre.push({id: ++nrCron, eticheta, sfarsit: Date.now() + secunde * 1000, gata: false, slug: curenta?.slug,
                   idx: btn ? [...$("detaliu-continut").querySelectorAll("button.timp")].indexOf(btn) : -1});
  btn?.classList.add("activ");
  if (!tic) tic = setInterval(bate, 500);
  bate();
}
function bate() {
  for (const c of cronometre) {
    const rest = Math.max(0, Math.round((c.sfarsit - Date.now()) / 1000));
    c.text = rest ? `${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, "0")}` : "gata!";
    if (!rest && !c.gata) { c.gata = true; suna(); }
  }
  $("cronometre").innerHTML = cronometre.map(c => `<button type="button" class="cron${c.gata ? " gata" : ""}" data-id="${c.id}">⏱ ${c.text}<small>${esc(c.eticheta)}</small></button>`).join("");
  $("cronometre").hidden = !cronometre.length;
  if (!cronometre.length) { clearInterval(tic); tic = null; }
}
function opreste(id) {
  const c = cronometre.find(x => x.id === id);
  if (!c) return;
  butonul(c)?.classList.remove("activ");
  cronometre = cronometre.filter(x => x !== c);
  bate();
}
function aratuTimer(vizibil) { $("timer-panou").hidden = !vizibil; if (vizibil) { $("timer-minute").value = ""; $("timer-minute").focus(); } }
function suna() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
  if (!audio) return;
  try {
    audio.resume && audio.resume();
    [0, 0.45, 0.9].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.connect(g); g.connect(audio.destination); o.frequency.value = 880;
      g.gain.setValueAtTime(0.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.35);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.35);
    });
  } catch (e) {}
}

// Mod gătit: ecranul rămâne aprins cât e deschisă o rețetă (unde browserul permite).
let veghe = null;
async function tineEcranul() { try { veghe = await navigator.wakeLock.request("screen"); } catch (e) {} }
function lasaEcranul() { try { veghe && veghe.release(); } catch (e) {} veghe = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("detaliu").hidden) tineEcranul(); });
function aplicaMarimea() { $("detaliu-continut").className = ["", "mare", "foarte-mare"][marime] || ""; }

// ---------- cumpărături ----------
function numarCos() { const n = Object.keys(cos).length; $("nr-cumparaturi").textContent = n ? `(${n})` : ""; $("btn-cumparaturi").hidden = !n; }
function deseneazaCumparaturi() {
  const retete = Object.keys(cos).map(s => RETETE.find(r => r.slug === s)).filter(Boolean), total = {};
  for (const r of retete) {
    const f = cos[r.slug] / r.portii;
    for (const i of r.ingrediente) { const t = total[i.id] || (total[i.id] = {nume: i.nume, g: 0, din: new Set()}); t.g += i.g * f; t.din.add(r.titlu); }
  }
  const randuri = Object.entries(total).sort((a, b) => a[1].nume.localeCompare(b[1].nume, "ro"));
  $("cumparaturi-continut").innerHTML = retete.length ? `
    <h3>Rețete alese</h3><ul class="ingrediente">${retete.map(r => `<li><span class="nume">${esc(r.titlu)}<span class="din">${cos[r.slug]} porții</span></span><button class="chip" type="button" data-scoate="${esc(r.slug)}">scoate</button></li>`).join("")}</ul>
    <h3>De cumpărat</h3><ul class="ingrediente">${randuri.map(([id, t]) => `<li class="${cumparate.has(id) ? "bifat" : ""}"><input type="checkbox" data-id="${esc(id)}" ${cumparate.has(id) ? "checked" : ""}>
      <span class="nume">${esc(t.nume)}<span class="din">${[...t.din].map(esc).join(", ")}</span></span><span class="cant"><b>${Math.max(1, Math.round(t.g))} g</b></span></li>`).join("")}</ul>`
    : `<p class="gol">Nimic încă. Deschide o rețetă și atinge „+ cumpărături”.</p>`;
}

// ---------- navigare (nu depinde de URL: unele vizualizatoare nu permit schimbarea lui; istoricul e bonus) ----------
function deschide(slug, inIstoric) {
  const r = RETETE.find(x => x.slug === slug);
  if (!r) return inchide();
  if (r !== curenta) { curenta = r; portii = r.portii; bifate = new Set(); facute = new Set(); }
  $("detaliu-titlu").textContent = r.titlu;
  aplicaMarimea();
  deseneazaDetaliu();
  $("cumparaturi").hidden = true;
  $("detaliu").hidden = false;
  $("detaliu").scrollTop = 0;
  document.body.style.overflow = "hidden";
  tineEcranul();
  if (inIstoric) try { history.pushState({slug}, "", "#" + slug); } catch (e) {}
}
function deschideCumparaturi(inIstoric) {
  deseneazaCumparaturi();
  $("detaliu").hidden = true;
  $("cumparaturi").hidden = false;
  document.body.style.overflow = "hidden";
  if (inIstoric) try { history.pushState({cos: 1}, "", "#cumparaturi"); } catch (e) {}
}
function inchide() {
  $("detaliu").hidden = true;
  $("cumparaturi").hidden = true;
  document.body.style.overflow = "";
  lasaEcranul();
  arataLista();
}
// „Înapoi” închide direct (history.back() reîncarcă pagina în unele vizualizatoare); intrarea din istoric rămâne pentru butonul fizic.
const inapoi = () => { inchide(); try { history.replaceState(null, "", "#"); } catch (e) {} };

// ---------- evenimente ----------
$("detaliu-continut").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (b) { portii = Math.max(1, portii + Number(b.dataset.d)); deseneazaDetaliu(); return; }
  if (e.target.closest("#in-cos")) {
    if (cos[curenta.slug]) delete cos[curenta.slug]; else cos[curenta.slug] = portii;
    memorie.scrie("cos", cos); numarCos(); deseneazaDetaliu(); return;
  }
  const t = e.target.closest("button.timp");
  if (t) {
    const c = cronometre.find(x => butonul(x) === t);
    if (c) opreste(c.id); else porneste(+t.dataset.s, `pas ${t.closest("li")?.value ?? ""} · ${t.textContent.replace("⏱ ", "")}`, t);
    return;
  }
  const li = e.target.closest("ol li");
  if (li) {
    const k = [...$("detaliu-continut").querySelectorAll("ol li")].indexOf(li);
    if (facute.has(k)) facute.delete(k); else facute.add(k);
    li.classList.toggle("facut", facute.has(k));
  }
});
$("detaliu-continut").addEventListener("change", e => {
  const el = e.target;
  if (el.id === "portii") { portii = Math.max(1, Math.round(Number(el.value)) || 1); deseneazaDetaliu(); }
  else if (el.dataset.k !== undefined) {
    const k = Number(el.dataset.k);
    if (el.checked) bifate.add(k); else bifate.delete(k);
    el.closest("li").classList.toggle("bifat", el.checked);
  }
});
$("cumparaturi-continut").addEventListener("click", e => {
  const s = e.target.closest("button[data-scoate]");
  if (s) { delete cos[s.dataset.scoate]; memorie.scrie("cos", cos); numarCos(); deseneazaCumparaturi(); }
});
$("cumparaturi-continut").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.id === undefined) return;
  if (el.checked) cumparate.add(el.dataset.id); else cumparate.delete(el.dataset.id);
  memorie.scrie("cumparate", [...cumparate]);
  el.closest("li").classList.toggle("bifat", el.checked);
});
$("goleste").addEventListener("click", () => { cos = {}; cumparate = new Set(); memorie.scrie("cos", cos); memorie.scrie("cumparate", []); numarCos(); deseneazaCumparaturi(); });
$("btn-cumparaturi").addEventListener("click", () => deschideCumparaturi(true));
$("inapoi-cumparaturi").addEventListener("click", inapoi);
$("inapoi").addEventListener("click", inapoi);
$("cronometre").addEventListener("click", e => { const b = e.target.closest(".cron"); if (b) opreste(+b.dataset.id); });
$("btn-timer").addEventListener("click", () => aratuTimer($("timer-panou").hidden));
$("btn-timer-lista").addEventListener("click", () => aratuTimer($("timer-panou").hidden));
$("timer-inchide").addEventListener("click", () => aratuTimer(false));
$("timer-start").addEventListener("click", () => { const m = Math.round(Number($("timer-minute").value)); if (m > 0) { porneste(m * 60, `${m} min`); aratuTimer(false); } });
$("timer-minute").addEventListener("keydown", e => { if (e.key === "Enter") $("timer-start").click(); });
$("timer-presetari").addEventListener("click", e => { const b = e.target.closest("button[data-min]"); if (b) { porneste(+b.dataset.min * 60, `${b.dataset.min} min`); aratuTimer(false); } });
$("btn-text").addEventListener("click", () => { marime = (marime + 1) % 3; memorie.scrie("marime", marime); aplicaMarimea(); });
document.querySelector(".sari").addEventListener("click", e => {
  const b = e.target.closest("button[data-tinta]");
  if (b) $(b.dataset.tinta)?.scrollIntoView({behavior: "smooth", block: "start"});
});
$("lista").addEventListener("click", e => {
  const a = e.target.closest("a.card");
  if (a) { e.preventDefault(); deschide(a.dataset.slug, true); }
});
$("stari").addEventListener("click", e => {
  const b = e.target.closest("button[data-stare]");
  if (b) { b.classList.toggle("activ"); if (b.classList.contains("activ")) filtru.stari.add(b.dataset.stare); else filtru.stari.delete(b.dataset.stare); arataLista(); }
});
$("btn-filtre").addEventListener("click", () => { const f = $("filtre"); f.hidden = !f.hidden; $("btn-filtre").textContent = f.hidden ? "filtre ▾" : "filtre ▴"; });
$("filtre").addEventListener("click", e => {
  const b = e.target.closest("button.chip");
  if (!b) return;
  const cheie = Object.keys(b.dataset)[0];  // sort | cat | tag
  filtru[cheie] = b.dataset[cheie];
  b.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("activ", c === b));
  arataLista();
});
$("cautare").addEventListener("input", arataLista);
window.addEventListener("popstate", () => {  // înapoi/înainte în browser, sau hash schimbat manual
  const s = history.state || {}, slug = s.slug || location.hash.slice(1);
  if (s.cos || slug === "cumparaturi") deschideCumparaturi(false);
  else if (RETETE.some(x => x.slug === slug)) deschide(slug, false); else inchide();
});

// ---------- pornire ----------
chipuri("categorii", Object.keys(CATEGORII).filter(c => RETETE.some(r => r.categorie === c)).map(c => [c, CATEGORII[c]]), "", "cat");
chipuri("taguri", [...new Set(RETETE.flatMap(r => r.tags))].sort((a, b) => a.localeCompare(b, "ro")).map(t => [t, "#" + t]), "", "tag");
numarCos();
$("timer-presetari").innerHTML = [1, 2, 3, 5, 8, 10, 15, 20, 30, 45].map(m => `<button class="chip" type="button" data-min="${m}">${m} min</button>`).join("");
if (location.hash === "#cumparaturi") deschideCumparaturi(false);
else if (RETETE.some(x => x.slug === location.hash.slice(1))) deschide(location.hash.slice(1), false); else inchide();
</script>
