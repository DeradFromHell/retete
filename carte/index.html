<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1F4FA8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Cartea de rețete</title>
<style>
/* Smalț: oala emailată albă cu buză cobalt. Cobaltul e culoarea acțiunilor, roșul doar pentru „gata!”, muștarul pentru „din timp”. */
:root{--smalt:#F3F4F0;--email:#FFFFFF;--cerneala:#13213A;--mut:#566173;--linie:#DCDFE5;--linie-tare:#AEB5C1;
  --cobalt:#1F4FA8;--pe-cobalt:#FFFFFF;--cobalt-fundal:#E5ECF8;--rosie:#C2321F;--pe-rosie:#FFFFFF;--rosie-fundal:#FBE4E0;
  --mustar:#7D5500;--mustar-fundal:#FAEEC6;--marar:#26704A;--pe-marar:#FFFFFF;--marar-fundal:#DFF0E5;--strat:rgba(255,255,255,.14);
  --cifre:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--dock:0px}
@media (prefers-color-scheme:dark){:root{--smalt:#0D131F;--email:#161E2D;--cerneala:#E9EDF4;--mut:#A6B0C0;--linie:#2A3446;--linie-tare:#46536A;
  --cobalt:#91B3F7;--pe-cobalt:#0D131F;--cobalt-fundal:#1B2A47;--rosie:#FF8A7C;--pe-rosie:#2A0D09;--rosie-fundal:#46201B;
  --mustar:#F2C459;--mustar-fundal:#382B0A;--marar:#7AD6A2;--pe-marar:#0D131F;--marar-fundal:#163625;--strat:rgba(13,19,31,.12)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:7.5rem}
body{margin:0;background:var(--smalt);color:var(--cerneala);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  padding-bottom:calc(var(--dock) + 1.5rem)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:0}
.cont{max-width:44rem;margin:0 auto;padding:0 1rem}
.ic{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.28em}
.ic.plin{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* butoane: ținte de cel puțin 44 px */
.buton{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.55rem 1.1rem;border-radius:12px;
  border:2px solid var(--cobalt);background:var(--email);color:var(--cobalt);font-weight:700;text-decoration:none;text-align:center}
.buton.plin{background:var(--cobalt);color:var(--pe-cobalt)}
.buton.mare{width:100%;min-height:56px;font-size:1.08rem}
.buton:active,.chip:active,.card-adauga:active{transform:translateY(1px)}
.ic-btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-width:44px;min-height:44px;padding:0 .5rem;border:0;background:none;color:var(--cobalt);border-radius:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips.derulant{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.derulant::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:.4rem .95rem;border-radius:999px;border:1.5px solid var(--linie-tare);background:var(--email);font-size:.95rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.chip[aria-pressed=true]{background:var(--cerneala);border-color:var(--cerneala);color:var(--smalt)}
.eticheta-rand{font-size:.9rem;color:var(--mut);align-self:center;white-space:nowrap;margin-right:.1rem}

/* lista */
.cap{position:sticky;top:0;z-index:5;background:var(--smalt);border-bottom:1px solid var(--linie);padding:.8rem 0 .7rem}
.cap-sus{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.cap h1{font-size:1.9rem}
.sub{color:var(--mut);font-size:.95rem;margin:.15rem 0 .65rem}
input[type=search],input[type=text],input[type=date],textarea{width:100%;font-size:1rem;padding:.65rem .85rem;border:1.5px solid var(--linie-tare);border-radius:12px;background:var(--email);min-height:48px}
textarea{min-height:5.5rem;resize:vertical}
.cap .chips{margin-top:.6rem}
#filtre{margin-top:.6rem;display:grid;gap:.5rem}
/* cardul: titlul e linkul și acoperă tot cardul; butonul „Gătesc” stă deasupra lui, în rândul de jos */
.card{position:relative;display:grid;grid-template-columns:60px 1fr;gap:.25rem .85rem;background:var(--email);border:1px solid var(--linie);border-left:6px solid var(--cat);border-radius:14px;margin:.75rem 0;padding:.85rem}
.card h2{font-size:1.1rem;font-weight:750;margin:0 0 .3rem}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a::after{content:"";position:absolute;inset:0;border-radius:14px}
.card h2 a:focus-visible{outline:none}
.card h2 a:focus-visible::after{outline:3px solid var(--cobalt);outline-offset:2px}
.mini{position:relative;width:60px;height:60px;border-radius:10px;background:var(--cat);color:#fff;display:grid;place-items:center;font:800 1.7rem/1 var(--cifre);overflow:hidden;grid-row:span 2}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.meta{display:flex;flex-wrap:wrap;gap:.2rem .85rem;margin:0;color:var(--mut);font-size:.92rem}
.meta>span{display:inline-flex;align-items:center;gap:.25rem}
.card-jos{grid-column:2;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.35rem}
.card-jos .meta{flex:1}
.din-timp-mic{color:var(--mustar);font-weight:600;grid-column:2}
.card-adauga{position:relative;z-index:1;margin-left:auto;min-height:44px;padding:.35rem .85rem;border-radius:999px;border:2px solid var(--cobalt);background:var(--email);color:var(--cobalt);display:inline-flex;align-items:center;gap:.3rem;font-size:.92rem;font-weight:750}
.card-adauga[aria-pressed=true]{background:var(--cobalt);color:var(--pe-cobalt)}
.stare{display:inline-block;font-size:.85rem;font-weight:700;border-radius:999px;padding:.05rem .6rem}
.stare.carte{background:var(--marar-fundal);color:var(--marar)}
.stare.imbunatatire{background:var(--mustar-fundal);color:var(--mustar)}
.stare.test,.stare.gunoi{background:var(--linie);color:var(--cerneala)}
.gust{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
.gust i{display:inline-block;width:4.5rem;height:.5rem;border-radius:99px;background:linear-gradient(90deg,var(--cobalt) calc(var(--g)*10%),var(--linie) 0)}
.gol{background:var(--email);border:1px dashed var(--linie-tare);border-radius:14px;padding:1.2rem;margin:1rem 0;text-align:center}
.gol p{margin:0 0 .8rem}
.subsol{color:var(--mut);font-size:.92rem;margin:2rem 0 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .6rem}

/* bara de sus a vederilor */
.bara{position:sticky;top:0;z-index:6;background:var(--smalt);border-bottom:1px solid var(--linie)}
.bara>.cont{display:flex;align-items:center;gap:.2rem;min-height:56px;padding:0 .4rem}
.bara .titlu{flex:1;min-width:0;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sari{position:sticky;top:57px;z-index:5;background:var(--smalt);border-bottom:1px solid var(--linie)}
.sari .chips{padding:.4rem 1rem}
.sari .chip{font-size:.92rem;border-color:var(--linie)}

/* rețeta */
.marire{font-size:1em}
body[data-marime="1"] .marire{font-size:1.12em}
body[data-marime="2"] .marire{font-size:1.25em}
.erou{padding-top:1rem}
.erou h1{font-size:1.85rem;margin:.1rem 0 .5rem}
.poza{margin:.75rem 0;border-radius:16px;overflow:hidden;background:var(--email);border:1px solid var(--linie)}
.poza img{display:block;width:100%;height:auto;max-height:62vh;object-fit:cover}
.actiuni{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0}
.actiuni .buton.plin{flex:1 1 12rem}
.cifre{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.6rem,1fr));gap:.5rem;margin:.9rem 0}
.cifre div{background:var(--email);border:1px solid var(--linie);border-radius:12px;padding:.55rem .4rem;text-align:center;font-size:.88rem;color:var(--mut)}
.cifre b{display:block;font:800 1.35rem/1.15 var(--cifre);color:var(--cerneala);font-variant-numeric:tabular-nums}
.din-timp{display:flex;gap:.6rem;align-items:flex-start;background:var(--mustar-fundal);color:var(--mustar);border-radius:12px;padding:.75rem .9rem;margin:.75rem 0;font-weight:600}
.din-timp span{color:var(--cerneala);font-weight:400;display:block}
.sectiune{font-size:1.35rem;margin:2.2rem 0 .8rem;scroll-margin-top:7.5rem}
.portii{display:flex;align-items:center;gap:.5rem;margin:0 0 .75rem;flex-wrap:wrap}
.portii .rotund{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--linie-tare);background:var(--email);display:grid;place-items:center;color:var(--cobalt)}
.portii output{min-width:2ch;text-align:center;font:800 1.3rem var(--cifre)}
.portii .buton{margin-left:auto}
.lista{list-style:none;margin:0;padding:0;background:var(--email);border:1px solid var(--linie);border-radius:14px}
.lista>li+li{border-top:1px solid var(--linie)}
.lista .grup{padding:.75rem .9rem .3rem;font-weight:750;color:var(--cobalt)}
.lista .grup+li{border-top:0}
.ingr{display:flex;align-items:baseline;gap:.6rem;padding:.6rem .9rem;min-height:52px;cursor:pointer}
.ingr input{width:24px;height:24px;margin:0;flex:none;align-self:center;accent-color:var(--marar)}
.ingr-nume{flex:0 1 auto;min-width:0}
.ghidaj{flex:1 1 .75rem;min-width:.75rem;border-bottom:2px dotted var(--linie-tare);transform:translateY(-.3em)}
.ingr-cant{flex:none;max-width:48%;text-align:right;line-height:1.25}
.ingr-cant b{font:750 1.02rem var(--cifre);font-variant-numeric:tabular-nums;white-space:nowrap}
.ingr-cant small{display:block;color:var(--mut);font-size:.88rem}
.ingr.luat .ingr-nume{color:var(--mut);text-decoration:line-through}
.surse{display:inline-flex;gap:3px;align-self:center}
.surse i{width:10px;height:10px;border-radius:50%;background:var(--b)}
.lista .sterge{min-width:44px}
.pasi{list-style:none;margin:0;padding:0}
.pas{display:grid;grid-template-columns:48px 1fr;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--linie);cursor:pointer;scroll-margin-top:8.5rem}
.pas:last-child{border-bottom:0}
.pas-nr{width:44px;height:44px;border-radius:50%;border:2px solid var(--cobalt);background:var(--email);color:var(--cobalt);display:grid;place-items:center;font:800 1.05rem var(--cifre)}
.pas.facut .pas-nr{background:var(--marar);border-color:var(--marar);color:var(--pe-marar)}
.pas.facut .pas-text{color:var(--mut)}
.pas-text{padding-top:.45rem}
.pasi.mari .pas-text{font-size:1.15em;line-height:1.55}
.timp{display:inline-flex;align-items:center;gap:.3rem;min-height:44px;padding:.15rem .75rem;margin:.1rem 0;border-radius:999px;border:1.5px solid var(--cobalt);
  background:var(--cobalt-fundal);color:var(--cobalt);font:750 .95em var(--cifre);font-variant-numeric:tabular-nums;vertical-align:baseline}
.timp.merge{background:var(--cobalt);color:var(--pe-cobalt)}
.timp.gata{background:var(--rosie);border-color:var(--rosie);color:var(--pe-rosie)}
h3.etapa{font-size:1.05rem;color:var(--cobalt);margin:1.4rem 0 .2rem}
.text-lista{background:var(--email);border:1px solid var(--linie);border-radius:14px;padding:.4rem 1rem}
.text-lista p{margin:.55rem 0}
details.pliat{background:var(--email);border:1px solid var(--linie);border-radius:14px;margin:.75rem 0}
details.pliat>summary{min-height:52px;display:flex;align-items:center;padding:0 1rem;font-weight:700;cursor:pointer}
details.pliat>div{padding:0 1rem .5rem}
table.nutritie{width:100%;border-collapse:collapse;background:var(--email);border:1px solid var(--linie);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.nutritie th,.nutritie td{padding:.55rem .8rem;text-align:right;border-top:1px solid var(--linie)}
.nutritie th:first-child,.nutritie td:first-child{text-align:left}
.nutritie thead th{border-top:0;color:var(--mut);font-weight:600;font-size:.9rem}
.nutritie td b{font-family:var(--cifre)}
.mic{color:var(--mut);font-size:.92rem}
.intrare{border-left:4px solid var(--marar);background:var(--email);border-radius:0 12px 12px 0;padding:.6rem .9rem;margin:.6rem 0}
.intrare.greseala{border-left-color:var(--mustar)}
.intrare p{margin:.25rem 0}
.formular{background:var(--email);border:1px solid var(--linie);border-radius:14px;padding:1rem;margin-top:1rem}
.formular fieldset{border:0;padding:0;margin:0 0 1.1rem}
.formular legend,.formular label>span{font-weight:700;margin-bottom:.35rem;display:block}
.formular label{display:block;margin-bottom:1rem}
.ancore{list-style:none;padding:0;margin:0 0 .5rem;color:var(--mut);font-size:.92rem;display:flex;flex-wrap:wrap;gap:.15rem 1rem}
.grila{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.grila .chip{justify-content:center;padding:0;font:750 1.05rem var(--cifre)}
.previz{border-radius:12px;padding:.6rem .8rem;margin:0 0 1rem;background:var(--cobalt-fundal)}
.stare-scriere{margin:.75rem 0;padding:.65rem .85rem;border-radius:12px;font-weight:600;background:var(--mustar-fundal);color:var(--mustar)}
.stare-scriere.ok{background:var(--marar-fundal);color:var(--marar)}
.stare-scriere.eroare{background:var(--rosie-fundal);color:var(--rosie)}

/* gătit */
.benzi{position:sticky;top:57px;z-index:5;background:var(--smalt);border-bottom:1px solid var(--linie)}
.benzi .chips{padding:.5rem 1rem}
.banda{flex:none;min-height:58px;max-width:16rem;display:flex;align-items:center;gap:.6rem;padding:.4rem .85rem;border-radius:14px;border:1.5px solid var(--linie-tare);background:var(--email);text-align:left}
.banda[aria-pressed=true]{border-color:var(--b);box-shadow:inset 0 -4px 0 var(--b)}
.punct{width:12px;height:12px;border-radius:50%;background:var(--b);flex:none;display:inline-block}
.banda b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banda small{display:block;font-size:.85rem;color:var(--mut);font-variant-numeric:tabular-nums}
.banda small.atentie{color:var(--rosie);font-weight:700}
.titlu-banda{display:flex;align-items:center;gap:.5rem;margin:1rem 0 .1rem;color:var(--mut);font-weight:600}
.etapa-cap{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin:.2rem 0 .6rem}
.etapa-cap h2{font-size:1.5rem}
.asteptare{background:var(--cobalt-fundal);border-radius:14px;padding:.8rem .9rem;margin:.6rem 0 .9rem}
.asteptare p{margin:0 0 .5rem}
.asteptare .buton{width:100%;margin-top:.4rem}
.nevoie{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .8rem}
.nevoie span{background:var(--email);border:1px solid var(--linie);border-radius:10px;padding:.3rem .65rem;font-size:.93rem}
.nevoie small{color:var(--mut);font-size:.92em}
.plan-ordine{list-style:none;margin:0;padding:0;counter-reset:o}
.plan-ordine li{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .7rem;align-items:center;background:var(--email);border:1px solid var(--linie);border-left:6px solid var(--b);border-radius:12px;padding:.7rem .8rem;margin:.5rem 0}
.plan-ordine li .portii{grid-column:1/-1;margin:.3rem 0 0}
.comutator{display:flex;align-items:center;gap:.6rem;min-height:48px;margin:.4rem 0;cursor:pointer}
.comutator input{width:24px;height:24px;accent-color:var(--cobalt);margin:0}
.final{text-align:center;padding:2rem 0}
.final h2{font-size:1.8rem;margin-bottom:.5rem}
.final .buton{width:100%;margin:.35rem 0}

/* bara emailată de jos: cronometrele și ce e în curs */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--cobalt);color:var(--pe-cobalt);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 28px rgba(13,19,31,.22);padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom))}
#dock .cont{display:grid;gap:.5rem}
.dock-cron{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none}
.dock-cron::-webkit-scrollbar{display:none}
.cron{position:relative;flex:none;display:grid;grid-template-columns:1fr auto;background:var(--strat);border-radius:14px;overflow:hidden;min-width:10.5rem;max-width:16rem}
.cron-du{border:0;background:none;color:inherit;text-align:left;padding:.45rem .2rem .6rem .7rem;border-left:6px solid var(--b);min-height:56px}
.cron-du b{display:block;font:800 1.7rem/1.05 var(--cifre);font-variant-numeric:tabular-nums}
.cron-du small{display:block;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12rem}
.cron-x{border:0;background:none;color:inherit;min-width:44px}
.cron-apoi{grid-column:1/-1;border:0;border-top:1px solid currentColor;background:none;color:inherit;font-weight:750;min-height:44px;text-align:left;padding:0 .75rem}
.cron .progres{position:absolute;left:0;bottom:0;height:4px;background:currentColor;opacity:.55;width:var(--p,0%)}
.cron.gata{background:var(--rosie);color:var(--pe-rosie);animation:puls 1.2s ease-in-out infinite}
@keyframes puls{50%{filter:brightness(1.12)}}
.dock-act{display:flex;gap:.5rem}
.dock-act .buton{flex:1;border-color:var(--pe-cobalt);background:transparent;color:var(--pe-cobalt);min-height:48px;padding:.4rem .7rem}

/* foi care urcă de jos */
.foaie{position:fixed;inset:0;z-index:30;background:rgba(13,19,31,.5);display:flex;align-items:flex-end}
.foaie>div{background:var(--smalt);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom))}
.foaie h2{font-size:1.3rem;margin-bottom:.4rem}
.foaie .rand{display:flex;gap:.5rem;margin-top:.9rem}
.foaie .rand .buton{flex:1}
a{color:var(--cobalt)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M19 6l-1.5 1.5"/></symbol>
  <symbol id="i-cos" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></symbol>
  <symbol id="i-poza" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-inapoi" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M3 18l5-12 5 12M5 14h6M14.5 18l3.5-8 3.5 8M15.6 15.5h4.8"/></symbol>
  <symbol id="i-oala" viewBox="0 0 24 24"><path d="M3 10h18M5 10v6a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4v-6M9.5 7c0-1.4 1.1-2.5 2.5-2.5s2.5 1.1 2.5 2.5"/></symbol>

 scurt de ulei pe grătarul încins și carnea deasupra: 8 minute, până prinde culoare pe fața de sus."}, {"n": 7, "text": "Întoarce și mai lasă 3 minute, până e rumenită pe margini."}], "text": []}, {"titlu": "Glazura, în paralel", "pasi": [{"n": 8, "text": "Din minutul 8 (când întorci pieptul): într-o crăticioară mică pune sos de soia, miere, oțet, ghimbir și usturoi (fără amidon), la foc mediu, amestecând, până dă în clocot; lasă să clocotească 2 minute."}, {"n": 9, "text": "Separat, într-o ceșcuță, amestecă amidonul cu cele 2 linguri de apă rece până e complet omogen, fără cocoloașe."}, {"n": 10, "text": "Toarnă amidonul în crăticioara care clocotește, amestecând continuu: în 30–60 de secunde se îngroașă și îmbracă lingura."}, {"n": 11, "text": "Dacă rămâne apoasă, nu a clocotit destul: trebuie bule vizibile, nu doar abur. Mai adaugă o linguriță de amidon dizolvat în apă rece și adu din nou la clocot puternic; alternativ, fierbe 3–4 minute fără capac, până se reduce și se îngroașă singură."}, {"n": 12, "text": "Ia glazura de pe foc; se mai îngroașă pe măsură ce se răcește."}], "text": []}, {"titlu": "Finalizare", "pasi": [{"n": 13, "text": "La minutul 11, scoate pieptul, pensulează-l cu glazură și pune-l înapoi 2 minute, până glazura devine lucioasă și se lipește de carne; total în air fryer ~13 minute."}, {"n": 14, "text": "Scoate, mai pensulează o dată deasupra și lasă-l să se odihnească 5 minute înainte să-l tai."}, {"n": 15, "text": "Presară semințele de susan prăjite și ceapa verde tăiată."}], "text": []}, {"titlu": "Păstrare și reîncălzire", "pasi": [], "text": ["Frigider: în cutie închisă, 3–4 zile. Glazura rămasă, separat, într-un borcan, până la o săptămână.", "Air fryer (cel mai bine): bucata întreagă, nu feliată, la 160 °C, 3–4 minute, până e fierbinte la mijloc; pensulează cu puțină glazură la final.", "Microunde: 1–1,5 minute, cu o lingură de apă și capac, ca să nu se usuce.", "Rece, feliat subțire, merge în salată sau sandvici, fără reîncălzire."]}, {"titlu": "Note", "pasi": [], "text": ["Semințele de susan crude sunt aproape fără gust: prăjește-le înainte, în tigaie uscată, fără ulei, la foc mediu, 2–3 minute, amestecând des, până devin aurii și miros a prăjit. Se ard în câteva secunde, stai lângă ele. Poți prăji toată punga odată; țin săptămâni într-un borcan.", "Marinada nu pătrunde mai mult de 2–3 mm în carne, oricât ai lăsa-o; aroma reală vine din glazura aplicată la final.", "Nu refolosi marinada în care a stat carne crudă; fă porție separată pentru glazură.", "Amidonul se dizolvă întotdeauna în apă rece, separat, înainte să ajungă în lichid fierbinte; altfel face cocoloașe.", "Tamponează carnea slabă (piept) înainte de air fryer: umezeala face abur, iar aburul înseamnă fără crustă.", "Acidul (lămâie, oțet) în cantitate mare, pe termen lung, strică textura pieptului; în glazură, la final, e în regulă.", "Dacă le faci împreună cu pulpele la cuptor, cronologia serii e în rețeta „pulpe-pui-cuptor”.", "Merge cu (sugestii): orez simplu fiert, care absoarbe glazura; orez cu legume în tigaie, cum faci deja; broccoli sau fasole verde sotată; salată de castraveți cu oțet de mere și puțin susan.", "Nutriție (observația lui Claude): marinada se aruncă, dar e numărată integral, ≈80 kcal/porție (mai ales mierea și uleiul de susan); fără ea, porția ar avea ≈380 kcal, nu 460. La fel sarea: din ≈6,9 g/porție afișate, jumătate e soia din marinada aruncată; realist, ≈3,5 g. Susanul și ceapa verde de la servit sunt cantități estimate.", "Indiciile senzoriale de la pașii 6, 7, 10 și 13 sunt propuse de Claude, nu din experiența ta; corectează-le după prima gătire."]}], "jurnal": [], "status_manual": null}, {"slug": "pui-sos-miere-usturoi-orez", "titlu": "Pui cu sos de miere și usturoi, cu orez jasmine", "categorie": "pranz-cina", "tags": ["pui", "air-fryer", "sos", "orez", "meal-prep", "congelabil"], "sursa": "propriu", "status": "imbunatatire", "versiune": 2, "portii": 4, "din_timp": "", "timp_activ_min": 30, "timp_total_min": 45, "greutate_gatita_g": null, "ingrediente": [{"id": "piept_pui", "nume": "Piept de pui fără piele, crud", "g": 1000, "nota": "cuburi de ~2,5 cm", "grup": "Puiul", "kcal": 120.0, "proteine": 22.5, "carbo": 0.0, "grasimi": 2.62, "fibre": 0.0, "sare": 0.11, "pret_per_kg": 35.0}, {"id": "sos_soia_kikkoman", "nume": "Sos de soia", "g": 32, "nota": "30 ml", "grup": "Puiul", "kcal": 77.0, "proteine": 10.0, "carbo": 3.2, "grasimi": 0.0, "fibre": 0.0, "sare": 16.9, "pret_per_kg": 45.0}, {"id": "apa", "nume": "Apă", "g": 30, "nota": "30 ml", "grup": "Puiul", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 0.0}, {"id": "usturoi", "nume": "Usturoi, crud", "g": 24, "nota": "6 căței, rași", "grup": "Puiul", "kcal": 149.0, "proteine": 6.36, "carbo": 33.1, "grasimi": 0.5, "fibre": 2.1, "sare": 0.04, "pret_per_kg": 25.0}, {"id": "ghimbir", "nume": "Ghimbir proaspăt", "g": 10, "nota": "curățat și ras", "grup": "Puiul", "kcal": 80.0, "proteine": 1.82, "carbo": 17.8, "grasimi": 0.75, "fibre": 2.0, "sare": 0.03, "pret_per_kg": 25.0}, {"id": "amidon_porumb", "nume": "Amidon de porumb", "g": 100, "nota": "pentru crustă; o parte rămâne în bol", "grup": "Puiul", "kcal": 381.0, "proteine": 0.26, "carbo": 91.3, "grasimi": 0.05, "fibre": 0.9, "sare": 0.02, "pret_per_kg": 12.0}, {"id": "ulei_spray_masline", "nume": "Ulei de măsline, spray", "g": 9, "nota": "10 ml, spray înainte și la jumătate", "grup": "Puiul", "kcal": 822.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 91.4, "fibre": 0.0, "sare": 0.0, "pret_per_kg": 60.0}, {"id": "piper_alb", "nume": "Piper alb măcinat", "g": 1, "nota": "după gust", "grup": "Puiul", "kcal": 296.0, "proteine": 10.4, "carbo": 68.6, "grasimi": 2.12, "fibre": 26.2, "sare": 0.01, "pret_per_kg": 150.0}, {"id": "ulei_spray_masline", "nume": "Ulei de măsline, spray", "g": 9, "nota": "10 ml", "grup": "Sosul", "kcal": 822.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 91.4, "fibre": 0.0, "sare": 0.0, "pret_per_kg": 60.0}, {"id": "usturoi", "nume": "Usturoi, crud", "g": 24, "nota": "6 căței, rași", "grup": "Sosul", "kcal": 149.0, "proteine": 6.36, "carbo": 33.1, "grasimi": 0.5, "fibre": 2.1, "sare": 0.04, "pret_per_kg": 25.0}, {"id": "sos_soia_kikkoman", "nume": "Sos de soia", "g": 64, "nota": "60 ml", "grup": "Sosul", "kcal": 77.0, "proteine": 10.0, "carbo": 3.2, "grasimi": 0.0, "fibre": 0.0, "sare": 16.9, "pret_per_kg": 45.0}, {"id": "apa", "nume": "Apă", "g": 150, "nota": "150 ml", "grup": "Sosul", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 0.0}, {"id": "fulgi_ardei_iute", "nume": "Fulgi de ardei iute", "g": 1, "nota": "opțional", "grup": "Sosul", "kcal": 318.0, "proteine": 12.0, "carbo": 56.6, "grasimi": 17.3, "fibre": 27.2, "sare": 0.07, "pret_per_kg": 80.0}, {"id": "amidon_porumb", "nume": "Amidon de porumb", "g": 8, "nota": "pentru legat (2 lingurițe)", "grup": "Sosul", "kcal": 381.0, "proteine": 0.26, "carbo": 91.3, "grasimi": 0.05, "fibre": 0.9, "sare": 0.02, "pret_per_kg": 12.0}, {"id": "apa", "nume": "Apă", "g": 20, "nota": "20 ml apă rece, pentru amidon", "grup": "Sosul", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 0.0}, {"id": "miere", "nume": "Miere", "g": 45, "nota": "la final, de pe foc", "grup": "Sosul", "kcal": 304.0, "proteine": 0.3, "carbo": 82.4, "grasimi": 0.0, "fibre": 0.2, "sare": 0.01, "pret_per_kg": 40.0}, {"id": "orez", "nume": "Orez alb cu bob lung, crud", "g": 300, "nota": "jasmine, spălat până apa iese limpede", "grup": "Orezul", "kcal": 365.0, "proteine": 7.13, "carbo": 80.0, "grasimi": 0.66, "fibre": 1.3, "sare": 0.01, "pret_per_kg": 8.0}, {"id": "apa", "nume": "Apă", "g": 550, "nota": "550 ml, rece", "grup": "Orezul", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 0.0}], "nutritie": {"kcal": 790, "proteine": 65, "carbo": 99, "grasimi": 11, "fibre": 2, "sare": 4.4, "cost": 12}, "sectiuni": [{"titlu": "Puiul", "pasi": [{"n": 1, "text": "Într-un bol, amestecă cuburile de pui cu sosul de soia, apa, usturoiul ras, ghimbirul și piperul alb. Lasă 10 minute."}, {"n": 2, "text": "Scurge cuburile într-o strecurătoare ~1 minut, până nu mai picură; udă, iau un strat gros de amidon care apoi soarbe sosul."}, {"n": 3, "text": "Pune amidonul într-un bol și trece cuburile prin el în două ture, nu toate deodată; apoi scutură-le într-o sită, până stratul e subțire, ca o pudră, nu o cocă. Amidonul rămas în bol se aruncă."}, {"n": 4, "text": "Air fryer la 200 °C, 16 minute, agitând coșul de două ori; pulverizează ulei la început și încă o dată la jumătate. Un singur strat în coș, altfel fă-le în două reprize. Gata când crusta e aurie și uscată la atingere. La cuptor: 190 °C, 18 minute, pe hârtie de copt."}], "text": []}, {"titlu": "Orezul (pornește odată cu puiul)", "pasi": [{"n": 5, "text": "Când puiul intră în air fryer, pune orezul spălat și apa rece într-o cratiță, la foc mare, până dă în clocot: bule mari, care sparg suprafața. Nu săra apa: sosul aduce destulă sare."}, {"n": 6, "text": "Pune capacul, dă focul la minimum și lasă 12 minute. Stinge focul și lasă-l cu capacul pus până e gata totul; așa rămâne cald. Nu ridica capacul și nu amesteca; e singura greșeală care strică orezul. Afânează cu furculița abia la servire."}], "text": []}, {"titlu": "Sosul (în ultimele 10 minute ale puiului)", "pasi": [{"n": 7, "text": "Într-o tigaie la foc mediu, pulverizează uleiul și pune usturoiul ras; călește ~1 minut, până începe să miroasă, fără să se rumenească."}, {"n": 8, "text": "Adaugă sosul de soia și apa și adu la fierbere ușoară: bule mici pe margini."}, {"n": 9, "text": "Separat, amestecă amidonul cu apa rece până se dizolvă complet. Dă focul mic, toarnă amestecul și fulgii de ardei, amestecând."}, {"n": 10, "text": "Ține la clocot mic 2 minute întregi, amestecând, până sosul îmbracă lingura și lasă urmă când tragi cu degetul pe dosul ei. Dacă tot e apos, încă 1 minut; dacă iese prea gros, subțiază cu puțină apă."}, {"n": 11, "text": "Ia tigaia de pe foc și adaugă mierea. Gustă. Nu adăuga sare înainte să guști: cu soia clasică, sosul e deja la limită."}], "text": []}, {"titlu": "Servire", "pasi": [{"n": 12, "text": "Pune puiul în sos și amestecă până se acoperă uniform. Servește peste orez; opțional, ceapă verde tăiată deasupra."}], "text": []}, {"titlu": "Păstrare și reîncălzire", "pasi": [], "text": ["Frigider: 3 zile; congelator: 4 luni, decongelat peste noapte la frigider. Orezul în cutie separată.", "Cel mai bine: păstrează puiul fără sos (pune în sos doar ce mănânci pe loc). La reîncălzire, puiul în air fryer la 180 °C, 4–5 minute, până crusta e din nou uscată și crocantă, și sos proaspăt, făcut în 5 minute, doar pentru porția de atunci.", "Sos proaspăt pentru o porție: 15 ml soia (1 lingură), 40 ml apă, 1–2 căței de usturoi, 2 g amidon (2/3 linguriță) dizolvat în 1 linguriță de apă rece, 11 g miere (1/2 lingură) la final, de pe foc. Aceiași pași ca la sosul mare; la cantitatea asta se leagă în mai puțin de 1 minut, stai lângă el.", "Dacă puiul e deja în sos (crusta a sorbit sosul și pare uscat): tigaie la foc mediu, cu 2 linguri de apă, 3–4 minute, până se desprinde și e fierbinte la mijloc. Apoi toarnă peste el sos proaspăt, jumătate de porție și mai slab în soia, fiindcă puiul are deja sarea din sosul vechi: 10 ml soia (2 lingurițe), 40 ml apă, 1 cățel de usturoi, 2 g amidon în 1 linguriță de apă rece, 1 linguriță de miere la final; amestecă 1 minut, până e lucios. Crocant nu mai devine.", "Microunde: 2 minute, amestecat la jumătate. Orezul, cu o lingură de apă peste porție și capac, 1,5–2 minute, până ies aburi.", "Crusta nu mai e crocantă după ce a stat în sos; e normal."]}, {"titlu": "Note", "pasi": [], "text": ["Adaptare după rețeta lui Jack Ovens (scrisă cu alt AI): originalul cere 140 ml sos de soia cu sodiu redus; cu Kikkoman clasic (16,9 g sare/100 ml) ar însemna ~6 g sare pe porție, așa că soia e redusă la 70 ml și diferența e completată cu apă. Rezultă ~3 g sare pe porție. Dacă vrei mai jos, înlocuiește 20 ml de soia cu apă și compensează cu mai mult usturoi și ghimbir.", "De ce apă, nu supă: cuburile și granulele de supă au 10–15 g sare la 100 g; peste soia ar duce porția peste 4 g sare.", "Grăsimea din sos: originalul cere 28 g de unt; aici e spray de măsline, usturoiul se călește la fel și nu stropește. Dacă folosești unt, să fie de minimum 82% grăsime, nu tartinabil (are apă și ulei vegetal, sare din tigaie).", "Originalul cere și zahăr brun și miere, la pași diferiți; aici e păstrată doar mierea.", "Nutriție: estimare pesimistă, tot amidonul (100 g) e numărat, deși o parte bună rămâne în bol; caloriile și carbohidrații reali sunt mai mici. Orezul e ~270 kcal din porție; dacă vrei să scazi caloriile, taie din orez, nu din sos. Mierea și amidonul sunt valori USDA generice; sosul de soia, uleiul spray și restul, de pe etichete.", "Fără orez, rețeta nu merge ca atare: sosul e calculat să se întindă peste orez neutru; înjumătățește sosul și servește cu cartofi natur. Amestecurile congelate orez-cu-legume au adesea sare și condimente; încălzește-le separat, nu în sos.", "v2 (după prima gătire, 2026-09-17): sos de 1,5 ori (la v1 nu a ajuns nici pentru 3 porții) și legat cu 8 g amidon în loc de 4, clocotit 2 minute; cuburile scurse și scuturate în sită, în două ture, ca stratul de amidon să fie subțire; orezul pornit odată cu puiul și ținut cu capacul pus, ca să nu se răcească. Amidonul pentru crustă rămâne 100 g.", "De testat la v3: amidon amestecat cu puțină făină de orez pentru crustă mai crocantă; soia redusă, cu mai mult ghimbir, dacă iese prea sărat."]}], "jurnal": [{"data": "2026-09-17", "versiune": 1, "gust": 7, "efort": 2, "executie": "ok", "observatii": "Cred ca sunt urmatoarele probleme, Cred ca am pus prea mult amidon, sau nu le-am scuturat cum a trebuit. Sos-ul mi-a iesit foarte apos nu era gros, si sos-ul nu mi-a ajuns pentru jumatate, Sos-ul mi-a ajuns de 3 portii, si orez tot de 3 portii. A fost facuta in 2 ture, una la cuptor si una la airfryer, pentru cele din air fryer care insumeaza cam 2 portii cred, nu am mai avut sos. Orezul se termina prea repede, si dupa se raceste pana se termina celelalte, poate ar fi o idee buna, sa punem orezul odata cu puiul cand se baga la cuptor sau airfryer"}], "status_manual": null}, {"slug": "pulpe-pui-cuptor", "titlu": "Pulpe superioare de pui la cuptor, cu piele crocantă", "categorie": "pranz-cina", "tags": ["pui", "cuptor"], "sursa": "propriu", "status": "test", "versiune": 1, "portii": 3, "din_timp": "sărare 40 min până la câteva ore înainte", "timp_activ_min": 15, "timp_total_min": 65, "greutate_gatita_g": null, "ingrediente": [{"id": "pulpe_pui", "nume": "Pulpe de pui cu piele, fără os, crude", "g": 450, "nota": "4 pulpe superioare cu os și piele, ~600 g cântărite cu os", "grup": "", "kcal": 221.0, "proteine": 16.5, "carbo": 0.25, "grasimi": 16.6, "fibre": 0.0, "sare": 0.2, "pret_per_kg": 25.0}, {"id": "sare", "nume": "Sare de masă", "g": 3, "nota": "1/2 linguriță (o linguriță întreagă dacă nu pui sos teriyaki)", "grup": "", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 97.0, "pret_per_kg": 2.0}, {"id": "piper", "nume": "Piper negru măcinat", "g": 1, "nota": "după gust", "grup": "", "kcal": 251.0, "proteine": 10.4, "carbo": 64.0, "grasimi": 3.26, "fibre": 25.3, "sare": 0.05, "pret_per_kg": 120.0}, {"id": "boia", "nume": "Boia de ardei dulce", "g": 2.3, "nota": "1 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 60.0}, {"id": "boia_afumata", "nume": "Boia de ardei afumată", "g": 1.2, "nota": "1/2 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 80.0}, {"id": "ulei_floarea_soarelui", "nume": "Ulei de floarea-soarelui", "g": 4, "nota": "2 spray-uri scurte, pe pulpe și pe grătar", "grup": "", "kcal": 884.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 100.0, "fibre": 0.0, "sare": 0.0, "pret_per_kg": 10.0}, {"id": "sos_teriyaki", "nume": "Sos teriyaki din comerț", "g": 54, "nota": "3 linguri (2–4), pentru glazurat", "grup": "", "kcal": 89.0, "proteine": 5.93, "carbo": 15.6, "grasimi": 0.02, "fibre": 0.1, "sare": 9.57, "pret_per_kg": 40.0}], "nutritie": {"kcal": 360, "proteine": 26, "carbo": 4, "grasimi": 26, "fibre": 1, "sare": 3, "cost": 4.5}, "sectiuni": [{"titlu": "Din timp", "pasi": [{"n": 1, "text": "Cu 40 de minute până la câteva ore înainte: sărează pulpele peste tot, inclusiv sub piele dacă poți strecura degetul, și lasă-le pe o farfurie, cu pielea în sus, descoperite, la frigider. Sarea trage umezeala din piele; piele uscată înseamnă piele crocantă. Fără pasul ăsta iese moale și palidă, indiferent ce faci după."}], "text": []}, {"titlu": "Cuptorul și condimentarea", "pasi": [{"n": 2, "text": "Pune tava cu grătarul de sârmă în cuptor și încălzește la 200 °C, 10–15 minute, până e complet încins. Toarnă apă cât un deget în tavă, sub grătar: grăsimea care picură pe tavă goală fumegă, cu apă nu."}, {"n": 3, "text": "Șterge umezeala vizibilă de pe piele (fără să tamponezi insistent, ca la piept) și freacă pielea cu piper, boia dulce și boia afumată; spray scurt de ulei deasupra. Fără sare (ai pus deja) și fără usturoi granulat (se arde sub glazură)."}], "text": []}, {"titlu": "Gătit", "pasi": [{"n": 4, "text": "Spray de ulei pe grătarul încins, pulpele deasupra cu pielea în sus și cu spațiu între ele; dacă se ating, fac abur și nu se rumenesc acolo."}, {"n": 5, "text": "35 de minute: nu le atingi, nu le întorci, nu le acoperi, până pielea e aurie și întinsă."}, {"n": 6, "text": "Scoate, pensulează pielea cu sos teriyaki și pune-le înapoi 4 minute, până sosul se lipește de piele."}, {"n": 7, "text": "Mai pensulează o dată și mai lasă 4 minute, până glazura e lucioasă și maro-aurie; total ~43 de minute."}], "text": []}, {"titlu": "Verificare", "pasi": [{"n": 8, "text": "Gata când pielea e maro-auriu lucios și, la înțepat lângă os, zeama iese limpede, nu roz."}, {"n": 9, "text": "Dacă nu sunt gata: încă 8–10 minute, acoperite lejer cu folie (altfel zahărul din sos se arde); scoate folia în ultimele 3 minute."}], "text": []}, {"titlu": "Păstrare și reîncălzire", "pasi": [], "text": ["Frigider: în cutie închisă, 3–4 zile.", "Cuptor sau air fryer (cel mai bine): 180 °C, 8–10 minute, până pielea e din nou crocantă și carnea fierbinte lângă os.", "Microunde: merge, dar pielea se înmoaie; dă-le apoi 2 minute în air fryer, ca să-și revină."]}, {"titlu": "Note", "pasi": [], "text": ["Sosul se pune doar la final pentru că are zahăr: la 200 °C, 45 de minute, se face negru și amar cu mult înainte ca pulpele să fie gata.", "Fără marinadă lichidă: pulpele au piele și grăsime, iar marinada udă strică exact pielea crocantă. Nu tampona carnea grasă ca pe piept; are nevoie doar de pielea uscată din frigider.", "Sărarea din timp, cu pielea descoperită la frigider, e singurul truc care chiar contează pentru piele crocantă.", "Grăsimea e aproape integral din piele; dacă o scoți după gătit scazi mult, dar atunci nu mai are rost tot procesul cu sarea și pielea crocantă. Ori o mănânci, ori faci pulpele altfel.", "Nutriția e calculată pe carne cu piele, fără os: 450 g din ~600 g cu os. Sosul teriyaki e valoarea generică USDA; pentru exact, de pe eticheta sticlei.", "Indiciile senzoriale de la pașii 5, 6 și 7 sunt propuse de Claude, nu din experiența ta; corectează-le după prima gătire.", "Merge cu (sugestii): cartofi la cuptor în aceeași tavă de dedesubt sau pe alt raft, tot la 200 °C; orez sau piure; salată de varză, de castraveți sau murături, care taie grăsimea pielii.", "Dacă le faci împreună cu pieptul teriyaki, în aceeași seară: T−15 cuptorul la 200 °C cu tava și grătarul, apă în tavă, condimentezi pulpele; T0 pulpele pe grătar, cu pielea în sus; T25 scoți pieptul din marinadă, tamponezi, air fryer 190 °C, 8 min; T33 întorci pieptul, 3 min, și începi glazura în crăticioară; T35 pulpele: primul strat de sos, înapoi 4 min; T36 pieptul: pensulezi cu glazură, înapoi 2 min; T39 scoți pieptul, mai pensulezi, îl lași să se odihnească; pulpele: al doilea strat, 4 min; T43 scoți pulpele; orez cu legume în tigaie 8 min, cât se odihnesc."]}], "jurnal": [], "status_manual": null}, {"slug": "pulpe-pui-fara-piele-cuptor", "titlu": "Pulpe superioare de pui fără piele, la cuptor, cu glazură teriyaki", "categorie": "pranz-cina", "tags": ["pui", "cuptor", "glazura"], "sursa": "claude", "status": "test", "versiune": 1, "portii": 3, "din_timp": "sărare 30 min până la câteva ore înainte (opțional, dar ajută)", "timp_activ_min": 15, "timp_total_min": 45, "greutate_gatita_g": null, "ingrediente": [{"id": "pulpe_pui_fara_piele", "nume": "Pulpe de pui fără piele, fără os, crude", "g": 600, "nota": "fără os; dacă sunt cu os, ~800 g cântărite cu os", "grup": "", "kcal": 121.0, "proteine": 19.7, "carbo": 0.0, "grasimi": 4.12, "fibre": 0.0, "sare": 0.24, "pret_per_kg": 28.0}, {"id": "sare", "nume": "Sare de masă", "g": 3, "nota": "1/2 linguriță (o linguriță întreagă dacă nu pui sos teriyaki)", "grup": "", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 97.0, "pret_per_kg": 2.0}, {"id": "piper", "nume": "Piper negru măcinat", "g": 1, "nota": "după gust", "grup": "", "kcal": 251.0, "proteine": 10.4, "carbo": 64.0, "grasimi": 3.26, "fibre": 25.3, "sare": 0.05, "pret_per_kg": 120.0}, {"id": "boia", "nume": "Boia de ardei dulce", "g": 2.3, "nota": "1 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 60.0}, {"id": "boia_afumata", "nume": "Boia de ardei afumată", "g": 1.2, "nota": "1/2 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 80.0}, {"id": "ulei_masline", "nume": "Ulei de măsline", "g": 13, "nota": "1 lingură, frecat pe carne", "grup": "", "kcal": 884.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 100.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 50.0}, {"id": "sos_teriyaki", "nume": "Sos teriyaki din comerț", "g": 54, "nota": "3 linguri (2–4), pentru glazurat", "grup": "", "kcal": 89.0, "proteine": 5.93, "carbo": 15.6, "grasimi": 0.02, "fibre": 0.1, "sare": 9.57, "pret_per_kg": 40.0}], "nutritie": {"kcal": 300, "proteine": 41, "carbo": 4, "grasimi": 13, "fibre": 1, "sare": 3.2, "cost": 6.5}, "sectiuni": [{"titlu": "Din timp", "pasi": [{"n": 1, "text": "Cu 30 de minute până la câteva ore înainte: sărează pulpele pe ambele părți și ține-le la frigider, acoperite. Fără piele nu mai ai ce usca; sarea e doar ca să rămână carnea suculentă."}], "text": []}, {"titlu": "Cuptorul și condimentarea", "pasi": [{"n": 2, "text": "Încălzește cuptorul la 220 °C cu tava goală înăuntru, 10–15 minute, până e complet încins. Tava fierbinte rumenește partea de jos; fără piele, asta e toată crusta pe care o primești."}, {"n": 3, "text": "Tamponează pulpele cu prosop de hârtie până sunt uscate la atingere (aici da, ca la piept: nu mai e piele de protejat). Freacă-le cu uleiul, boiaua dulce, boiaua afumată și piperul. Fără sare, ai pus deja."}], "text": []}, {"titlu": "Gătit", "pasi": [{"n": 4, "text": "Pune hârtie de copt pe tava încinsă și așază pulpele desfăcute, întinse, cu spațiu între ele; dacă se ating, fac abur. Trebuie să sfârâie când ating tava."}, {"n": 5, "text": "Fără os: 10 minute, până marginile prind culoare. Cu os: 20 minute."}, {"n": 6, "text": "Întoarce-le și mai lasă 6 minute (cu os: 10 minute), până și partea a doua e rumenită."}, {"n": 7, "text": "Pensulează cu sos teriyaki și pune-le înapoi 3 minute, până sosul se lipește de carne."}, {"n": 8, "text": "Mai pensulează o dată și mai lasă 3 minute, până glazura e lucioasă și maro-aurie, cu margini ușor caramelizate; total ~22 de minute fără os, ~36 cu os."}], "text": []}, {"titlu": "Verificare", "pasi": [{"n": 9, "text": "Gata când, la tăiat în partea cea mai groasă, carnea nu mai e roz și zeama iese limpede; cu termometru, 75 °C în centru. Pulpa iartă: până la 80 °C rămâne suculentă, spre deosebire de piept."}, {"n": 10, "text": "Lasă-le 5 minute pe un tocător înainte să le tai, până nu mai curge zeamă când le apeși ușor."}], "text": []}, {"titlu": "Păstrare și reîncălzire", "pasi": [], "text": ["Frigider: în cutie închisă, 3–4 zile.", "Air fryer sau cuptor (cel mai bine): 180 °C, 5–6 minute, până sunt fierbinți la mijloc; pensulează cu puțin sos la final, glazura veche se usucă.", "Microunde: 1,5 minute, cu o lingură de apă și capac; merge bine, nu mai e piele care să se înmoaie.", "Reci, feliate, merg în salată, wrap sau peste orez."]}, {"titlu": "Note", "pasi": [], "text": ["Rețetă scrisă de Claude ca variantă a pulpelor cu piele, netestată de tine. Ce nu e sigur: timpii (depind de grosime și de cuptor; verifică la 8 minute prima dată), dacă 220 °C nu e prea mult pentru cuptorul tău (dacă fumegă sau se ard marginile, 200 °C și +3 minute pe parte) și sarea, dacă sosul tău teriyaki e mai sărat decât cel generic.", "De ce altfel decât cele cu piele: acolo tot procesul (sărare descoperită, fără ulei, 35 de minute neatinse) e pentru pielea crocantă. Fără piele, carnea se usucă la suprafață dacă stă atât, deci temperatură mai mare, timp mai scurt, puțin ulei și întoarsă o dată.", "Sosul doar la final, ca la cele cu piele: are zahăr și la 220 °C se arde în câteva minute.", "Nutriție: pulpa fără piele are cam jumătate din caloriile celei cu piele (121 față de 221 kcal/100 g), de aici porția mai mare de carne la calorii similare. Sosul teriyaki e valoarea generică USDA; pentru exact, de pe eticheta sticlei.", "Merge cu (sugestii): orez, cartofi la cuptor puși cu 15 minute înaintea pulpelor, salată de varză sau de castraveți.", "La air fryer, în loc de cuptor: 200 °C, 8 minute, întoarse, 5 minute, apoi glazura 2 + 2 minute."]}], "jurnal": [], "status_manual": null}, {"slug": "snitel-pui-branza-airfryer", "titlu": "Șnițel de pui cu brânză gratinată, la air fryer", "categorie": "pranz-cina", "tags": ["pui", "air-fryer", "pane", "meal-prep", "congelabil"], "sursa": "claude", "status": "imbunatatire", "versiune": 2, "portii": 3, "din_timp": "", "timp_activ_min": 30, "timp_total_min": 45, "greutate_gatita_g": null, "ingrediente": [{"id": "piept_pui", "nume": "Piept de pui fără piele, crud", "g": 650, "nota": "cântărit crud; 3 felii de ~1 cm", "grup": "Carnea și condimentele", "kcal": 120.0, "proteine": 22.5, "carbo": 0.0, "grasimi": 2.62, "fibre": 0.0, "sare": 0.11, "pret_per_kg": 35.0}, {"id": "sare", "nume": "Sare de masă", "g": 3, "nota": "1/2 linguriță", "grup": "Carnea și condimentele", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 97.0, "pret_per_kg": 2.0}, {"id": "piper_alb", "nume": "Piper alb măcinat", "g": 2, "nota": "3/4 linguriță", "grup": "Carnea și condimentele", "kcal": 296.0, "proteine": 10.4, "carbo": 68.6, "grasimi": 2.12, "fibre": 26.2, "sare": 0.01, "pret_per_kg": 150.0}, {"id": "boia", "nume": "Boia de ardei dulce", "g": 3.5, "nota": "1 1/2 lingurițe", "grup": "Carnea și condimentele", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 60.0}, {"id": "faina", "nume": "Făină albă de grâu", "g": 30, "nota": "", "grup": "Pane", "kcal": 364.0, "proteine": 10.3, "carbo": 76.3, "grasimi": 0.98, "fibre": 2.7, "sare": 0.01, "pret_per_kg": 4.0}, {"id": "albus_pasteurizat", "nume": "Albuș de ou pasteurizat", "g": 150, "nota": "150 ml", "grup": "Pane", "kcal": 43.0, "proteine": 9.8, "carbo": 0.9, "grasimi": 0.0, "fibre": 0.0, "sare": 0.42, "pret_per_kg": 25.0}, {"id": "pesmet_panko", "nume": "Pesmet panko", "g": 90, "nota": "", "grup": "Pane", "kcal": 335.0, "proteine": 9.9, "carbo": 71.0, "grasimi": 1.0, "fibre": 4.5, "sare": 1.5, "pret_per_kg": 20.0}, {"id": "ulei_spray_masline", "nume": "Ulei de măsline, spray", "g": 14, "nota": "15 ml, spray îna function randeazaBanda(b) {
  const r = reteta(b.slug), f = b.portii / r.portii, culoare = culoareBanda(b.slug);

  }
  const e = r.etape[ei], nev = necesare(r, e);
  // Aștepți doar după cronometrele pașilor încă nebifați; un pas bifat cu cronometrul pornit (puiul e în air fryer) nu te ține pe loc.
  const merg = st.cron.filter(c => c.slug === b.slug && c.tip === "pas" && !c.gata && !b.facute.includes(c.k)).sort((a, z) => a.sfarsit - z.sfarsit);
  let ast = "";
  if (merg.length) {
    const libere = st.sesiune.retete.filter(x => x !== b && x.pornita && etapaCurenta(reteta(x.slug), x) >= 0 && !st.cron.some(c => c.slug === x.slug && c.tip === "pas" && !c.gata && !x.facute.includes(c.k)));
    const programate = st.sesiune.retete.filter(x => !x.pornita);
    const urm = r.etape[ei + 1];
    ast = `<div class="asteptare"><p>${ic("timer")} Aștepți ${merg.map(c => `<b>${esc(c.text)}</b>`).join(" și ")}: mai sunt <b data-cron="${merg[0].id}">${ceas(ramas(merg[0]))}</b>.</p>

  return `${cap}<div class="etapa-cap"><h2>${esc(e.titlu || "Pași")}</h2><span class="mic">etapa ${ei + 1} din ${r.etape.length}</span></div>

    <button class="buton mare" type="button" data-a="etapaGata" data-slug="${esc(b.slug)}" style="margin-top:.8rem">${ic("check")} Am terminat toată etapa</button>
    ${viitoare.map(x => `<details class="pliat"><summary>Urmează: ${esc(x.titlu || "Pași")} (${x.pasi.length} ${x.pasi.length === 1 ? "pas" : "pași"})</summary><div><ol class="pasi">${x.pasi.map(p => pasHtml(b.slug, p, b.facute.includes(p.k))).join("")}</ol></div></details>`).join("")}
    ${gata.length ? `<details class="pliat"><summary>${ic("check")}&nbsp;Gata: ${gata.map(x => esc(x.titlu || "Pași")).join(", ")}</summary><div><ol class="pasi">${gata.flatMap(x => x.pasi).map(p => pasHtml(b.slug, p, b.facute.includes(p.k))).join("")}</ol></div></details>` : ""}`;

  const s = st.sesiune, cron = [...st.cron].sort((a, b) => b.gata - a.gata || a.sfarsit - b.sfarsit), n = nrCos();
  const act = [];
  if (s && vedere !== "gatit") act.push(`<button class="buton" type="button" data-a="mergi" data-v="gatit">${ic("oala")} ${s.pornita ? "Gătesc" : "Masa"}: ${s.retete.length} ${s.retete.length === 1 ? "rețetă" : "rețete"}</button>`);
  if (n && vedere !== "cos") act.push(`<button class="buton" type="button" data-a="mergi" data-v="cos">${ic("cos")} Cumpărături (${n})</button>`);
  $("dock-cron").innerHTML = cron.map(c => { const a = c.gata && apoi(c); return `<div class="cron${c.gata ? " gata" : ""}" style="--b:${c.tip === "liber" ? "currentColor" : culoareBanda(c.slug)}">
    <button class="cron-du" type="button" data-a="cronDu" data-id="${c.id}" aria-label="${esc(eticheta(c))}"><b${c.gata ? "" : ` data-cron="${c.id}"`}>${c.gata ? "Gata!" : ceas(ramas(c))}</b><small>${esc(eticheta(c))}</small></button>
    <button class="cron-x" type="button" data-a="cronX" data-id="${c.id}" aria-label="${c.gata ? "Închide" : "Oprește"} cronometrul">${ic("x")}</button>
    ${a ? `<button class="cron-apoi" type="button" data-a="cronApoi" data-id="${c.id}">${ic("play", 1)} ${esc(a.text)}</button>` : ""}
    <i class="progres" data-cron-p="${c.id}" style="--p:${c.gata ? 100 : Math.min(100, 100 - ramas(c) / VITEZA / c.ms * 100)}%"></i></div>`; }).join("");
  $("dock-cron").hidden = !cron.length;
  $("dock-act").innerHTML = act.join("");
  $("dock-act").hidden = !act.length;
  $("dock").hidden = !cron.length && !act.length;
  requestAnimationFrame(() => document.body.style.setProperty("--dock", $("dock").hidden ? "0px" : $("dock").offsetHeight + "px"));
}

function deschideFoaie(id) { inchideFoi(); $(id).hidden = false; $(id).querySelector("button, input")?.focus(); }

// ---------- jurnal și poze din telefon ----------
function adaugaInYaml(text, intrare) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);
  if (!m) throw new Error("fișierul nu are frontmatter");
  const nl = text.includes("\r\n") ? "\r\n" : "\n", linii = m[1].split(/\r?\n/);
  const i = linii.findIndex(l => /^jurnal:\s*(\[\]\s*)?$/.test(l));
  if (i < 0) throw new Error("cheia jurnal lipsește din frontmatter");
  linii[i] = "jurnal:";
  let j = i + 1;
  while (j < linii.length && (linii[j] === "" || /^\s/.test(linii[j]))) j++;
  while (j > i + 1 && linii[j - 1] === "") j--;
  const bloc = [`  - data: ${intrare.data}`, `    versiune: ${intrare.versiune}`, `    gust: ${intrare.gust}`, `    efort: ${intrare.efort}`, `    executie: ${intrare.executie}`];
  if (intrare.observatii) bloc.push(`    observatii: ${JSON.stringify(intrare.observatii)}`);
  if (intrare.urmatoarea_data) bloc.push(`    urmatoarea_data: ${JSON.stringify(intrare.urmatoarea_data)}`);
  linii.splice(j, 0, ...bloc);
  return "---" + nl + linii.join(nl) + nl + "---" + nl + text.slice(m[0].length);
}
async function trimiteJurnal() {
  const r = reteta(curentaSlug);
  if (!formular.gust || !formular.efort) return arataStare("f-stare", "Alege întâi gustul și efortul.", "eroare");
  const intrare = {data: $("f-data").value || azi(), versiune: r.versiune, gust: formular.gust, efort: formular.efort, executie: formular.executie,
                   observatii: $("f-observatii").value.trim(), urmatoarea_data: $("f-urmatoarea").value.trim()};
  arataStare("f-stare", "Se scrie în repo…");
  try {
    const cale = `retete/${r.slug}.md`, fisier = await github(cale);
    if (!fisier) throw new Error("fișierul rețetei nu e în repo");
    await github(cale, "PUT", {message: `${r.slug} v${r.versiune}: gust ${intrare.gust} efort ${intrare.efort}`, content: b64text(adaugaInYaml(text64(fisier.content), intrare)), sha: fisier.sha});
    r.jurnal.push(intrare); r.status = stareDupa(r, r.jurnal);
    Object.assign(formular, {gust: null, efort: null, executie: "ok"});
    randeazaReteta();
    arataStare("f-stare", `Scris. Rețeta e acum: ${STARI[r.status]}. Pe celelalte telefoane apare în 2–3 minute.`, "ok");
    $("s-jurnal").scrollIntoView({behavior: "smooth"});
  } catch (e) { arataStare("f-stare", "Nu s-a putut scrie: " + e.message, "eroare"); }
}
async function micsoreaza(fisier, max = 1200) {
  let img;
  try { img = await createImageBitmap(fisier, {imageOrientation: "from-image"}); }
  catch (e) { img = await new Promise((ok, nu) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nu; i.src = URL.createObjectURL(fisier); }); }
  const f = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}
async function urcaPoza(fisier) {
  const r = reteta(curentaSlug);
  try {
    arataStare("poza-stare", "Se micșorează poza…");
    const dataUrl = await micsoreaza(fisier);
    $("poza").innerHTML = `<img src="${dataUrl}" alt="${esc(r.titlu)}">`; $("poza").hidden = false;
    arataStare("poza-stare", "Se trimite în repo…");
    const cale = `retete/poze/${r.slug}.jpg`, existent = await github(cale);
    await github(cale, "PUT", {message: `poza ${r.slug}`, content: dataUrl.split(",")[1], ...(existent ? {sha: existent.sha} : {})});
    arataStare("poza-stare", "Poza e în repo; pe celelalte telefoane apare în 1–2 minute.", "ok");
  } catch (e) { arataStare("poza-stare", "Nu s-a putut trimite: " + e.message, "eroare"); }
}

// ---------- acțiuni: fiecare buton are data-a="nume" ----------
const ACTIUNI = {
  deschide: el => arata("reteta", {slug: el.dataset.slug, sus: true}),
  mergi: el => arata(el.dataset.v, {sus: el.dataset.v !== "lista"}),
  inapoi,
  stare: el => { const s = el.dataset.stare; if (filtru.stari.has(s) && filtru.stari.size > 1) filtru.stari.delete(s); else filtru.stari.add(s); randeazaLista(); },
  arataToate: () => { filtru.stari = new Set(["carte", "imbunatatire", "test"]); $("cautare").value = ""; filtru.cat = filtru.tag = ""; randeazaFiltre(); randeazaLista(); },
  filtre: el => { const f = $("filtre"); f.hidden = !f.hidden; el.setAttribute("aria-expanded", !f.hidden); },
  filtru: el => { filtru[el.dataset.cheie] = el.dataset.val; randeazaFiltre(); randeazaLista(); },
  laMasa: el => { if (banda(el.dataset.slug)) scoateDeLaMasa(el.dataset.slug); else adaugaLaMasa(el.dataset.slug); randeaza(); },
  token: async () => { await cereToken(mem.get("github_token", "") ? "Ai deja un token salvat; lipește altul ca să-l înlocuiești, sau renunță." : ""); randeazaLista(); },
  sari: el => $(el.dataset.tinta)?.scrollIntoView({behavior: "smooth", block: "start"}),
  marime: () => { st.marime = (st.marime + 1) % 3; document.body.dataset.marime = st.marime; salveaza(); },
  portiiD: el => { portiiD[curentaSlug] = Math.max(1, portiiD[curentaSlug] + +el.dataset.d); randeazaReteta(); },
  gateste: el => { const s = el.dataset.slug; if (!banda(s)) adaugaLaMasa(s, portiiD[s]); if (st.sesiune.pornita) st.sesiune.activa = s; salveaza(); arata("gatit", {sus: true}); },
  alege: deschideAlegere,
  alegeToate: () => { const r = reteta(curentaSlug), toate = alegere.size < new Set(r.ingrediente.map(i => i.id)).size; alegere = new Set(toate ? r.ingrediente.map(i => i.id) : []); for (const i of $("alege-lista").querySelectorAll("input")) i.checked = toate; },
  alegeOk: () => { const r = reteta(curentaSlug), ids = r.ingrediente.map(i => i.id).filter((id, k, a) => alegere.has(id) && a.indexOf(id) === k);
    if (ids.length) st.cos[r.slug] = {portii: portiiD[r.slug], ids}; else delete st.cos[r.slug];
    salveaza(); inchideFoi(); randeaza(); anunta(ids.length ? `${ids.length} ingrediente în lista de cumpărături` : "Rețeta a ieșit din lista de cumpărături"); },
  poza: () => { $("poza-fisier").value = ""; $("poza-fisier").click(); },
  form: el => { formular[el.dataset.cheie] = el.dataset.cheie === "executie" ? el.dataset.val : +el.dataset.val;
    const obs = $("f-observatii").value, urm = $("f-urmatoarea").value, data = $("f-data").value;
    randeazaReteta(); $("f-observatii").value = obs; $("f-urmatoarea").value = urm; $("f-data").value = data; $("f-jurnal").querySelector(`[data-cheie="${el.dataset.cheie}"][data-val="${el.dataset.val}"]`)?.focus({preventScroll: true}); },
  pas: el => bifeaza(el.dataset.slug, +el.dataset.k),
  timp: el => { const r = reteta(el.dataset.slug), p = r.pasi[+el.dataset.k], i = +el.dataset.i, c = cronPas(r.slug, p.k, i);
    if (c) opresteCron(c.id); else pornesteCron({slug: r.slug, k: p.k, i, text: p.timpi[i].text, s: p.timpi[i].s, tip: "pas"}); },
  foaieTimer: () => { $("presetari").innerHTML = [1, 2, 3, 5, 8, 10, 12, 15, 20, 30, 45].map(m => `<button class="chip" type="button" data-a="timerLiber" data-min="${m}">${m} min</button>`).join(""); $("timer-minute").value = ""; deschideFoaie("foaie-timer"); },
  timerLiber: el => { const m = Math.round(+(el.dataset.min || $("timer-minute").value)); if (m > 0) { pornesteCron({slug: st.sesiune?.activa || curentaSlug || "", k: -1, i: -1, text: `${m} min`, s: m * 60, tip: "liber"}); inchideFoi(); } },
  inchideFoi,
  cronX: el => opresteCron(+el.dataset.id),
  cronDu: el => { const c = st.cron.find(x => x.id === +el.dataset.id); if (!c) return;
    if (c.tip === "liber") { if (c.gata) opresteCron(c.id); return; }
    if (c.tip === "start") { if (c.gata) { opresteCron(c.id); pornesteBanda(c.slug); } else mergiLaPas(c.slug, -1); return; }
    mergiLaPas(c.slug, c.k); },
  cronApoi: el => { const c = st.cron.find(x => x.id === +el.dataset.id), a = c && apoi(c); if (!a) return; opresteCron(c.id); a.fa(); },
  banda: el => { st.sesiune.activa = el.dataset.slug; salveaza(); randeazaGatit(); window.scrollTo(0, 0); },
  pasDin: el => mergiLaPas(el.dataset.slug, +el.dataset.k),
  pornesteBanda: el => pornesteBanda(el.dataset.slug),
  scoateBanda: el => { scoateDeLaMasa(el.dataset.slug); randeaza(); },
  portiiBanda: el => { const b = banda(el.dataset.slug); b.portii = Math.max(1, b.portii + +el.dataset.d); salveaza(); randeazaGatit(); },
  incepe: incepeMasa,
  etapaGata: el => { const b = banda(el.dataset.slug), r = reteta(b.slug), ei = etapaCurenta(r, b); if (ei < 0) return;
    for (const p of r.etape[ei].pasi) if (!b.facute.includes(p.k)) b.facute.push(p.k);
    curataCron(); salveaza(); anunta(`Etapa „${r.etape[ei].titlu}” e gata`); randeaza(); window.scrollTo(0, 0); },
  laJurnal: el => arata("reteta", {slug: el.dataset.slug, ancora: "s-jurnal"}),
  inchideMasa: () => inchideMasa(st.sesiune && st.sesiune.retete.some(b => b.pornita && etapaCurenta(reteta(b.slug), b) >= 0)),
  golesteCos: () => { if (!nrCos() || !confirm("Golești toată lista de cumpărături?")) return; st.cos = {}; st.extra = []; st.cumparate = new Set(); salveaza(); randeaza(); },
  scoateDinCos: el => { delete st.cos[el.dataset.slug]; salveaza(); randeaza(); },
  stergeExtra: el => { st.extra = st.extra.filter(x => x.id !== el.dataset.id); st.cumparate.delete(el.dataset.id); salveaza(); randeaza(); },
  curataCumparate: () => { st.extra = st.extra.filter(x => !st.cumparate.has(x.id));
    for (const s in st.cos) if (st.cos[s].ids) { st.cos[s].ids = st.cos[s].ids.filter(id => !st.cumparate.has(id)); if (!st.cos[s].ids.length) delete st.cos[s]; }
    st.cumparate = new Set(); salveaza(); randeaza(); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el || !ACTIUNI[el.dataset.a]) return;
  if (el.tagName === "A") e.preventDefault();
  ACTIUNI[el.dataset.a](el, e);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("li.pas")) { e.preventDefault(); bifeaza(e.target.dataset.slug, +e.target.dataset.k); } });
document.addEventListener("change", e => {
  const el = e.target, c = el.dataset.c;
  if (c === "ingr") { const l = bifeIngr[curentaSlug] ||= [], k = +el.dataset.k; el.checked ? l.push(k) : l.splice(l.indexOf(k), 1); el.closest(".ingr").classList.toggle("luat", el.checked); }
  else if (c === "alege") { el.checked ? alegere.add(el.dataset.id) : alegere.delete(el.dataset.id); }
  else if (c === "cumparat") { el.checked ? st.cumparate.add(el.dataset.id) : st.cumparate.delete(el.dataset.id); salveaza(); el.closest(".ingr").classList.toggle("luat", el.checked); setTimeout(randeazaCos, 300); }
  else if (c === "scoase") { const l = st.sesiune.scoase[el.dataset.slug] ||= [], k = +el.dataset.k; el.checked ? l.push(k) : l.splice(l.indexOf(k), 1); salveaza(); el.closest(".ingr").classList.toggle("luat", el.checked); }
  else if (c === "dinTimp") { st.sesiune.dinTimp[el.dataset.slug] = el.checked; salveaza(); const y = scrollY; randeazaGatit(); window.scrollTo(0, y); }
  else if (c === "deodata") { st.sesiune.deodata = el.checked; salveaza(); randeazaGatit(); }
  else if (el.id === "poza-fisier" && el.files[0]) urcaPoza(el.files[0]);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "f-jurnal") trimiteJurnal();
  if (e.target.id === "f-extra") { const n = $("extra-nume").value.trim(); if (!n) return; st.extra.push({id: "x_" + Date.now().toString(36), nume: n}); salveaza(); randeaza(); $("extra-nume").focus(); }
});
$("cautare").addEventListener("input", randeazaLista);

// ---------- pornire ----------
// Iconițele din HTML-ul static sunt scrise ca text (TIMER, INAPOI, …) și înlocuite aici cu SVG, ca să nu le repet de mână.
for (const el of document.querySelectorAll(".ic-btn, #btn-filtre")) el.innerHTML = el.innerHTML.replace(/\b(TIMER|INAPOI|TEXT|FILTRE)\b/g, m => ic({TIMER: "timer", INAPOI: "inapoi", TEXT: "text", FILTRE: "filtre"}[m]));
document.body.dataset.marime = st.marime;
randeazaFiltre();
st.cron.forEach(programeaza);
const start = dinAdresa();
arata(start.v, {slug: start.slug, push: false});
bate(true);
