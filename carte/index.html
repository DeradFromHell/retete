<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cartea de rețete</title>
<style>
:root{--fundal:#f6f3ec;--hartie:#fff;--text:#24211c;--mut:#736c60;--accent:#a8432a;--linie:#e4ded2;--activ:#fbe9dc}
@media (prefers-color-scheme: dark){:root{--fundal:#1b1917;--hartie:#272320;--text:#ebe6dd;--mut:#a69e91;--accent:#e58a6a;--linie:#3b3631;--activ:#43302a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundal);color:var(--text)}
header{position:sticky;top:0;z-index:2;background:var(--hartie);border-bottom:1px solid var(--linie);padding:.6rem .8rem}
header>div,main,article{max-width:720px;margin:0 auto}
h1{margin:0 0 .5rem;font-size:1.25rem}
input[type=search],select{width:100%;font:inherit;font-size:1rem;padding:.5rem .6rem;border:1px solid var(--linie);border-radius:8px;background:var(--hartie);color:inherit}
.filtre{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.4rem}
.comutatoare{display:flex;gap:1rem;margin-top:.5rem;font-size:.9rem;color:var(--mut)}
.comutatoare label{display:flex;align-items:center;gap:.3rem}
main{padding:.8rem}
.card{display:block;background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.8rem .9rem;margin-bottom:.6rem;text-decoration:none;color:inherit}
.card h2{margin:0 0 .3rem;font-size:1.1rem}
.meta{font-size:.9rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.2rem .8rem;margin:0}
.status{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.gol{color:var(--mut);text-align:center;padding:2rem 0}
#detaliu{position:fixed;inset:0;background:var(--fundal);overflow-y:auto;z-index:3;-webkit-overflow-scrolling:touch}
.bara{position:sticky;top:0;z-index:1;background:var(--hartie);border-bottom:1px solid var(--linie);padding:.5rem .6rem;display:flex;align-items:center;gap:.4rem}
.bara button{font:inherit;font-size:1rem;background:none;border:0;color:var(--accent);padding:.4rem .5rem;cursor:pointer}
.bara span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#cronometru{flex:none;font-variant-numeric:tabular-nums;font-weight:600;background:var(--activ);border-radius:8px;padding:.3rem .6rem;cursor:pointer}
#cronometru.gata{background:var(--accent);color:#fff}
article{padding:.8rem .8rem 3rem}
article h2{margin:.2rem 0 .4rem;font-size:1.4rem}
article p{margin:.4rem 0}
article p.p{padding-left:1.1rem;text-indent:-1.1rem}
article p.p::before{content:"• ";color:var(--accent)}
h3{font-size:.8rem;margin:1.4rem 0 .5rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.portii{display:flex;align-items:center;gap:.5rem;margin:.3rem 0 .6rem}
.portii button{font:inherit;font-size:1.2rem;width:2.4rem;height:2.4rem;border:1px solid var(--linie);border-radius:50%;background:var(--hartie);color:inherit;cursor:pointer}
.portii input{width:3.6rem;text-align:center;font:inherit;padding:.4rem;border:1px solid var(--linie);border-radius:8px;background:var(--hartie);color:inherit}
.ingrediente{list-style:none;margin:0;padding:0;background:var(--hartie);border:1px solid var(--linie);border-radius:12px;overflow:hidden}
.ingrediente li{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border-bottom:1px solid var(--linie)}
.ingrediente li:last-child{border-bottom:0}
.ingrediente li.grup{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--fundal);padding:.4rem .8rem}
.ingrediente input{width:1.2rem;height:1.2rem;margin:0;flex:none}
.ingrediente .nume{flex:1}
.ingrediente .nota{color:var(--mut);font-size:.85rem}
.ingrediente .g{white-space:nowrap;font-variant-numeric:tabular-nums}
.bifat .nume{text-decoration:line-through;color:var(--mut)}
ol{padding-left:1.7rem;margin:0}
ol li{margin-bottom:.7rem;padding:.25rem .4rem;border-radius:8px;cursor:pointer}
ol li::marker{font-weight:700;color:var(--accent)}
ol li.facut{color:var(--mut);text-decoration:line-through}
button.timp{font:inherit;font-size:.95em;background:var(--activ);border:1px solid var(--linie);border-radius:6px;padding:0 .4rem;color:inherit;cursor:pointer;white-space:nowrap}
button.timp.activ{border-color:var(--accent);color:var(--accent);font-weight:600}
.nutritie{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;text-align:center;font-size:.8rem;color:var(--mut);background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.6rem .2rem}
.nutritie b{display:block;font-size:1rem;color:var(--text)}
.jurnal{background:var(--hartie);border:1px solid var(--linie);border-radius:12px;padding:.6rem .8rem}
.jurnal p{margin:.25rem 0}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div>
  <h1>Cartea de rețete</h1>
  <input id="cautare" type="search" placeholder="Caută după titlu sau ingredient" autocomplete="off">
  <div class="filtre">
    <select id="categorie" aria-label="Categorie"><option value="">Categorie</option></select>
    <select id="tag" aria-label="Tag"><option value="">Tag</option></select>
    <select id="sortare" aria-label="Sortare">
      <option value="gust">Gust ↓</option>
      <option value="efort">Efort ↑</option>
      <option value="timp">Timp total ↑</option>
    </select>
  </div>
  <div class="comutatoare">
    <label><input type="checkbox" id="arata-imbunatatire"> de îmbunătățit</label>
    <label><input type="checkbox" id="arata-test"> în test</label>
  </div>
</div></header>
<main id="lista"></main>
<section id="detaliu" hidden>
  <div class="bara"><button id="inapoi" type="button">‹ Înapoi</button><span id="detaliu-titlu"></span><span id="cronometru" hidden title="atinge ca să oprești"></span></div>
  <article id="detaliu-continut"></article>
</section>

": 10.4, "carbo": 64.0, "grasimi": 3.26, "fibre": 25.3, "pret_per_kg": 120.0}, {"id": "sos_soia", "nume": "Sos de soia", "g": 48, "nota": "3 linguri", "grup": "Glazura", "kcal": 53.0, "proteine": 8.14, "carbo": 4.93, "grasimi": 0.57, "fibre": 0.8, "pret_per_kg": 30.0}, {"id": "miere", "nume": "Miere", "g": 21, "nota": "1 lingură", "grup": "Glazura", "kcal": 304.0, "proteine": 0.3, "carbo": 82.4, "grasimi": 0.0, "fibre": 0.2, "pret_per_kg": 40.0}, {"id": "otet_mere", "nume": "Oțet de mere", "g": 15, "nota": "1 lingură", "grup": "Glazura", "kcal": 21.0, "proteine": 0.0, "carbo": 0.93, "grasimi": 0.0, "fibre": 0.0, "pret_per_kg": 8.0}, {"id": "ghimbir", "nume": "Ghimbir proaspăt", "g": 4, "nota": "1 linguriță, ras", "grup": "Glazura", "kcal": 80.0, "proteine": 1.82, "carbo": 17.8, "grasimi": 0.75, "fibre": 2.0, "pret_per_kg": 25.0}, {"id": "usturoi", "nume": "Usturoi, crud", "g": 4, "nota": "1 cățel, ras", "grup": "Glazura", "kcal": 149.0, "proteine": 6.36, "carbo": 33.1, "grasimi": 0.5, "fibre": 2.1, "pret_per_kg": 25.0}, {"id": "amidon_porumb", "nume": "Amidon de porumb", "g": 3, "nota": "1 linguriță", "grup": "Glazura", "kcal": 381.0, "proteine": 0.26, "carbo": 91.3, "grasimi": 0.05, "fibre": 0.9, "pret_per_kg": 12.0}, {"id": "apa", "nume": "Apă", "g": 30, "nota": "2 linguri apă rece, pentru amidon", "grup": "Glazura", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "pret_per_kg": 0.0}, {"id": "ulei_floarea_soarelui", "nume": "Ulei de floarea-soarelui", "g": 2, "nota": "spray scurt pe grătar", "grup": "La gătit și la servit", "kcal": 884.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 100.0, "fibre": 0.0, "pret_per_kg": 10.0}, {"id": "seminte_susan", "nume": "Semințe de susan", "g": 3, "nota": "1 linguriță, prăjite (estimare, după gust)", "grup": "La gătit și la servit", "kcal": 573.0, "proteine": 17.7, "carbo": 23.4, "grasimi": 49.7, "fibre": 11.8, "pret_per_kg": 30.0}, {"id": "ceapa_verde", "nume": "Ceapă verde", "g": 30, "nota": "2 fire, tăiate (estimare, după gust)", "grup": "La gătit și la servit", "kcal": 32.0, "proteine": 1.83, "carbo": 7.34, "grasimi": 0.19, "fibre": 2.6, "pret_per_kg": 20.0}], "nutritie": {"kcal": 460, "proteine": 61, "carbo": 27, "grasimi": 11, "fibre": 1, "cost": 12}, "pasi_html": "<h3>Cu 4–6 ore înainte<\/h3><ol><li value=\"1\">Dacă pieptul e gros, bate-l ușor sau crestează-l, ca să aibă grosime uniformă; contează mai mult decât timpul de marinare.<\/li><li value=\"2\">Amestecă într-un bol ingredientele marinadei: sos de soia, miere, oțet, ghimbir, usturoi, ulei de susan, piper.<\/li><li value=\"3\">Pune carnea într-o pungă, toarnă marinada, întoarce punga de câteva ori, scoate aerul și închide. La frigider minimum 2 ore, ideal 4–6, maximum 8; peste, soia sărează prea tare și carnea devine cauciucată.<\/li><\/ol><h3>La gătit<\/h3><ol><li value=\"4\">Preîncălzește air fryer-ul la 190 °C, 3–4 minute gol, până simți aer fierbinte când tragi sertarul.<\/li><li value=\"5\">Scoate carnea din marinadă și tamponeaz-o bine cu prosop de hârtie; marinada se aruncă. Suprafață uscată înseamnă rumenire, suprafață udă înseamnă abur.<\/li><li value=\"6\">Spray scurt de ulei pe grătarul încins și carnea deasupra: 8 minute, până prinde culoare pe fața de sus.<\/li><li value=\"7\">Întoarce și mai lasă 3 minute, până e rumenită pe margini.<\/li><\/ol><h3>Glazura, în paralel<\/h3><ol><li value=\"8\">Din minutul 8 (când întorci pieptul): într-o crăticioară mică pune sos de soia, miere, oțet, ghimbir și usturoi (fără amidon), la foc mediu, amestecând, până dă în clocot; lasă să clocotească 2 minute.<\/li><li value=\"9\">Separat, într-o ceșcuță, amestecă amidonul cu cele 2 linguri de apă rece până e complet omogen, fără cocoloașe.<\/li><li value=\"10\">Toarnă amidonul în crăticioara care clocotește, amestecând continuu: în 30–60 de secunde se îngroașă și îmbracă lingura.<\/li><li value=\"11\">Dacă rămâne apoasă, nu a clocotit destul: trebuie bule vizibile, nu doar abur. Mai adaugă o linguriță de amidon dizolvat în apă rece și adu din nou la clocot puternic; alternativ, fierbe 3–4 minute fără capac, până se reduce și se îngroașă singură.<\/li><li value=\"12\">Ia glazura de pe foc; se mai îngroașă pe măsură ce se răcește.<\/li><\/ol><h3>Finalizare<\/h3><ol><li value=\"13\">La minutul 11, scoate pieptul, pensulează-l cu glazură și pune-l înapoi 2 minute, până glazura devine lucioasă și se lipește de carne; total în air fryer ~13 minute.<\/li><li value=\"14\">Scoate, mai pensulează o dată deasupra și lasă-l să se odihnească 5 minute înainte să-l tai.<\/li><li value=\"15\">Presară semințele de susan prăjite și ceapa verde tăiată.<\/li><\/ol><h3>Note<\/h3><p class=\"p\">Semințele de susan crude sunt aproape fără gust: prăjește-le înainte, în tigaie uscată, fără ulei, la foc mediu, 2–3 minute, amestecând des, până devin aurii și miros a prăjit. Se ard în câteva secunde, stai lângă ele. Poți prăji toată punga odată; țin săptămâni într-un borcan.<\/p><p class=\"p\">Marinada nu pătrunde mai mult de 2–3 mm în carne, oricât ai lăsa-o; aroma reală vine din glazura aplicată la final.<\/p><p class=\"p\">Nu refolosi marinada în care a stat carne crudă; fă porție separată pentru glazură.<\/p><p class=\"p\">Amidonul se dizolvă întotdeauna în apă rece, separat, înainte să ajungă în lichid fierbinte; altfel face cocoloașe.<\/p><p class=\"p\">Tamponează carnea slabă (piept) înainte de air fryer: umezeala face abur, iar aburul înseamnă fără crustă.<\/p><p class=\"p\">Acidul (lămâie, oțet) în cantitate mare, pe termen lung, strică textura pieptului; în glazură, la final, e în regulă.<\/p><p class=\"p\">Dacă le faci împreună cu pulpele la cuptor, cronologia serii e în rețeta „pulpe-pui-cuptor”.<\/p><p class=\"p\">Merge cu (sugestii): orez simplu fiert, care absoarbe glazura; orez cu legume în tigaie, cum faci deja; broccoli sau fasole verde sotată; salată de castraveți cu oțet de mere și puțin susan.<\/p><p class=\"p\">Păstrare și reîncălzire (sugestii): la frigider, în cutie închisă, 3–4 zile; glazura rămasă, separat, până la o săptămână. Reîncălzește bucata întreagă (feliată se usucă) în air fryer la 160 °C, 3–4 minute, până e fierbinte la mijloc, sau la microunde 1–1,5 minute cu o lingură de apă și capac. Rece, feliat subțire, merge în salată sau sandvici.<\/p><p class=\"p\">Nutriție (observația lui Claude): marinada se aruncă, dar e numărată integral, ≈80 kcal/porție (mai ales mierea și uleiul de susan); fără ea, porția ar avea ≈380 kcal, nu 460. Sosul de soia e valoarea generică USDA; pentru exact, de pe eticheta sticlei. Susanul și ceapa verde de la servit sunt cantități estimate.<\/p><p class=\"p\">Indiciile senzoriale de la pașii 6, 7, 10 și 13 sunt propuse de Claude, nu din experiența ta; corectează-le după prima gătire.<\/p>", "ultima": null}, {"slug": "pulpe-pui-cuptor", "titlu": "Pulpe superioare de pui la cuptor, cu piele crocantă", "categorie": "pranz-cina", "tags": ["pui", "cuptor"], "sursa": "propriu", "status": "test", "versiune": 1, "portii": 3, "din_timp": "sărare 40 min până la câteva ore înainte", "timp_activ_min": 15, "timp_total_min": 65, "greutate_gatita_g": null, "gust": null, "efort": null, "ingrediente": [{"id": "pulpe_pui", "nume": "Pulpe de pui cu piele, fără os, crude", "g": 450, "nota": "4 pulpe superioare cu os și piele, ~600 g cântărite cu os", "grup": "", "kcal": 221.0, "proteine": 16.5, "carbo": 0.25, "grasimi": 16.6, "fibre": 0.0, "pret_per_kg": 25.0}, {"id": "sare", "nume": "Sare de masă", "g": 3, "nota": "1/2 linguriță (o linguriță întreagă dacă nu pui sos teriyaki)", "grup": "", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "pret_per_kg": 2.0}, {"id": "piper", "nume": "Piper negru măcinat", "g": 1, "nota": "după gust", "grup": "", "kcal": 251.0, "proteine": 10.4, "carbo": 64.0, "grasimi": 3.26, "fibre": 25.3, "pret_per_kg": 120.0}, {"id": "boia", "nume": "Boia de ardei dulce", "g": 2.3, "nota": "1 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "pret_per_kg": 60.0}, {"id": "boia_afumata", "nume": "Boia de ardei afumată", "g": 1.2, "nota": "1/2 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "pret_per_kg": 80.0}, {"id": "ulei_floarea_soarelui", "nume": "Ulei de floarea-soarelui", "g": 4, "nota": "2 spray-uri scurte, pe pulpe și pe grătar", "grup": "", "kcal": 884.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 100.0, "fibre": 0.0, "pret_per_kg": 10.0}, {"id": "sos_teriyaki", "nume": "Sos teriyaki (din comerț)", "g": 54, "nota": "3 linguri (2–4), pentru glazurat", "grup": "", "kcal": 89.0, "proteine": 5.93, "carbo": 15.6, "grasimi": 0.02, "fibre": 0.1, "pret_per_kg": 40.0}], "nutritie": {"kcal": 360, "proteine": 26, "carbo": 4, "grasimi": 26, "fibre": 1, "cost": 4.5}, "pasi_html": "<h3>Din timp<\/h3><ol><li value=\"1\">Cu 40 de minute până la câteva ore înainte: sărează pulpele peste tot, inclusiv sub piele dacă poți strecura degetul, și lasă-le pe o farfurie, cu pielea în sus, descoperite, la frigider. Sarea trage umezeala din piele; piele uscată înseamnă piele crocantă. Fără pasul ăsta iese moale și palidă, indiferent ce faci după.<\/li><\/ol><h3>Cuptorul și condimentarea<\/h3><ol><li value=\"2\">Pune tava cu grătarul de sârmă în cuptor și încălzește la 200 °C, 10–15 minute, până e complet încins. Toarnă apă cât un deget în tavă, sub grătar: grăsimea care picură pe tavă goală fumegă, cu apă nu.<\/li><li value=\"3\">Șterge umezeala vizibilă de pe piele (fără să tamponezi insistent, ca la piept) și freacă pielea cu piper, boia dulce și boia afumată; spray scurt de ulei deasupra. Fără sare (ai pus deja) și fără usturoi granulat (se arde sub glazură).<\/li><\/ol><h3>Gătit<\/h3><ol><li value=\"4\">Spray de ulei pe grătarul încins, pulpele deasupra cu pielea în sus și cu spațiu între ele; dacă se ating, fac abur și nu se rumenesc acolo.<\/li><li value=\"5\">35 de minute: nu le atingi, nu le întorci, nu le acoperi, până pielea e aurie și î const CATEGORII = {"mic-dejun": "Mic dejun", "pranz-cina": "Prânz / cină", "garnitura": "Garnitură", "desert": "Desert", "sos": "Sos"};
const STATUSURI = {carte: "În carte", imbunatatire: "De îmbunătățit", test: "În test"};
const $ = id => document.getElementById(id);
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const rot = (x, pas = 1) => Math.floor(x / pas + 0.5) * pas;  // aceleași operații ca rotunjeste() din build.py
const lei = c => c == null ? "—" : "≈" + String(c).replace(".", ",") + " lei";
const durata = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + m % 60 + " min" : ""}` : `${m} min`;
const sursa = s => /^https?:\/\//.test(s)
  ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.split("/")[2] || s)}</a>` : esc(s);
// Orice „8 minute” / „3–4 minute” / „30–60 de secunde” dintr-un pas devine buton de cronometru (prima cifră).
const RE_TIMP = /(\d+)(?:[–-]\d+)?\s*(?:de\s+)?(minute|minut|secunde|secundă)\b/g;
const cuCronometre = html => html.replace(RE_TIMP, (m, n, u) =>
  `<button type="button" class="timp" data-s="${+n * (u.startsWith("sec") ? 1 : 60)}">⏱ ${m}</button>`);

// Nutriția per porție și per 100 g, recalculată din valorile per 100 g, exact în ordinea și cu rotunjirile din build.py.
// Se calculează din gramajele originale: per porție nu depinde de numărul de porții (scalarea e proporțională).
function nutritie(r) {
  const t = {kcal: 0, proteine: 0, carbo: 0, grasimi: 0, fibre: 0}, suta = {};
  let cost = 0, complet = true, crud = 0;
  for (const i of r.ingrediente) {
    crud += i.g;
    for (const n in t) t[n] += i.g * i[n] / 100;
    if (i.pret_per_kg == null) complet = false; else cost += i.g / 1000 * i.pret_per_kg;
  }
  // per 100 g: pe greutatea gătită dacă e completată în rețetă, altfel pe suma ingredientelor crude
  const baza = r.greutate_gatita_g || crud;
  for (const n in t) {
    suta[n] = rot(t[n] / baza * 100, n === "kcal" ? 10 : 1);
    t[n] = rot(t[n] / r.portii, n === "kcal" ? 10 : 1);
  }
  t.cost = complet ? rot(cost / r.portii, 0.5) : null;
  return {...t, suta, pe_gatit: !!r.greutate_gatita_g};
}

function filtrate() {
  const q = norm($("cautare").value.trim()), cat = $("categorie").value, tag = $("tag").value;
  const stari = new Set(["carte"]);
  if ($("arata-imbunatatire").checked) stari.add("imbunatatire");
  if ($("arata-test").checked) stari.add("test");
  const cheie = {gust: r => -(r.gust ?? -1), efort: r => r.efort ?? 99, timp: r => r.timp_total_min}[$("sortare").value];
  return RETETE.filter(r => stari.has(r.status)
      && (!cat || r.categorie === cat) && (!tag || r.tags.includes(tag))
      && (!q || norm(r.titlu).includes(q) || r.ingrediente.some(i => norm(i.nume).includes(q))))
    .sort((a, b) => cheie(a) - cheie(b) || String(a.titlu).localeCompare(String(b.titlu), "ro"));
}

function arataLista() {
  const lista = filtrate();
  $("lista").innerHTML = lista.length ? lista.map(r => `<a class="card" href="#${esc(r.slug)}" data-slug="${esc(r.slug)}">
    <div class="status">${STATUSURI[r.status] ?? esc(r.status)}</div><h2>${esc(r.titlu)}</h2>
    <p class="meta"><span>gust ${r.gust ?? "—"}</span><span>efort ${r.efort ?? "—"}</span><span>${durata(r.timp_total_min)}</span>
    <span>≈${r.nutritie.kcal} kcal/porție</span><span>${lei(r.nutritie.cost)}/porție</span>
    ${r.din_timp ? `<span>din timp: ${esc(r.din_timp)}</span>` : ""}</p></a>`).join("")
    : `<p class="gol">${RETETE.length ? "Nicio rețetă pentru filtrele alese." : "Cartea e goală deocamdată."}</p>`;
}

let curenta = null, portii = 0, bifate = new Set(), facute = new Set();

function deseneazaDetaliu() {
  const r = curenta, f = portii / r.portii, n = nutritie(r), u = r.ultima;
  let grup = "";
  const ingr = r.ingrediente.map((i, k) => (i.grup && i.grup !== grup ? `<li class="grup">${esc(grup = i.grup)}</li>` : "")
    + `<li class="${bifate.has(k) ? "bifat" : ""}"><input type="checkbox" data-k="${k}" ${bifate.has(k) ? "checked" : ""}>
      <span class="nume">${esc(i.nume)}${i.nota && f === 1 ? ` <span class="nota">(${esc(i.nota)})</span>` : ""}</span>
      <span class="g">${Math.max(1, Math.round(i.g * f))} g</span></li>`).join("");
  $("detaliu-continut").innerHTML = `
    <div class="status">${STATUSURI[r.status] ?? esc(r.status)} · ${CATEGORII[r.categorie] ?? esc(r.categorie)} · v${r.versiune}</div>
    <h2>${esc(r.titlu)}</h2>
    <p class="meta"><span>gust ${r.gust ?? "—"}</span><span>efort ${r.efort ?? "—"}</span>
      <span>${durata(r.timp_activ_min)} activ · ${durata(r.timp_total_min)} total</span>
      ${r.din_timp ? `<span>din timp: ${esc(r.din_timp)}</span>` : ""}
      ${r.tags.length ? `<span>${r.tags.map(t => "#" + esc(t)).join(" ")}</span>` : ""}</p>
    <h3>Ingrediente</h3>
    <div class="portii"><button type="button" data-d="-1" aria-label="mai puține porții">−</button>
      <input id="portii" type="number" min="1" inputmode="numeric" value="${portii}">
      <button type="button" data-d="1" aria-label="mai multe porții">+</button><span>porții</span></div>
    <ul class="ingrediente">${ingr}</ul>

    ${r.pasi_html.replace(/<ol>[\s\S]*?<\/ol>/g, cuCronometre)}
    <h3>Nutriție per porție</h3>
    <div class="nutritie"><div><b>≈${n.kcal}</b>kcal</div><div><b>≈${n.proteine} g</b>proteine</div>
      <div><b>≈${n.carbo} g</b>carbo</div><div><b>≈${n.grasimi} g</b>grăsimi</div><div><b>≈${n.fibre} g</b>fibre</div></div>
    <h3>Nutriție per 100 g ${n.pe_gatit ? "(gătit)" : "(crud, din ingrediente)"}</h3>
    <div class="nutritie"><div><b>≈${n.suta.kcal}</b>kcal</div><div><b>≈${n.suta.proteine} g</b>proteine</div>
      <div><b>≈${n.suta.carbo} g</b>carbo</div><div><b>≈${n.suta.grasimi} g</b>grăsimi</div><div><b>≈${n.suta.fibre} g</b>fibre</div></div>
    <p class="meta"><span>cost ${lei(n.cost)}/porție</span><span>sursă: ${sursa(r.sursa)}</span></p>
    <h3>Ultima intrare din jurnal</h3>
    ${u ? `<div class="jurnal"><p><b>${esc(u.data)}</b> · v${u.versiune} · gust ${u.gust} · efort ${u.efort}${u.executie === "greseala_mea" ? " · greșeala mea" : ""}</p>
      ${u.observatii ? `<p>${esc(u.observatii)}</p>` : ""}${u.urmatoarea_data ? `<p><b>Data viitoare:</b> ${esc(u.urmatoarea_data)}</p>` : ""}</div>`
      : `<p class="jurnal">Încă negătită.</p>`}`;
  $("detaliu-continut").querySelectorAll("ol li").forEach((li, k) => li.classList.toggle("facut", facute.has(k)));
  if (cronometru) { cronometru.btn = $("detaliu-continut").querySelectorAll("button.timp")[cronometru.idx]; cronometru.btn?.classList.add("activ"); }
}

// Cronometru: unul singur, afișat în bara de sus; sună și vibrează la final.
let cronometru = null, audio = null;
function porneste(btn) {
  opreste();
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  const idx = [...$("detaliu-continut").querySelectorAll("button.timp")].indexOf(btn);
  cronometru = {btn, idx, sfarsit: Date.now() + btn.dataset.s * 1000, interval: setInterval(bate, 250)};
  btn.classList.add("activ");
  $("cronometru").hidden = false;
  $("cronometru").classList.remove("gata");
  bate();
}
function bate() {
  const rest = Math.max(0, Math.round((cronometru.sfarsit - Date.now()) / 1000));
  $("cronometru").textContent = rest ? `⏱ ${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, "0")}` : "⏱ gata!";
  if (!rest) { clearInterval(cronometru.interval); cronometru.interval = null; $("cronometru").classList.add("gata"); suna(); }
}
function opreste() {
  if (cronometru) { clearInterval(cronometru.interval); cronometru.btn?.classList.remove("activ"); cronometru = null; }
  $("cronometru").hidden = true;
}
function suna() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
  if (!audio) return;
  try {
    audio.resume && audio.resume();
    [0, 0.45, 0.9].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.connect(g); g.connect(audio.destination); o.frequency.value = 880;
      g.gain.setValueAtTime(0.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.35);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.35);
    });
  } catch (e) {}
}

// Navigarea nu depinde de URL: unele vizualizatoare (fișier deschis ca data:) nu permit schimbarea lui.
// Unde se poate, punem și o intrare în istoric, ca butonul „înapoi” al telefonului să închidă detaliul.
function deschide(slug, inIstoric) {
  const r = RETETE.find(x => x.slug === slug);
  if (!r) return inchide();
  if (r !== curenta) { curenta = r; portii = r.portii; bifate = new Set(); facute = new Set(); opreste(); }
  $("detaliu-titlu").textContent = r.titlu;
  deseneazaDetaliu();
  $("detaliu").hidden = false;
  $("detaliu").scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (inIstoric) try { history.pushState({slug}, "", "#" + slug); } catch (e) { /* fără istoric, mergem oricum */ }
}
function inchide() {
  $("detaliu").hidden = true;
  document.body.style.overflow = "";
  arataLista();
}

$("detaliu-continut").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (b) { portii = Math.max(1, portii + Number(b.dataset.d)); deseneazaDetaliu(); return; }
  const t = e.target.closest("button.timp");
  if (t) { if (cronometru && cronometru.btn === t) opreste(); else porneste(t); return; }
  const li = e.target.closest("ol li");
  if (li) {
    const k = [...$("detaliu-continut").querySelectorAll("ol li")].indexOf(li);
    if (facute.has(k)) facute.delete(k); else facute.add(k);
    li.classList.toggle("facut", facute.has(k));
  }
});
$("detaliu-continut").addEventListener("change", e => {
  const el = e.target;
  if (el.id === "portii") { portii = Math.max(1, Math.round(Number(el.value)) || 1); deseneazaDetaliu(); }
  else if (el.dataset.k !== undefined) {
    const k = Number(el.dataset.k);
    if (el.checked) bifate.add(k); else bifate.delete(k);
    el.closest("li").classList.toggle("bifat", el.checked);
  }
});
$("cronometru").addEventListener("click", opreste);
$("lista").addEventListener("click", e => {
  const a = e.target.closest("a.card");
  if (a) { e.preventDefault(); deschide(a.dataset.slug, true); }
});
$("inapoi").addEventListener("click", () => { if (history.state && history.state.slug) history.back(); else inchide(); });
window.addEventListener("popstate", () => {  // înapoi/înainte în browser, sau hash schimbat manual
  const slug = (history.state && history.state.slug) || location.hash.slice(1);
  if (RETETE.some(x => x.slug === slug)) deschide(slug, false); else inchide();
});
for (const id of ["cautare", "categorie", "tag", "sortare", "arata-imbunatatire", "arata-test"])
  $(id).addEventListener("input", arataLista);
for (const c of Object.keys(CATEGORII).filter(c => RETETE.some(r => r.categorie === c)))
  $("categorie").insertAdjacentHTML("beforeend", `<option value="${c}">${CATEGORII[c]}</option>`);
for (const t of [...new Set(RETETE.flatMap(r => r.tags))].sort((a, b) => a.localeCompare(b, "ro")))
  $("tag").insertAdjacentHTML("beforeend", `<option value="${esc(t)}">#${esc(t)}</option>`);
if (RETETE.some(x => x.slug === location.hash.slice(1))) deschide(location.hash.slice(1), false); else inchide();
