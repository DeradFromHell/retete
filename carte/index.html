<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cartea de rețete</title>
<style>
:root{--fundal:#f6f0e4;--hartie:#fffdf8;--text:#1f1a14;--mut:#7d7365;--linie:#e4dccb;--accent:#b3462b;--activ:#f9e6d8;
  --verde:#2f6b4f;--verde-fundal:#e3efe6;--ambra:#a8720f;--ambra-fundal:#f8ecd2;--gri:#8a8174;--gri-fundal:#ece7de;--umbra:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06)}
@media (prefers-color-scheme: dark){:root{--fundal:#171411;--hartie:#221e19;--text:#efe8dc;--mut:#a89e8f;--linie:#38312a;--accent:#e58a6a;--activ:#3f2a22;
  --verde:#7cc79d;--verde-fundal:#1f3b2d;--ambra:#e2b04e;--ambra-fundal:#3d2f12;--gri:#a39a8c;--gri-fundal:#2e2924;--umbra:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundal);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.serif{font-family:ui-serif,Georgia,"Noto Serif","Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* antet listă */
header{position:sticky;top:0;z-index:2;background:var(--fundal);padding:.7rem .9rem .6rem;border-bottom:1px solid var(--linie)}
header>div,main,article{max-width:720px;margin:0 auto}
.cap{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;margin-bottom:.55rem}
h1{margin:0;font-size:1.7rem;line-height:1.1}
h1 small{display:block;font:500 .78rem/1.3 system-ui,sans-serif;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-top:.15rem}
input[type=search]{width:100%;font:inherit;font-size:1rem;padding:.55rem .8rem;border:1px solid var(--linie);border-radius:12px;background:var(--hartie);color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem;align-items:center}
.chips.linie{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.linie::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linie);background:var(--hartie);border-radius:999px;padding:.28rem .75rem;font-size:.88rem;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.activ{background:var(--text);border-color:var(--text);color:var(--fundal)}
.chip.fix{background:var(--verde-fundal);border-color:transparent;color:var(--verde);font-weight:600;cursor:default}
.chip.actiune{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.eticheta{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-right:.2rem;white-space:nowrap}
/* carduri */
main{padding:.9rem .9rem 6rem}
.card{display:grid;grid-template-columns:3.4rem 1fr;gap:.8rem;position:relative;background:var(--hartie);border-radius:16px;padding:.85rem .9rem .85rem .85rem;margin-bottom:.75rem;text-decoration:none;color:inherit;box-shadow:var(--umbra);border-left:5px solid var(--cat,var(--accent));transition:transform .12s}
.card:active{transform:scale(.985)}
.initiala{position:relative;overflow:hidden;width:3.4rem;height:3.4rem;border-radius:12px;background:var(--cat,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;line-height:1}
.initiala img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.initiala.cu-poza img{display:block}
.poza-mare{margin:.2rem 0 .9rem;border-radius:16px;overflow:hidden;box-shadow:var(--umbra);aspect-ratio:4/3;background:var(--hartie)}
.poza-mare img{width:100%;height:100%;object-fit:cover;display:block}
.poza-actiuni{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:-.3rem 0 .8rem}
.poza-actiuni small{color:var(--mut);font-size:.82rem}
.card h2{margin:0 0 .3rem;font-size:1.28rem;line-height:1.2;padding-right:4.6rem}
.pastile{display:flex;flex-wrap:wrap;gap:.3rem .45rem;margin:.1rem 0 .3rem}
.pastile span{font-size:.84rem;background:var(--fundal);border-radius:8px;padding:.1rem .5rem;white-space:nowrap}
.pastile b{font-weight:700}
.gust{font-size:.86rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.1rem .6rem;align-items:center}
.puncte{letter-spacing:.06em;font-size:.8rem}
.puncte b{color:var(--accent)}
.dintimp-mic{font-size:.84rem;color:var(--ambra);margin-top:.25rem}
.stare{position:absolute;top:.75rem;right:.8rem;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:.18rem .55rem}
.stare.verde{background:var(--verde-fundal);color:var(--verde)}
.stare.ambra{background:var(--ambra-fundal);color:var(--ambra)}
.stare.gri{background:var(--gri-fundal);color:var(--gri)}
.gol{color:var(--mut);text-align:center;padding:3rem 1rem;font-size:1rem}
/* panouri */
.panou{position:fixed;inset:0;background:var(--fundal);overflow-y:auto;z-index:3;-webkit-overflow-scrolling:touch}
.panou:not([hidden]){animation:intra .22s ease-out}
@keyframes intra{from{transform:translateX(28px)}}
.bara{position:sticky;top:0;z-index:1;background:var(--fundal);border-bottom:1px solid var(--linie);padding:.35rem .4rem;display:flex;align-items:center;gap:.2rem;min-height:2.9rem}
.bara .btn{background:none;border:0;color:var(--accent);padding:.4rem .5rem;font-size:1rem;font-weight:600}
.bara .titlu{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.95rem}
.sari{position:sticky;top:2.9rem;z-index:1;display:flex;background:var(--fundal);border-bottom:1px solid var(--linie);padding:.1rem .4rem;overflow-x:auto;scrollbar-width:none}
.sari button{background:none;border:0;padding:.45rem .65rem;color:var(--mut);font-size:.88rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
article{padding:.9rem .9rem 6rem}
article.mare{font-size:1.15em}
article.foarte-mare{font-size:1.3em}
.antet{display:grid;grid-template-columns:3.6rem 1fr;gap:.8rem;align-items:start;margin:.3rem 0 .8rem}
.antet .initiala{width:3.6rem;height:3.6rem;font-size:1.9rem}
article h2{margin:0;font-size:1.7rem;line-height:1.15}
.stari-mici{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.stari-mici .stare{position:static}
.stari-mici .tag{font-size:.78rem;color:var(--mut);border:1px solid var(--linie);border-radius:999px;padding:.18rem .55rem}
.cifre{display:flex;justify-content:space-around;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie);padding:.65rem 0;margin:.8rem 0}
.cifre div{text-align:center;font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.cifre b{display:block;font-size:1.3rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em;text-transform:none}
.dintimp{background:var(--ambra-fundal);color:var(--ambra);border-radius:12px;padding:.55rem .85rem;margin:.6rem 0;font-weight:600}
.dintimp small{display:block;font-weight:400;color:var(--text);opacity:.85}
.gatit{font-size:.9rem;color:var(--mut);margin:.4rem 0 0}
h3{font-family:ui-serif,Georgia,"Noto Serif",serif;font-size:1.25rem;margin:1.7rem 0 .6rem;color:var(--text);scroll-margin-top:5.9rem;display:flex;align-items:baseline;gap:.5rem}
h3::after{content:"";flex:1;border-bottom:1px solid var(--linie);transform:translateY(-.3em)}
h3 small{font:400 .78rem/1 system-ui,sans-serif;color:var(--mut)}
h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin:1.1rem 0 .6rem;color:var(--accent)}
.indiciu{font-size:.84rem;color:var(--mut);margin:-.3rem 0 .7rem}
.portii{display:flex;align-items:center;gap:.5rem;margin:.3rem 0 .7rem;flex-wrap:wrap}
.portii button.rotund{font-size:1.25rem;width:2.4rem;height:2.4rem;border:1px solid var(--linie);border-radius:50%;background:var(--hartie)}
.portii input{width:3.6rem;text-align:center;font:inherit;padding:.4rem;border:1px solid var(--linie);border-radius:10px;background:var(--hartie);color:inherit}
.portii .chip{margin-left:auto}
.ingrediente{list-style:none;margin:0;padding:0;background:var(--hartie);border-radius:14px;overflow:hidden;box-shadow:var(--umbra)}
.ingrediente li{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-bottom:1px solid var(--linie)}
.ingrediente li:last-child{border-bottom:0}
.ingrediente li.grup{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cat,var(--accent));background:var(--fundal);padding:.45rem .9rem;font-weight:700}
.ingrediente input{width:1.3rem;height:1.3rem;margin:0;flex:none;accent-color:var(--verde)}
.ingrediente input:checked{animation:pop .2s}
@keyframes pop{50%{transform:scale(1.35)}}
.ingrediente .nume{flex:1}
.ingrediente .din{display:block;font-size:.8rem;color:var(--mut)}
.ingrediente .cant{text-align:right;line-height:1.2}
.ingrediente .cant b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.05em}
.ingrediente .cant small{display:block;color:var(--mut);font-size:.8rem;max-width:9rem}
.bifat .nume{text-decoration:line-through;color:var(--mut)}
ol{list-style:none;padding:0;margin:0}
ol li{position:relative;background:var(--hartie);border-radius:14px;padding:.8rem .9rem .8rem 3.5rem;margin-bottom:.6rem;cursor:pointer;box-shadow:var(--umbra);line-height:1.5}
ol li::before{content:attr(value);position:absolute;left:.8rem;top:.75rem;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;font-family:ui-serif,Georgia,serif}
ol li.facut{color:var(--mut);background:transparent;box-shadow:none;border:1px dashed var(--linie)}
ol li.facut::before{content:"✓";background:var(--verde)}
button.timp{font-size:.92em;background:var(--activ);border:0;border-radius:8px;padding:.05rem .5rem;white-space:nowrap;color:var(--accent);font-weight:600}
button.timp.activ{background:var(--accent);color:#fff}
details.note{margin-top:1rem;background:var(--hartie);border-radius:14px;padding:.5rem .9rem;box-shadow:var(--umbra)}
details.note summary{cursor:pointer;font-weight:600;padding:.35rem 0}
details.note p{margin:.45rem 0}
p.p{padding-left:1.1rem;text-indent:-1.1rem}
p.p::before{content:"• ";color:var(--accent)}
.nutritie{display:grid;grid-template-columns:repeat(3,1fr);row-gap:.6rem;gap:.3rem;text-align:center;font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:var(--hartie);border-radius:14px;padding:.7rem .2rem;margin-bottom:.5rem;box-shadow:var(--umbra)}
.nutritie b{display:block;font-size:1.05rem;color:var(--text);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.meta{font-size:.88rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.15rem .8rem;margin:.3rem 0}
.intrare{background:var(--hartie);border-radius:14px;padding:.65rem .9rem;margin-bottom:.5rem;box-shadow:var(--umbra);border-left:4px solid var(--verde)}
.intrare.greseala{border-left-color:var(--ambra)}
.intrare p{margin:.25rem 0}
.intrare .cand{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
/* cronometre */
#cronometre{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:.45rem;padding:.55rem .9rem;background:var(--hartie);border-top:1px solid var(--linie);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.cron{position:relative;overflow:hidden;border:0;background:var(--activ);border-radius:12px;padding:.4rem .8rem .5rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:left;line-height:1.2;font-size:1.05rem;color:var(--accent)}
.cron small{display:block;font-size:.7rem;font-weight:500;color:var(--text);opacity:.8}
.cron i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:var(--p,0%);transition:width .5s linear}
.cron.gata{background:var(--accent);color:#fff;animation:clipire 1s infinite}
.cron.gata small{color:#fff}
@keyframes clipire{50%{opacity:.55}}
#timer-panou{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--hartie);border-radius:18px 18px 0 0;padding:.9rem;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
#timer-panou .chips{margin-top:0;margin-bottom:.7rem}
#timer-panou h3{margin:0 0 .6rem;font-size:1.1rem}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div>
  <div class="cap"><h1>Cartea de rețete<small id="nr-retete"></small></h1><span><button class="chip" id="btn-cumparaturi" type="button" hidden>🛒 cumpărături <span id="nr-cumparaturi"></span></button> <button class="chip" id="btn-timer-lista" type="button" title="cronometru">⏱</button></span></div>
  <input id="cautare" type="search" placeholder="Caută după titlu sau ingredient" autocomplete="off">
  <div class="chips" id="stari">
    <span class="chip fix">✓ în carte</span>
    <button class="chip" type="button" data-stare="imbunatatire">de îmbunătățit</button>
    <button class="chip" type="button" data-stare="test">în test</button>
    <button class="chip" type="button" id="btn-filtre">filtre ▾</button>
  </div>
  <div id="filtre" hidden>
    <div class="chips linie" id="sortari"><span class="eticheta">sortare</span>
      <button class="chip activ" type="button" data-sort="gust">gust</button>
      <button class="chip" type="button" data-sort="efort">efort</button>
      <button class="chip" type="button" data-sort="timp">timp</button></div>
    <div class="chips linie" id="categorii"><span class="eticheta">categorie</span></div>
    <div class="chips linie" id="taguri"><span class="eticheta">tag</span></div>
  </div>
</div></header>
<main id="lista"></main>
<section id="detaliu" class="panou" hidden>
  <div class="bara"><button class="btn" id="inapoi" type="button">‹ Înapoi</button><span class="titlu" id="detaliu-titlu"></span><button class="btn" id="btn-timer" type="button" title="cronometru">⏱</button><button class="btn" id="btn-text" type="button" title="text mai mare">Aa</button></div>
  <nav class="sari"><button type="button" data-tinta="s-ingrediente">Ingrediente</button><button type="button" data-tinta="s-pasi">Pași</button><button type="button" data-tinta="s-nutritie">Nutriție</button><button type="button" data-tinta="s-jurnal">Jurnal</button></nav>
  <article id="detaliu-continut"></article>
</section>
<section id="cumparaturi" class="panou" hidden>
  <div class="bara"><button class="btn" id="inapoi-cumparaturi" type="button">‹ Înapoi</button><span class="titlu">Cumpărături</span><button class="btn" id="goleste" type="button">golește</button></div>
  <article id="cumparaturi-continut"></article>
</section>
<input type="file" id="poza-fisier" accept="image/*" hidden>
<div id="cronometre" hidden title="atinge un cronometru ca să-l oprești"></div>
<div id="timer-panou" hidden>
  <h3>Cronometru</h3>
  <div class="chips" id="timer-presetari"></div>
  <div class="portii"><input id="timer-minute" type="number" min="1" inputmode="numeric" placeholder="minute">
    <button class="chip actiune" id="timer-start" type="button">pornește</button><button class="chip" id="timer-inchide" type="button">închide</button></div>
</div>
<script>
"use strict";
// build.py înlocuiește marcajul de mai jos cu JSON-ul rețetelor (fără cele la gunoi).
const RETETE = [{"slug": "oua-jumari", "titlu": "Ouă jumări cremoase", "categorie": "mic-dejun", "tags": ["ou", "tigaie", "rapid"], "sursa": "claude", "status": "test", "versiune": 1, "portii": 2, "din_timp": "", "timp_activ_min": 10, "timp_total_min": 10, "greutate_gatita_g": null, "ingrediente": [{"id": "oua", "nume": "Ou de găină întreg, crud (fără coajă)", "g": 200, "nota": "4 ouă M", "grup": "", "kcal": 143.0, "proteine": 12.6, "carbo": 0.72, "grasimi": 9.51, "fibre": 0.0, "sare": 0.35, "pret_per_kg": 26.0}, {"id": "unt", "nume": "Unt fără sare", "g": 20, "nota": "1 lingură cu vârf", "grup": "", "kcal": 717.0, "proteine": 0.85, "carbo": 0.06, "grasimi": 81.1, "fibre": 0.0, "sare": 0.03, "pret_per_kg": 50.0}, {"id": "sare", "nume": "Sare de masă", "g": 2, "nota": "1/3 linguriță", "grup": "", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 97.0, "pret_per_kg": 2.0}, {"id": "piper", "nume": "Piper negru măcinat", "g": 1, "nota": "după gust, la servit", "grup": "", "kcal": 251.0, "proteine": 10.4, "carbo": 64.0, "grasimi": 3.26, "fibre": 25.3, "sare": 0.05, "pret_per_kg": 120.0}], "nutritie": {"kcal": 220, "proteine": 13, "carbo": 1, "grasimi": 18, "fibre": 0, "sare": 1.3, "cost": 3}, "pasi_html": "<ol><li value=\"1\">Sparge ouăle într-un bol, adaugă sarea și bate-le cu furculița 20–30 de secunde, până nu se mai văd dâre de albuș, doar un galben uniform.<\/li><li value=\"2\">Pune untul într-o tigaie antiaderentă la foc mic spre mediu, ~1 minut, până s-a topit și face spumă fină, fără să se rumenească.<\/li><li value=\"3\">Toarnă ouăle și lasă-le 10–15 secunde, până marginea prinde puțin.<\/li><li value=\"4\">Amestecă încet și continuu cu o spatulă, trăgând de la margine spre centru; 2–3 minute în total, până sunt cremoase și încă puțin lucioase.<\/li><li value=\"5\">Ia tigaia de pe foc când sunt cu puțin mai moi decât le vrei: se mai gătesc 30 de secunde din căldura tigăii. Piper deasupra, servește imediat.<\/li><\/ol><h3>Note<\/h3><p class=\"p\">Ce nu e sigur (rețetă clasică scrisă de Claude, nu testată de tine): timpul depinde de tigaie și de aragaz; focul mic e tot secretul, la foc mare ies uscate în 40 de secunde. Sarea, 2 g la 4 ouă, e un reper mediu.<\/p><p class=\"p\">Merge cu (sugestii): pâine prăjită cu unt, roșii tăiate, ceapă verde tocată sau puțină smântână amestecată la final, de pe foc.<\/p><p class=\"p\">Nu se păstrează: reîncălzite devin cauciucate. Mănâncă-le pe loc.<\/p>", "jurnal": []}, {"slug": "piept-pui-teriyaki", "titlu": "Piept de pui teriyaki la air fryer", "categorie": "pranz-cina", "tags": ["pui", "air-fryer", "glazura"], "sursa": "propriu", "status": "test", "versiune": 1, "portii": 2, "din_timp": "marinare 4–6 h (minimum 2, maximum 8)", "timp_activ_min": 35, "timp_total_min": 45, "greutate_gatita_g": null, "ingrediente": [{"id": "piept_pui", "nume": "Piept de pui fără piele, crud", "g": 500, "nota": "", "grup": "Carnea", "kcal": 120.0, "proteine": 22.5, "carbo": 0.0, "grasimi": 2.62, "fibre": 0.0, "sare": 0.11, "pret_per_kg": 35.0}, {"id": "sos_soia", "nume": "Sos de soia", "g": 48, "nota": "3 linguri", "grup": "Marinada (se aruncă după)", "kcal": 53.0, "proteine": 8.14, "carbo": 4.93, "grasimi": 0.57, "fibre": 0.8, "sare": 13.72, "pret_per_kg": 30.0}, {"id": "miere", "nume": "Miere", "g": 21, "nota": "1 lingură", "grup": "Marinada (se aruncă după)", "kcal": 304.0, "proteine": 0.3, "carbo": 82.4, "grasimi": 0.0, "fibre": 0.2, "sare": 0.01, "pret_per_kg": 40.0}, {"id": "otet_mere", "nume": "Oțet de mere", "g": 15, "nota": "1 lingură", "grup": "Marinada (se aruncă după)", "kcal": 21.0, "proteine": 0.0, "carbo": 0.93, "grasimi": 0.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 8.0}, {"id": "ghimbir", "nume": "Ghimbir proaspăt", "g": 8, "nota": "2 lingurițe, ras", "grup": "Marinada (se aruncă după)", "kcal": 80.0, "proteine": 1.82, "carbo": 17.8, "grasimi": 0.75, "fibre": 2.0, "sare": 0.03, "pret_per_kg": 25.0}, {"id": "usturoi", "nume": "Usturoi, crud", "g": 12, "nota : 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 0.01, "pret_per_kg": 0.0}, {"id": "ulei_floarea_soarelui", "nume": "Ulei de floarea-soarelui", "g": 2, "nota": "spray scurt pe grătar", "grup": "La gătit și la servit", "kcal": 884.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 100.0, "fibre": 0.0, "sare": 0.0, "pret_per_kg": 10.0}, {"id": "seminte_susan", "nume": "Semințe de susan", "g": 3, "nota": "1 linguriță, prăjite (estimare, după gust)", "grup": "La gătit și la servit", "kcal": 573.0, "proteine": 17.7, "carbo": 23.4, "grasimi": 49.7, "fibre": 11.8, "sare": 0.03, "pret_per_kg": 30.0}, {"id": "ceapa_verde", "nume": "Ceapă verde", "g": 30, "nota": "2 fire, tăiate (estimare, după gust)", "grup": "La gătit și la servit", "kcal": 32.0, "proteine": 1.83, "carbo": 7.34, "grasimi": 0.19, "fibre": 2.6, "sare": 0.04, "pret_per_kg": 20.0}], "nutritie": {"kcal": 460, "proteine": 61, "carbo": 27, "grasimi": 11, "fibre": 1, "sare": 6.9, "cost": 12}, "pasi_html": "<h3>Cu 4–6 ore înainte<\/h3><ol><li value=\"1\">Dacă pieptul e gros, bate-l ușor sau crestează-l, ca să aibă grosime uniformă; contează mai mult decât timpul de marinare.<\/li><li value=\"2\">Amestecă într-un bol ingredientele marinadei: sos de soia, miere, oțet, ghimbir, usturoi, ulei de susan, piper.<\/li><li value=\"3\">Pune carnea într-o pungă, toarnă marinada, întoarce punga de câteva ori, scoate aerul și închide. La frigider minimum 2 ore, ideal 4–6, maximum 8; peste, soia sărează prea tare și carnea devine cauciucată.<\/li><\/ol><h3>La gătit<\/h3><ol><li value=\"4\">Preîncălzește air fryer-ul la 190 °C, 3–4 minute gol, până simți aer fierbinte când tragi sertarul.<\/li><li value=\"5\">Scoate carnea din marinadă și tamponeaz-o bine cu prosop de hârtie; marinada se aruncă. Suprafață uscată înseamnă rumenire, suprafață udă înseamnă abur.<\/li><li value=\"6\">Spray scurt de ulei pe grătarul încins și carnea deasupra: 8 minute, până prinde culoare pe fața de sus.<\/li><li value=\"7\">Întoarce și mai lasă 3 minute, până e rumenită pe margini.<\/li><\/ol><h3>Glazura, în paralel<\/h3><ol><li value=\"8\">Din minutul 8 (când întorci pieptul): într-o crăticioară mică pune sos de soia, miere, oțet, ghimbir și usturoi (fără amidon), la foc mediu, amestecând, până dă în clocot; lasă să clocotească 2 minute.<\/li><li value=\"9\">Separat, într-o ceșcuță, amestecă amidonul cu cele 2 linguri de apă rece până e complet omogen, fără cocoloașe.<\/li><li value=\"10\">Toarnă amidonul în crăticioara care clocotește, amestecând continuu: în 30–60 de secunde se îngroașă și îmbracă lingura.<\/li><li value=\"11\">Dacă rămâne apoasă, nu a clocotit destul: trebuie bule vizibile, nu doar abur. Mai adaugă o linguriță de amidon dizolvat în apă rece și adu din nou la clocot puternic; alternativ, fierbe 3–4 minute fără capac, până se reduce și se îngroașă singură.<\/li><li value=\"12\">Ia glazura de pe foc; se mai îngroașă pe măsură ce se răcește.<\/li><\/ol><h3>Finalizare<\/h3><ol><li value=\"13\">La minutul 11, scoate pieptul, pensulează-l cu glazură și pune-l înapoi 2 minute, până glazura devine lucioasă și se lipește de carne; total în air fryer ~13 minute.<\/li><li value=\"14\">Scoate, mai pensulează o dată deasupra și lasă-l să se odihnească 5 minute înainte să-l tai.<\/li><li value=\"15\">Presară semințele de susan prăjite și ceapa verde tăiată.<\/li><\/ol><h3>Note<\/h3><p class=\"p\">Semințele de susan crude sunt aproape fără gust: prăjește-le înainte, în tigaie uscată, fără ulei, la foc mediu, 2–3 minute, amestecând des, până devin aurii și miros a prăjit. Se ard în câteva secunde, stai lângă ele. Poți prăji toată punga odată; țin săptămâni într-un borcan.<\/p><p class=\"p\">Marinada nu pătrunde mai mult de 2–3 mm în carne, oricât ai lăsa-o; aroma reală vine din glazura aplicată la final.<\/p><p class=\"p\">Nu refolosi marinada în care a stat carne crudă; fă porție separată pentru glazură.<\/p><p class=\"p\">Amidonul se dizolvă întotdeauna în apă rece, separat, înainte să ajungă în lichid fierbinte; altfel face cocoloașe.<\/p><p class=\"p\">Tamponează carnea slabă (piept) înainte de air fryer: umezeala face abur, iar aburul înseamnă fără crustă.<\/p><p class=\"p\">Acidul (lămâie, oțet) în cantitate mare, pe termen lung, strică textura pieptului; în glazură, la final, e în regulă.<\/p><p class=\"p\">Dacă le faci împreună cu pulpele la cuptor, cronologia serii e în rețeta „pulpe-pui-cuptor”.<\/p><p class=\"p\">Merge cu (sugestii): orez simplu fiert, care absoarbe glazura; orez cu legume în tigaie, cum faci deja; broccoli sau fasole verde sotată; salată de castraveți cu oțet de mere și puțin susan.<\/p><p class=\"p\">Păstrare și reîncălzire (sugestii): la frigider, în cutie închisă, 3–4 zile; glazura rămasă, separat, până la o săptămână. Reîncălzește bucata întreagă (feliată se usucă) în air fryer la 160 °C, 3–4 minute, până e fierbinte la mijloc, sau la microunde 1–1,5 minute cu o lingură de apă și capac. Rece, feliat subțire, merge în salată sau sandvici.<\/p><p class=\"p\">Nutriție (observația lui Claude): marinada se aruncă, dar e numărată integral, ≈80 kcal/porție (mai ales mierea și uleiul de susan); fără ea, porția ar avea ≈380 kcal, nu 460. La fel sarea: din ≈6,9 g/porție afișate, jumătate e soia din marinada aruncată; realist, ≈3,5 g. Sosul de soia e valoarea generică USDA; pentru exact, de pe eticheta sticlei. Susanul și ceapa verde de la servit sunt cantități estimate.<\/p><p class=\"p\">Indiciile senzoriale de la pașii 6, 7, 10 și 13 sunt propuse de Claude, nu din experiența ta; corectează-le după prima gătire.<\/p>", "jurnal": []}, {"slug": "pui-sos-miere-usturoi-orez", "titlu": "Pui cu sos de miere și usturoi, cu orez jasmine", "categorie": "pranz-cina", "tags": ["pui", "air-fryer", "sos", "orez", "meal-prep", "congelabil"], "sursa": "propriu", "status": "test", "versiune": 1, "portii": 4, "din_timp": "", "timp_activ_min": 30, "timp_total_min": 45, "greutate_gatita_g": null, "ingrediente": [{"id": "piept_pui", "nume": "Piept de pui fără p <\/h3><ol><li value=\"1\">Pune orezul spălat și apa rece într-o cratiță, la foc mare, până dă în clocot: bule mari, care sparg suprafața. Nu săra apa: sosul aduce destulă sare.<\/li><li value=\"2\">Pune capacul, dă focul la minimum și lasă 12 minute. Stinge focul și mai lasă 4 minute cu capacul pus. Nu ridica capacul și nu amesteca în cele 16 minute; e singura greșeală care strică orezul. Abia apoi afânează cu furculița.<\/li><\/ol><h3>Puiul<\/h3><ol><li value=\"3\">Într-un bol, amestecă cuburile de pui cu sosul de soia, apa, usturoiul ras, ghimbirul și piperul alb. Lasă 10 minute.<\/li><li value=\"4\">Într-un al doilea bol pune amidonul și trece cuburile prin el până sunt acoperite uniform, ca pudrate; scutură surplusul.<\/li><li value=\"5\">Air fryer la 200 °C, 16 minute, agitând coșul de două ori; pulverizează ulei la început și încă o dată la jumătate. Un singur strat în coș, altfel fă-le în două reprize. Gata când crusta e aurie și uscată la atingere. La cuptor: 190 °C, 18 minute, pe hârtie de copt.<\/li><\/ol><h3>Sosul (în ultimele 10 minute ale puiului)<\/h3><ol><li value=\"6\">Într-o tigaie la foc mediu, pulverizează uleiul și pune usturoiul ras; călește ~1 minut, până începe să miroasă, fără să se rumenească.<\/li><li value=\"7\">Adaugă sosul de soia și apa și adu la fierbere ușoară: bule mici pe margini.<\/li><li value=\"8\">Separat, amestecă amidonul cu apa rece până se dizolvă complet. Dă focul mic, toarnă amestecul și fulgii de ardei și amestecă ~2 minute, până sosul se îngroașă și îmbracă lingura. Dacă iese prea gros, subțiază cu puțină apă.<\/li><li value=\"9\">Ia tigaia de pe foc și adaugă mierea. Gustă. Nu adăuga sare înainte să guști: cu soia clasică, sosul e deja la limită.<\/li><\/ol><h3>Servire<\/h3><ol><li value=\"10\">Pune puiul în sos și amestecă până se acoperă uniform. Servește peste orez; opțional, ceapă verde tăiată deasupra.<\/li><\/ol><h3>Note<\/h3><p class=\"p\">Adaptare după rețeta lui Jack Ovens (scrisă cu alt AI): originalul cere 140 ml sos de soia cu sodiu redus; cu Kikkoman clasic (16,9 g sare/100 ml) ar însemna ~6 g sare pe porție, așa că soia e redusă la 70 ml și diferența e completată cu apă. Rezultă ~3 g sare pe porție. Dacă vrei mai jos, înlocuiește 20 ml de soia cu apă și compensează cu mai mult usturoi și ghimbir.<\/p><p class=\"p\">De ce apă, nu supă: cuburile și granulele de supă au 10–15 g sare la 100 g; peste soia ar duce porția peste 4 g sare.<\/p><p class=\"p\">Grăsimea din sos: originalul cere 28 g de unt; aici e spray de măsline, usturoiul se călește la fel și nu stropește. Dacă folosești unt, să fie de minimum 82% grăsime, nu tartinabil (are apă și ulei vegetal, sare din tigaie).<\/p><p class=\"p\">Originalul cere și zahăr brun și miere, la pași diferiți; aici e păstrată doar mierea.<\/p><p class=\"p\">Nutriție: estimare pesimistă, tot amidonul (100 g) e numărat, deși o parte bună rămâne în bol; caloriile și carbohidrații reali sunt mai mici. Orezul e ~270 kcal din porție; dacă vrei să scazi caloriile, taie din orez, nu din sos. Mierea și amidonul sunt valori USDA generice; sosul de soia, uleiul spray și restul, de pe etichete.<\/p><p class=\"p\">Fără orez, rețeta nu merge ca atare: sosul e calculat să se întindă peste orez neutru; înjumătățește sosul și servește cu cartofi natur. Amestecurile congelate orez-cu-legume au adesea sare și condimente; încălzește-le separat, nu în sos.<\/p><p class=\"p\">Păstrare: frigider 3 zile; congelator 4 luni, decongelat peste noapte la frigider. Reîncălzire în tigaie la foc mediu sau la microunde; orezul, cu o lingură de apă peste porție și capac.<\/p><p class=\"p\">De testat la v2: amidon amestecat cu puțină făină de orez pentru crustă mai crocantă; soia redusă la 50 ml total, cu mai mult ghimbir, dacă iese prea sărat.<\/p>", "jurnal": []}, {"slug": "pulpe-pui-cuptor", "titlu": "Pulpe superioare de pui la cuptor, cu piele crocantă", "categorie": "pranz-cina", "tags": ["pui", "cuptor"], "sursa": "propriu", "status": "test", "versiune": 1, "portii": 3, "din_timp": "sărare 40 min până la câteva ore înainte", "timp_activ_min": 15, "timp_total_min": 65, "greutate_gatita_g": null, "ingrediente": [{"id": "pulpe_pui", "nume": "Pulpe de pui cu piele, fără os, crude", "g": 450, "nota": "4 pulpe superioare cu os și piele, ~600 g cântărite cu os", "grup": "", "kcal": 221.0, "proteine": 16.5, "carbo": 0.25, "grasimi": 16.6, "fibre": 0.0, "sare": 0.2, "pret_per_kg": 25.0}, {"id": "sare", "nume": "Sare de masă", "g": 3, "nota": "1/2 linguriță (o linguriță întreagă dacă nu pui sos teriyaki)", "grup": "", "kcal": 0.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 0.0, "fibre": 0.0, "sare": 97.0, "pret_per_kg": 2.0}, {"id": "piper", "nume": "Piper negru măcinat", "g": 1, "nota": "după gust", "grup": "", "kcal": 251.0, "proteine": 10.4, "carbo": 64.0, "grasimi": 3.26, "fibre": 25.3, "sare": 0.05, "pret_per_kg": 120.0}, {"id": "boia", "nume": "Boia de ardei dulce", "g": 2.3, "nota": "1 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 60.0}, {"id": "boia_afumata", "nume": "Boia de ardei afumată", "g": 1.2, "nota": "1/2 linguriță", "grup": "", "kcal": 282.0, "proteine": 14.1, "carbo": 54.0, "grasimi": 12.9, "fibre": 34.9, "sare": 0.17, "pret_per_kg": 80.0}, {"id": "ulei_floarea_soarelui", "nume": "Ulei de floarea-soarelui", "g": 4, "nota": "2 spray-uri scurte, pe pulpe și pe grătar", "grup": "", "kcal": 884.0, "proteine": 0.0, "carbo": 0.0, "grasimi": 100.0, "fibre": 0.0, "sare": 0.0, "pret_per_kg": 10.0}, {"id": "sos_teriyaki", "nume": "Sos teriyaki (din comerț)", "g": 54, "nota": "3 linguri (2–4), pentru glazurat", "grup": "", "kcal": 89.0, "proteine": 5.93, "carbo": 15.6, "grasimi": 0.02, "fibre": 0.1, "sare": 9.57, "pret_per_kg": 40.0}], "nutritie": {"kcal": 360, "proteine": 26, "carbo": 4, "grasimi": 26, "fibre": 1, "sare": 3, "cost": 4.5}, "pasi_html": "<h3>Din timp<\/h3><ol><li value=\"1\">Cu 40 de minute până la câteva ore înainte: sărează pulpele peste tot, inclusiv sub piele dacă poți strecura degetul, și lasă-le pe o farfurie, cu pielea în sus, descoperite, la frigider. Sarea trage umezeala din piele; piele uscată înseamnă piele crocantă. Fără pasul ăsta iese moale și palidă, indiferent ce faci după.<\/li><\/ol><h3>Cuptorul și condimentarea<\/h3><ol><li value=\"2\">Pune tava cu grătarul de sârmă în cuptor și încălzește la 200 °C, 10–15 minute, până e complet încins. Toarnă apă cât un deget în tavă, sub grătar: grăsimea care picură pe tavă goală fumegă, cu apă nu.<\/li><li value=\"3\">Șterge umezeala vizibilă de pe piele (fără să tamponezi insistent, ca la piept) și freacă pielea cu piper, boia dulce și boia afumată; spray scurt de ulei deasupra. Fără sare (ai pus deja) și fără usturoi granulat (se arde sub glazură).<\/li><\/ol><h3>Gătit<\/h3><ol><li value=\"4\">Spray de ulei pe grătarul încins, pulpele deasupra cu pielea în sus și cu spațiu între ele; dacă se ating, fac abur și nu se rumenesc acolo.<\/li><li value=\"5\">35 de minute: nu le atingi, nu le întorci, nu le acoperi, până pielea e aurie și întinsă.<\/li><li value=\"6\">Scoate, pensulează pielea cu sos teriyaki și pune-le înapoi 4 minute, până sosul se lipește de piele.<\/li><li value=\"7\">Mai pensulează o dată și mai lasă 4 minute, până glazura e lucioasă și maro-aurie; total ~43 de minute.<\/li><\/ol><h3>Verificare<\/h3><ol><li value=\"8\">Gata când pielea e maro-auriu lucios și, la înțepat lângă os, zeama iese limpede, nu roz.<\/li><li value=\"9\">Dacă nu sunt gata: încă 8–10 minute, acoperite lejer cu folie (altfel zahărul din sos se arde); scoate folia în ultimele 3 minute.<\/li><\/ol><h3>Note<\/h3><p class=\"p\">Sosul se pune doar la final pentru că are zahăr: la 200 °C, 45 de minute, se face negru și amar cu mult înainte ca pulpele să fie gata.<\/p><p class=\"p\">Fără marinadă lichidă: pulpele au piele și grăsime, iar marinada udă strică exact pielea crocantă. Nu tampona carnea grasă ca pe piept; are nevoie doar de pielea uscată din frigider.<\/p><p class=\"p\">Sărarea din timp, cu pielea descoperită la frigider, e singurul truc care chiar contează pentru piele crocantă.<\/p><p class=\"p\">Grăsimea e aproape integral din piele; dacă o scoți după gătit scazi mult, dar atunci nu mai are rost tot procesul cu sarea și pielea crocantă. Ori o mănânci, ori faci pulpele altfel.<\/p><p class=\"p\">Nutriția e calculată pe carne cu piele, fără os: 450 g din ~600 g cu os. Sosul teriyaki e valoarea generică USDA; pentru exact, de pe eticheta sticlei.<\/p><p class=\"p\">Indiciile senzoriale de la pașii 5, 6 și 7 sunt propuse de Claude, nu din experiența ta; corectează-le după prima gătire.<\/p><p class=\"p\">Merge cu (sugestii): cartofi la cuptor în aceeași tavă de dedesubt sau pe alt raft, tot la 200 °C; orez sau piure; salată de varză, de castraveți sau murături, care taie grăsimea pielii.<\/p><p class=\"p\">Păstrare și reîncălzire (sugestii): la frigider, în cutie închisă, 3–4 zile. Reîncălzește în cuptor sau air fryer la 180 °C, 8–10 minute, până pielea e din nou crocantă și carnea fierbinte la os; la microunde pielea se înmoaie, dacă tot îl folosești, dă-le apoi 2 minute în air fryer.<\/p><p class=\"p\">Dacă le faci împreună cu pieptul teriyaki, în aceeași seară: T−15 cuptorul la 200 °C cu tava și grătarul, apă în tavă, condimentezi pulpele; T0 pulpele pe grătar, cu pielea în sus; T25 scoți pieptul din marinadă, tamponezi, air fryer 190 °C, 8 min; T33 întorci pieptul, 3 min, și începi glazura în crăticioară; T35 pulpele: primul strat de sos, înapoi 4 min; T36 pieptul: pensulezi cu glazură, înapoi 2 min; T39 scoți pieptul, mai pensulezi, îl lași să se odihnească; pulpele: al doilea strat, 4 min; T43 scoți pulpele; orez cu legume în tigaie 8 min, cât se odihnesc.<\/p>", "jurnal": []}, {"slug": "snitel-pui-branza-airfryer", "titlu": "Șnițel de pui cu brânză gratinată, la air fryer", "categorie": "pranz-cina", "tags": ["pui", "air-fryer", "pane", "meal-prep", "congelabil"], "sursa": "claude", "status       o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.35);
    });
  } catch (e) {}
}

// Poze: micșorată în browser (~1200 px, JPEG), apoi trimisă direct în repo prin API-ul GitHub, cu un token personal
// (fine-grained, doar repo-ul „retete”, Contents: Read and write) cerut o singură dată și ținut în browserul telefonului.
async function micsoreaza(fisier, max = 1200) {
  let img;
  try { img = await createImageBitmap(fisier, {imageOrientation: "from-image"}); }
  catch (e) { img = await new Promise((ok, nu) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nu; i.src = URL.createObjectURL(fisier); }); }
  const f = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}
function tokenGitHub(reia) {
  let t = reia ? "" : memorie.citeste("github_token", "");
  if (!t) {
    t = (prompt("Token GitHub (o singură dată; vezi README, secțiunea „Poze”):") || "").trim();
    if (t) memorie.scrie("github_token", t);
  }
  return t;
}
async function urcaPoza(fisier) {
  const stare = $("poza-stare"), r = curenta;
  const token = tokenGitHub(false);
  if (!token) { stare.textContent = "fără token, nimic trimis"; return; }
  stare.textContent = "se micșorează…";
  const dataUrl = await micsoreaza(fisier);
  const img = $("poza-mare")?.querySelector("img") || Object.assign(document.createElement("img"), {alt: r.titlu});
  img.onload = null; img.onerror = null; img.src = dataUrl;
  if (!img.parentNode) $("poza-mare").appendChild(img);
  $("poza-mare").hidden = false;
  stare.textContent = "se trimite în repo…";
  const api = `https://api.github.com/repos/${REPO}/contents/retete/poze/${r.slug}.jpg`;
  const antet = {Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json"};
  try {
    const existent = await fetch(`${api}?ref=${RAMURA}`, {headers: antet});
    if (existent.status === 401 || existent.status === 403) throw new Error("token refuzat");
    const sha = existent.ok ? (await existent.json()).sha : undefined;
    const raspuns = await fetch(api, {method: "PUT", headers: antet, body: JSON.stringify(
      {message: `poza ${r.slug}`, content: dataUrl.split(",")[1], branch: RAMURA, ...(sha ? {sha} : {})})});
    if (!raspuns.ok) throw new Error((await raspuns.json()).message || raspuns.status);
    stare.textContent = "✓ poza e în repo; pe alte telefoane apare în 1–2 minute";
  } catch (e) {
    if (String(e.message).includes("token refuzat") || String(e.message).includes("Bad credentials")) { memorie.scrie("github_token", ""); stare.textContent = "token refuzat; atinge din nou 📷 și pune altul"; }
    else stare.textContent = "nu s-a putut trimite: " + e.message;
  }
}

// Mod gătit: ecranul rămâne aprins cât e deschisă o rețetă (unde browserul permite).
let veghe = null;
async function tineEcranul() { try { veghe = await navigator.wakeLock.request("screen"); } catch (e) {} }
function lasaEcranul() { try { veghe && veghe.release(); } catch (e) {} veghe = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("detaliu").hidden) tineEcranul(); });
function aplicaMarimea() { $("detaliu-continut").className = ["", "mare", "foarte-mare"][marime] || ""; }

// ---------- cumpărături ----------
function numarCos() { const n = Object.keys(cos).length; $("nr-cumparaturi").textContent = n ? `(${n})` : ""; $("btn-cumparaturi").hidden = !n; }
function deseneazaCumparaturi() {
  const retete = Object.keys(cos).map(s => RETETE.find(r => r.slug === s)).filter(Boolean), total = {};
  for (const r of retete) {
    const f = cos[r.slug] / r.portii;
    for (const i of r.ingrediente) { const t = total[i.id] || (total[i.id] = {nume: i.nume, g: 0, din: new Set()}); t.g += i.g * f; t.din.add(r.titlu); }
  }
  const randuri = Object.entries(total).sort((a, b) => a[1].nume.localeCompare(b[1].nume, "ro"));
  $("cumparaturi-continut").innerHTML = retete.length ? `
    <h3>Rețete alese</h3><ul class="ingrediente">${retete.map(r => `<li><span class="nume">${esc(r.titlu)}<span class="din">${cos[r.slug]} porții</span></span><button class="chip" type="button" data-scoate="${esc(r.slug)}">scoate</button></li>`).join("")}</ul>
    <h3>De cumpărat</h3><ul class="ingrediente">${randuri.map(([id, t]) => `<li class="${cumparate.has(id) ? "bifat" : ""}"><input type="checkbox" data-id="${esc(id)}" ${cumparate.has(id) ? "checked" : ""}>
      <span class="nume">${esc(t.nume)}<span class="din">${[...t.din].map(esc).join(", ")}</span></span><span class="cant"><b>${Math.max(1, Math.round(t.g))} g</b></span></li>`).join("")}</ul>`
    : `<p class="gol">Nimic încă. Deschide o rețetă și atinge „+ cumpărături”.</p>`;
}

// ---------- navigare (nu depinde de URL: unele vizualizatoare nu permit schimbarea lui; istoricul e bonus) ----------
function deschide(slug, inIstoric) {
  const r = RETETE.find(x => x.slug === slug);
  if (!r) return inchide();
  if (r !== curenta) { curenta = r; portii = r.portii; bifate = new Set(); facute = new Set(); }
  $("detaliu-titlu").textContent = r.titlu;
  aplicaMarimea();
  deseneazaDetaliu();
  $("cumparaturi").hidden = true;
  $("detaliu").hidden = false;
  $("detaliu").scrollTop = 0;
  document.body.style.overflow = "hidden";
  tineEcranul();
  if (inIstoric) try { history.pushState({slug}, "", "#" + slug); } catch (e) {}
}
function deschideCumparaturi(inIstoric) {
  deseneazaCumparaturi();
  $("detaliu").hidden = true;
  $("cumparaturi").hidden = false;
  document.body.style.overflow = "hidden";
  if (inIstoric) try { history.pushState({cos: 1}, "", "#cumparaturi"); } catch (e) {}
}
function inchide() {
  $("detaliu").hidden = true;
  $("cumparaturi").hidden = true;
  document.body.style.overflow = "";
  lasaEcranul();
  arataLista();
}
// „Înapoi” închide direct (history.back() reîncarcă pagina în unele vizualizatoare); intrarea din istoric rămâne pentru butonul fizic.
const inapoi = () => { inchide(); try { history.replaceState(null, "", "#"); } catch (e) {} };

// ---------- evenimente ----------
$("detaliu-continut").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (b) { portii = Math.max(1, portii + Number(b.dataset.d)); deseneazaDetaliu(); return; }
  if (e.target.closest("#in-cos")) {
    if (cos[curenta.slug]) delete cos[curenta.slug]; else cos[curenta.slug] = portii;
    memorie.scrie("cos", cos); numarCos(); deseneazaDetaliu(); return;
  }
  if (e.target.closest("#btn-poza")) { $("poza-fisier").value = ""; $("poza-fisier").click(); return; }
  const t = e.target.closest("button.timp");
  if (t) {
    const c = cronometre.find(x => butonul(x) === t);
    if (c) opreste(c.id); else porneste(+t.dataset.s, `pas ${t.closest("li")?.value ?? ""} · ${t.textContent.replace("⏱ ", "")}`, t);
    return;
  }
  const li = e.target.closest("ol li");
  if (li) {
    const k = [...$("detaliu-continut").querySelectorAll("ol li")].indexOf(li);
    if (facute.has(k)) facute.delete(k); else facute.add(k);
    li.classList.toggle("facut", facute.has(k));
  }
});
$("detaliu-continut").addEventListener("change", e => {
  const el = e.target;
  if (el.id === "portii") { portii = Math.max(1, Math.round(Number(el.value)) || 1); deseneazaDetaliu(); }
  else if (el.dataset.k !== undefined) {
    const k = Number(el.dataset.k);
    if (el.checked) bifate.add(k); else bifate.delete(k);
    el.closest("li").classList.toggle("bifat", el.checked);
  }
});
$("cumparaturi-continut").addEventListener("click", e => {
  const s = e.target.closest("button[data-scoate]");
  if (s) { delete cos[s.dataset.scoate]; memorie.scrie("cos", cos); numarCos(); deseneazaCumparaturi(); }
});
$("cumparaturi-continut").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.id === undefined) return;
  if (el.checked) cumparate.add(el.dataset.id); else cumparate.delete(el.dataset.id);
  memorie.scrie("cumparate", [...cumparate]);
  el.closest("li").classList.toggle("bifat", el.checked);
});
$("poza-fisier").addEventListener("change", e => { const f = e.target.files[0]; if (f && curenta) urcaPoza(f); });
$("goleste").addEventListener("click", () => { cos = {}; cumparate = new Set(); memorie.scrie("cos", cos); memorie.scrie("cumparate", []); numarCos(); deseneazaCumparaturi(); });
$("btn-cumparaturi").addEventListener("click", () => deschideCumparaturi(true));
$("inapoi-cumparaturi").addEventListener("click", inapoi);
$("inapoi").addEventListener("click", inapoi);
$("cronometre").addEventListener("click", e => { const b = e.target.closest(".cron"); if (b) opreste(+b.dataset.id); });
$("btn-timer").addEventListener("click", () => aratuTimer($("timer-panou").hidden));
$("btn-timer-lista").addEventListener("click", () => aratuTimer($("timer-panou").hidden));
$("timer-inchide").addEventListener("click", () => aratuTimer(false));
$("timer-start").addEventListener("click", () => { const m = Math.round(Number($("timer-minute").value)); if (m > 0) { porneste(m * 60, `${m} min`); aratuTimer(false); } });
$("timer-minute").addEventListener("keydown", e => { if (e.key === "Enter") $("timer-start").click(); });
$("timer-presetari").addEventListener("click", e => { const b = e.target.closest("button[data-min]"); if (b) { porneste(+b.dataset.min * 60, `${b.dataset.min} min`); aratuTimer(false); } });
$("btn-text").addEventListener("click", () => { marime = (marime + 1) % 3; memorie.scrie("marime", marime); aplicaMarimea(); });
document.querySelector(".sari").addEventListener("click", e => {
  const b = e.target.closest("button[data-tinta]");
  if (b) $(b.dataset.tinta)?.scrollIntoView({behavior: "smooth", block: "start"});
});
$("lista").addEventListener("click", e => {
  const a = e.target.closest("a.card");
  if (a) { e.preventDefault(); deschide(a.dataset.slug, true); }
});
$("stari").addEventListener("click", e => {
  const b = e.target.closest("button[data-stare]");
  if (b) { b.classList.toggle("activ"); if (b.classList.contains("activ")) filtru.stari.add(b.dataset.stare); else filtru.stari.delete(b.dataset.stare); arataLista(); }
});
$("btn-filtre").addEventListener("click", () => { const f = $("filtre"); f.hidden = !f.hidden; $("btn-filtre").textContent = f.hidden ? "filtre ▾" : "filtre ▴"; });
$("filtre").addEventListener("click", e => {
  const b = e.target.closest("button.chip");
  if (!b) return;
  const cheie = Object.keys(b.dataset)[0];  // sort | cat | tag
  filtru[cheie] = b.dataset[cheie];
  b.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("activ", c === b));
  arataLista();
});
$("cautare").addEventListener("input", arataLista);
window.addEventListener("popstate", () => {  // înapoi/înainte în browser, sau hash schimbat manual
  const s = history.state || {}, slug = s.slug || location.hash.slice(1);
  if (s.cos || slug === "cumparaturi") deschideCumparaturi(false);
  else if (RETETE.some(x => x.slug === slug)) deschide(slug, false); else inchide();
});

// ---------- pornire ----------
chipuri("categorii", Object.keys(CATEGORII).filter(c => RETETE.some(r => r.categorie === c)).map(c => [c, CATEGORII[c]]), "", "cat");
chipuri("taguri", [...new Set(RETETE.flatMap(r => r.tags))].sort((a, b) => a.localeCompare(b, "ro")).map(t => [t, "#" + t]), "", "tag");
numarCos();
$("timer-presetari").innerHTML = [1, 2, 3, 5, 8, 10, 15, 20, 30, 45].map(m => `<button class="chip" type="button" data-min="${m}">${m} min</button>`).join("");
if (location.hash === "#cumparaturi") deschideCumparaturi(false);
else if (RETETE.some(x => x.slug === location.hash.slice(1))) deschide(location.hash.slice(1), false); else inchide();
</script>
